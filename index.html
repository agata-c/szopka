/* ======================================================================
   6 · THE WAWEL DRAGON
   A chunky glossy vinyl-toy dragon — smooth polished plastic, high
   segment counts, big round head, gold belly / crest / toes and a
   heart-shaped tail spade. Sits in the central niche. Local space:
   feet on y = 0, snout pointing +Z, so it faces out of the cave.

   The whole model is authored in DRAGON-LOCAL coordinates and then
   offset into the right pivot group, so every pivot rotates from a
   sensible point: the head pivots at the base of the skull, the jaw at
   the back of the snout, the tail at the root.
   ====================================================================== */
const dragon = new THREE.Group();
const dragonMeshes = [];
const DRAGON_SCALE = 0.93;      // model is 2.25 tall incl. horns → 2.09 world
{
  /* ---- materials: glossy vinyl, deliberately NOT the crinkled foil ---- */
  const vinylGreen = new THREE.MeshPhysicalMaterial({
    color: 0x3FA46E, roughness: 0.28, metalness: 0,
    clearcoat: 1, clearcoatRoughness: 0.06,
    /* A full-strength env reflection turns the low-lying tail into chrome at
       grazing angles — a toy is glossy, not mirrored. */
    envMapIntensity: 0.45,
  });
  const vinylGold = new THREE.MeshPhysicalMaterial({
    color: 0xE0A24E, metalness: 0.9, roughness: 0.22, clearcoat: 0.6,
    envMapIntensity: 0.45,
  });
  const eyeMat = new THREE.MeshPhysicalMaterial({
    color: 0x12301F, roughness: 0.05, metalness: 0, clearcoat: 1,
  });
  const hiMat   = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  const mouthMat = new THREE.MeshStandardMaterial({ color: 0x5E1622, roughness: 0.5, metalness: 0 });
  /* only the ones that should light up on hover */
  const DRAGON_MATS = [vinylGreen, vinylGold, eyeMat, mouthMat];
  var dragonMaterials = DRAGON_MATS;
  var dragonHiMat = hiMat;

  const add = (m, parent) => { m.castShadow = true; m.receiveShadow = true; parent.add(m); dragonMeshes.push(m); return m; };
  /* smooth high-poly spheres sell the toy look; tiny parts can be cheaper */
  const ball = (r, seg) => new THREE.SphereGeometry(r, seg || 32, seg ? Math.round(seg * 0.75) : 24);

  dragon.scale.setScalar(DRAGON_SCALE);
  dragon.position.set(0, NICHE_FLOOR + 0.01, NICHE_MID + 0.08);
  dragon.rotation.y = -0.2;
  szopka.add(dragon);
  // the body pivot's resting height, so the startle hop can return exactly to it
  var dragonBaseY = 0.6;

  /* Pivot chain. bodyPivot is the breathing pivot; neck rears the head back;
     headPivot sits at dragon-local (0, 1.3, 0.06) — that z matches the value
     animateDragon() writes during a fire, so the head never pops. */
  const bodyPivot = new THREE.Group();
  bodyPivot.position.y = dragonBaseY;
  dragon.add(bodyPivot);
  var dragonBody = bodyPivot;

  const neck = new THREE.Group();
  /* z is pushed forward so that at the peak of the rear-back the back of the
     skull still clears the cave's back wall */
  neck.position.set(0, 0.6, 0.30);        // dragon-local (0, 1.2, 0.30)
  bodyPivot.add(neck);
  var dragonNeck = neck;

  const headPivot = new THREE.Group();
  headPivot.position.set(0, 0.1, 0.03);   // dragon-local (0, 1.3, 0.06)
  neck.add(headPivot);
  var dragonHead = headPivot;

  /* ==================================================================
     BODY — all coordinates dragon-local, minus the bodyPivot offset
     ================================================================== */
  const B = -0.6;                          // dragon-local → bodyPivot-local

  // torso: a pear/egg
  const torso = add(new THREE.Mesh(ball(0.55), vinylGreen), bodyPivot);
  torso.scale.set(1.0, 1.15, 0.9);
  torso.position.set(0, 0.62 + B, 0);

  // gold belly plate — a raised oval from under the chin to between the legs
  const belly = add(new THREE.Mesh(ball(0.5), vinylGold), bodyPivot);
  belly.scale.set(0.6, 0.95, 0.32);
  belly.position.set(0, 0.62 + B, 0.34);

  // haunches: big rounded back legs
  for (const s of [-1, 1]){
    const h = add(new THREE.Mesh(ball(0.34), vinylGreen), bodyPivot);
    h.scale.set(0.85, 0.95, 1.15);
    h.position.set(s * 0.42, 0.32 + B, 0);
  }

  // front legs: chunky capsules standing straight down to the ground
  for (const s of [-1, 1]){
    const leg = add(new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.35, 6, 20), vinylGreen), bodyPivot);
    leg.position.set(s * 0.2, 0.3 + B, 0.38);
  }

  // gold bean toes, 3 per foot, fanned slightly
  const toe = (x, z, spread) => {
    for (let i = 0; i < 3; i++){
      const t = add(new THREE.Mesh(ball(0.065, 16), vinylGold), bodyPivot);
      t.scale.set(1, 0.7, 1.35);
      t.position.set(x + (i - 1) * spread, 0.05 + B, z + Math.abs(i - 1) * -0.03);
      t.rotation.y = (i - 1) * 0.22;
    }
  };
  for (const s of [-1, 1]) toe(s * 0.2, 0.52, 0.1);      // under each front leg
  for (const s of [-1, 1]) toe(s * 0.5, 0.3, 0.1);       // in front of each haunch

  // a short neck capsule, mostly hidden between body and head
  const neckMesh = add(new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.12, 6, 20), vinylGreen), neck);
  neckMesh.position.set(0, 0, 0);

  /* ==================================================================
     HEAD — dragon-local, minus the headPivot offset (0, 1.3, 0.06)
     ================================================================== */
  const H = (x, y, z) => [x, y - 1.3, z - 0.06];   // dragon-local → headPivot-local

  // skull: the big round head
  const skull = add(new THREE.Mesh(ball(0.52), vinylGreen), headPivot);
  skull.scale.set(1.05, 0.95, 1.0);
  skull.position.set(...H(0, 1.62, 0.08));

  // upper snout: a rounded muzzle off the lower front of the skull
  const snout = add(new THREE.Mesh(ball(0.3), vinylGreen), headPivot);
  snout.scale.set(1.05, 0.72, 1.0);
  snout.position.set(...H(0, 1.5, 0.55));

  // nostrils: raised nubs on top of the snout tip, each with a dark inset
  for (const s of [-1, 1]){
    const n = add(new THREE.Mesh(ball(0.07), vinylGreen), headPivot);
    n.scale.set(1, 0.8, 0.8);
    n.position.set(...H(s * 0.11, 1.6, 0.8));
    const hole = add(new THREE.Mesh(ball(0.032, 16), eyeMat), headPivot);
    hole.scale.set(1, 0.6, 1);
    hole.position.set(...H(s * 0.11, 1.605, 0.835));
    hole.castShadow = false;
  }

  /* ---- eyes: on the SIDES, turned ~35° outward ---- */
  const eyes = [];
  for (const s of [-1, 1]){
    const eg = new THREE.Group();
    eg.position.set(...H(s * 0.36, 1.7, 0.36));
    eg.rotation.y = -s * 0.61;                 // outward from forward
    eg.userData.eye = true;
    headPivot.add(eg);

    // the eyeball, flattened into a dome
    const ball2 = add(new THREE.Mesh(ball(0.16), eyeMat), eg);
    ball2.scale.set(1, 1, 0.7);
    ball2.position.z = 0.03;
    ball2.castShadow = false;

    // white catchlight, upper front
    const hi = new THREE.Mesh(ball(0.035, 16), hiMat);
    hi.position.set(s * 0.045, 0.055, 0.12);
    eg.add(hi);

    eyes.push(eg);
  }
  var dragonEyes = eyes;

  const AXIS_Y = new THREE.Vector3(0, 1, 0);
  /* ---- horns & spikes: one moulded lathe each, gumdrop-shaped ----
     A cone with a ball glued on reads as a stalk with a bead on top. This
     profile is fat at the base and curves smoothly to a soft point, so it
     looks like one piece of poured plastic.
     `fat` keeps the profile full over the first stretch of the height
     (dragon horns are thick most of the way before they narrow). */
  const gumdrop = (r, h, N = 26, fat = 0) => {
    const pts = [];
    for (let i = 0; i <= N; i++){
      const t = i / N;
      // wide at the base, tapering to a softly rounded point
      let rr = r * Math.pow(1 - Math.pow(t, 1.9), 0.42);
      // a slight bulge so the widest point sits a little above the base
      rr *= 1 + 0.07 * Math.sin(Math.PI * t);
      if (fat > 0 && t < fat) rr *= 1 + 0.30 * (1 - t / fat);
      pts.push(new THREE.Vector2(Math.max(0.002, rr), t * h));
    }
    const g = new THREE.LatheGeometry(pts, 26);
    if (fat > 0){
      // gentle backward curve: sweep each ring back along -Z by 0.12·t²
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++){
        const t = clamp(pos.getY(i) / h, 0, 1);
        pos.setZ(i, pos.getZ(i) - 0.12 * t * t);
      }
      pos.needsUpdate = true;
      g.computeVertexNormals();
    }
    return g;
  };
  /** Gold horn/spike. `sink` pushes the base down its own axis so it grows
      out of whatever it sits on instead of resting on top of it. */
  const goldSpike = (parent, r, h, pos, rot, sink = 0, fat = 0) => {
    const g = new THREE.Group();
    g.position.set(...pos);
    g.rotation.set(...rot);
    parent.add(g);
    const m = add(new THREE.Mesh(gumdrop(r, h, 26, fat), vinylGold), g);
    m.position.y = -sink;
    return g;
  };

  // 2 main horns: tall, thick for most of their length, curving backwards
  for (const s of [-1, 1]){
    goldSpike(headPivot, 0.11, 0.46, H(s * 0.2, 2.02, 0.05), [-0.2, 0, -s * 0.26], 0.1, 0.3);
  }
  // crest of 2 smaller horns down the back of the head
  goldSpike(headPivot, 0.09, 0.18, H(0, 1.98, -0.18), [-0.4, 0, 0], 0.08);
  goldSpike(headPivot, 0.08, 0.16, H(0, 1.85, -0.33), [-0.45, 0, 0], 0.07);

  /* ---- jaw: the lower half of the muzzle ---- */
  const jawPivot = new THREE.Group();
  jawPivot.position.set(0, 1.3 - 1.3, 0.3 - 0.06);   // back of the snout
  headPivot.add(jawPivot);
  var dragonJaw = jawPivot;
  const jaw = add(new THREE.Mesh(ball(0.27), vinylGreen), jawPivot);
  jaw.scale.set(1.0, 0.5, 0.95);
  jaw.position.set(0, 0.09, 0.22);
  // dark interior, revealed when the jaw drops
  const mouth = new THREE.Mesh(ball(0.23, 20), mouthMat);
  mouth.scale.set(0.8, 0.3, 0.8);
  mouth.position.set(0, 0.12, 0.2);
  jawPivot.add(mouth);
  dragonMeshes.push(mouth);
  // throat glow, lit when breathing fire
  const throat = new THREE.Mesh(
    ball(0.15, 20),
    new THREE.MeshBasicMaterial({ color: 0xFF7A1C, transparent: true, opacity: 0 })
  );
  throat.position.set(0, 0.14, 0.22);
  headPivot.add(throat);
  var dragonThroat = throat;

  /* ==================================================================
     BACK — 2 small bat wings
     ================================================================== */
  // small bat wings: a flat scalloped shape with raised ribs
  const wingShape = () => {
    const w = new THREE.Shape();
    w.moveTo(0, 0.06);
    w.quadraticCurveTo(0.26, 0.30, 0.50, 0.22);        // leading edge out to the tip
    w.quadraticCurveTo(0.40, 0.10, 0.44, 0.02);        // scallop 1
    w.quadraticCurveTo(0.34, 0.06, 0.30, -0.08);
    w.quadraticCurveTo(0.22, 0.00, 0.18, -0.14);       // scallop 2
    w.quadraticCurveTo(0.10, -0.06, 0.05, -0.16);
    w.quadraticCurveTo(0.01, -0.08, 0, 0.06);          // scallop 3, back to the root
    w.closePath();
    return w;
  };
  for (const s of [-1, 1]){
    /* The left wing is a 180° yaw, not a negative scale — mirroring with
       scale.x = -1 flips the winding and the plate renders inside-out. */
    const wg = new THREE.ExtrudeGeometry(wingShape(), {
      depth: 0.04, bevelEnabled: true, bevelSize: 0.018, bevelThickness: 0.016,
      bevelSegments: 2, curveSegments: 10,
    });
    const shoulder = new THREE.Group();
    shoulder.position.set(s * 0.3, 1.16 + B, -0.3);
    bodyPivot.add(shoulder);
    // yaw sweeps the wing backwards, then roll lifts the tip
    const yaw = s > 0 ? 0.62 : Math.PI + 0.62;
    shoulder.rotation.y = yaw;
    const tilt = new THREE.Group();
    tilt.rotation.z = 0.5;
    shoulder.add(tilt);

    const wm = new THREE.Mesh(wg, vinylGold);
    wm.castShadow = true;
    wm.position.set(0.05, 0, -0.02);
    wm.scale.setScalar(0.85);
    tilt.add(wm);
    dragonMeshes.push(wm);

    /* 3 thin raised ribs fanning out along the wing. The left wing is the
       right one yawed by π, so its plate faces backwards — the rib offset has
       to be mirrored or the fan ends up on the hidden face. */
    const ribZ = s < 0 ? -0.03 : 0.03;
    for (let k = 0; k < 3; k++){
      const rib = new THREE.Mesh(new THREE.CapsuleGeometry(0.016, 0.3, 4, 10), vinylGold);
      rib.castShadow = true;
      rib.rotation.z = (k - 1) * 0.34;
      rib.position.set(0.2, 0.01, ribZ);
      tilt.add(rib);
      dragonMeshes.push(rib);
    }
  }

  /* ==================================================================
     TAIL — a thick tapering tube that wraps the RIGHT side and ends in
     FRONT beside the right haunch (the niche is only 1.5 deep, so it
     must not trail far backwards).
     ================================================================== */
  const TAIL_BASE = [0, 0.25, -0.42];      // dragon-local
  const tailPivot = new THREE.Group();
  tailPivot.position.set(...[TAIL_BASE[0], TAIL_BASE[1] + B, TAIL_BASE[2]]);
  bodyPivot.add(tailPivot);
  var dragonTail = tailPivot;

  const tailPts = [
    [0, 0.25, -0.42], [0.42, 0.15, -0.5], [0.78, 0.15, -0.18],
    [0.84, 0.2, 0.22], [0.72, 0.42, 0.46],
  ].map(p => new THREE.Vector3(
    p[0] - TAIL_BASE[0], p[1] - TAIL_BASE[1], p[2] - TAIL_BASE[2]));

  const tailCurve = new THREE.CatmullRomCurve3(tailPts, false, 'catmullrom', 0.5);

  /* hand-built tapered tube, so the tail thins from 0.16 down to 0.06 */
  const SEG = 48, RAD = 10;
  const tg = new THREE.BufferGeometry();
  const tpos = [], tidx = [];
  const frames = tailCurve.computeFrenetFrames(SEG, false);
  for (let i = 0; i <= SEG; i++){
    const t = i / SEG;
    const p = tailCurve.getPoint(t);
    const r = lerp(0.16, 0.06, t);
    const N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j <= RAD; j++){
      const a = (j / RAD) * TAU;
      const nx = -Math.cos(a) * N.x - Math.sin(a) * B.x;
      const ny = -Math.cos(a) * N.y - Math.sin(a) * B.y;
      const nz = -Math.cos(a) * N.z - Math.sin(a) * B.z;
      tpos.push(p.x + nx * r, p.y + ny * r, p.z + nz * r);
    }
  }
  for (let i = 0; i < SEG; i++){
    for (let j = 0; j < RAD; j++){
      const a = i * (RAD + 1) + j, b = a + RAD + 1, c = b + 1, d = a + 1;
      /* outward-facing winding — the other order makes the tube back-face
         culled from outside and the tail renders see-through */
      tidx.push(a, d, b, b, d, c);
    }
  }
  /* cap the START ring, so no hole shows if the base ever peeks out of the
     body. */
  {
    const hub = tpos.length / 3;
    tpos.push(tailCurve.getPoint(0).x, tailCurve.getPoint(0).y, tailCurve.getPoint(0).z);
    for (let j = 0; j < RAD; j++) tidx.push(hub, j + 1, j);
  }
  /* and cap the END ring, facing outward along the tangent, so the open end
     can never be seen through — the heart spade sits over it */
  {
    const hub = tpos.length / 3;
    tpos.push(tailCurve.getPoint(1).x, tailCurve.getPoint(1).y, tailCurve.getPoint(1).z);
    const base = SEG * (RAD + 1);
    for (let j = 0; j < RAD; j++) tidx.push(hub, base + j, base + j + 1);
  }
  tg.setAttribute('position', new THREE.Float32BufferAttribute(tpos, 3));
  tg.setIndex(tidx);
  /* derive the normals from the winding rather than trusting the hand-pushed
     radial ones: with clearcoat the shading is unforgiving of a flipped normal
     and the whole tail renders as chrome. */
  tg.computeVertexNormals();
  add(new THREE.Mesh(tg, vinylGreen), tailPivot);

  /* 3 gold spikes sitting ON the tail, along its upward-facing normal.
     The old version offset each cone by only its own radius, so they ended
     up buried inside the tube. */
  for (const [tt, r, h] of [[0.28, 0.06, 0.16], [0.52, 0.05, 0.13], [0.74, 0.042, 0.10]]){
    const p = tailCurve.getPoint(tt);
    const tan = tailCurve.getTangent(tt).normalize();
    // world up, projected onto the plane perpendicular to the tail
    const nrm = new THREE.Vector3(0, 1, 0)
      .addScaledVector(tan, -tan.y).normalize();
    const rad = lerp(0.16, 0.06, tt);
    const g = goldSpike(tailPivot, r, h, [0, 0, 0], [0, 0, 0], 0);
    g.quaternion.setFromUnitVectors(AXIS_Y, nrm);   // +Y becomes the surface normal
    // base on the surface, 2 cm sunk in so there is no seam. (Offsetting by
    // rad + h*0.35 and sinking the mesh by h*0.35 lands in the same place.)
    g.position.copy(p).addScaledVector(nrm, rad - 0.02);
  }

  /* The tip: a gold heart that IS the end of the tail. It is centred on its
     bottom point, aligned with the tail's tangent, and spun so the flat face
     shows to the front camera like a flag. */
  const heart = new THREE.Shape();
  const HS = 0.86;                               // ≈0.28 wide once bevelled
  heart.moveTo(0, -0.13 * HS);
  heart.bezierCurveTo(0.15 * HS, 0.02, 0.11 * HS, 0.14 * HS, 0, 0.07 * HS);
  heart.bezierCurveTo(-0.11 * HS, 0.14 * HS, -0.15 * HS, 0.02, 0, -0.13 * HS);
  const HEART_D = 0.075;
  const heartGeo = new THREE.ExtrudeGeometry(heart, {
    /* a thin bevel: the old 0.03 thickness on a 0.06 depth consumed the whole
       extrusion and rounded the heart into a featureless capsule */
    depth: HEART_D, bevelEnabled: true, bevelSize: 0.016, bevelThickness: 0.013,
    bevelSegments: 3, curveSegments: 14,
  });
  heartGeo.translate(0, 0.13 * HS, -HEART_D / 2);   // bottom point → origin, z centred
  const spadeMesh = add(new THREE.Mesh(heartGeo, vinylGold), tailPivot);
  {
    const tip = tailCurve.getPoint(1);
    const tan = tailCurve.getTangent(1).normalize();
    // basis: Y along the tail (the heart carries on from the tip),
    // Z as close to the viewer's axis as the tangent allows, so the face
    // reads as a flag rather than a sliver.
    const zAxis = new THREE.Vector3(0, 0, 1)
      .addScaledVector(tan, -tan.z).normalize();
    const xAxis = new THREE.Vector3().crossVectors(tan, zAxis).normalize();
    spadeMesh.quaternion.setFromRotationMatrix(
      new THREE.Matrix4().makeBasis(xAxis, tan, zAxis));
    // sit the heart slightly INSIDE the tip: pushed out past it, the point and
    // the tube end left a visible gap
    spadeMesh.position.copy(tip).addScaledVector(tan, -0.02);
  }

  /* a gold bead over the joint, so the heart's point and the capped tube end
     read as one moulded piece rather than two things butted together */
  {
    const tip = tailCurve.getPoint(1);
    const bead = add(new THREE.Mesh(ball(0.075, 20), vinylGold), tailPivot);
    bead.position.copy(tip);
  }

  /* ---- hover halo: a soft gold glow AROUND him, not a wash over him ----
     Boosting the materials' emissive turned the whole toy white on hover.
     This is an additive sprite parked just behind the dragon, so it reads as
     a rim of light instead of bleaching his colours. */
  const haloTex = new THREE.CanvasTexture(softDotCanvas(256, 0.0));
  haloTex.colorSpace = THREE.SRGBColorSpace;
  const dragonHalo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: haloTex, color: 0xE8B64A, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  dragonHalo.scale.setScalar(4.3);          // ≈2.5× the dragon's width
  dragonHalo.renderOrder = 1;
  szopka.add(dragonHalo);
  var dragonGlowSprite = dragonHalo;
}


/* ======================================================================
   6c · INSPECT MODE  (press "I")
   Development aid: lifts the dragon out of the cave onto the empty front
   of the island at double size so it can be orbited, hovered and clicked
   from every angle. Everything — breathing, blink, tail sway, fire —
   keeps running. Pressing "I" again restores the exact original state.
   ====================================================================== */
const inspect = { on: false, saved: null, target: new THREE.Vector3() };
{
  const ICON_SPOT = { pos: new THREE.Vector3(0, PED_H, GT_D / 2 + 3.0), rotY: 0, scale: DRAGON_SCALE * 2 };

  /* built in JS (not in the markup) so the page's own HTML/CSS stays as it was */
  const tag = document.createElement('div');
  tag.textContent = 'INSPECT';
  tag.style.cssText = [
    'position:fixed', 'right:18px', 'top:16px', 'z-index:20',
    'font:600 10px/1 ui-sans-serif,system-ui,sans-serif',
    'letter-spacing:.34em', 'color:#E8B64A',
    'background:rgba(10,12,20,.55)', 'border:1px solid rgba(232,182,74,.35)',
    'border-radius:999px', 'padding:7px 12px 6px',
    'display:none', 'transition:opacity .25s ease', 'pointer-events:none',
  ].join(';');
  document.body.appendChild(tag);
  var inspectTag = tag;

  function setInspect(on){
    if (on === inspect.on) return;
    inspect.on = on;
    if (on){
      // remember everything we are about to change, exactly
      inspect.saved = {
        pos: dragon.position.clone(),
        scale: dragon.scale.clone(),
        rot: dragon.rotation.clone(),
        camTarget: controls.target.clone(),
        minDistance: controls.minDistance,
      };
      dragon.position.copy(ICON_SPOT.pos);
      dragon.rotation.y = ICON_SPOT.rotY;
      dragon.scale.setScalar(ICON_SPOT.scale);
      controls.minDistance = 4;
      markInteraction();
    } else if (inspect.saved){
      dragon.position.copy(inspect.saved.pos);
      dragon.rotation.copy(inspect.saved.rot);
      dragon.scale.copy(inspect.saved.scale);
      controls.minDistance = inspect.saved.minDistance;
      inspect.saved = null;
      markInteraction();
    }
    inspectTag.style.display = on ? 'block' : 'none';
  }
  var toggleInspect = setInspect;

  addEventListener('keydown', e => {
    if (e.key === 'i' || e.key === 'I') setInspect(!inspect.on);
  });
}
/** Ease the camera target toward the dragon while inspecting, and back to the
    island when leaving. Called from the main loop. */
function updateInspect(dt){
  if (inspect.on){
    dragon.getWorldPosition(inspect.target);
    controls.target.lerp(inspect.target, 1 - Math.exp(-dt * 3.5));
  } else if (inspect.saved){
    controls.target.lerp(inspect.saved.camTarget, 1 - Math.exp(-dt * 3.5));
  }
}

/* ---------- 7a · FAIRY LIGHTS (strings on gold lines, bulb + wire) ---------- */
const bulbs = [];
const fairyGroup = new THREE.Group();
szopka.add(fairyGroup);
{
  const bulbGeo = worldUV(new THREE.SphereGeometry(0.05, 8, 6));
  const bulbMat = new THREE.MeshStandardMaterial({
    color: 0xFFE9B0, emissive: 0xFFD27A, emissiveIntensity: 1.0,
    roughness: 0.3, metalness: 0.0, toneMapped: true,
  });
  var fairyMat = bulbMat;
  /* By day the bulbs are unlit gold glass, so they read as beads rather than
     black dots against the foil. */
  const DAY_BULB = new THREE.Color(0xD9B878);
  var fairyDay = DAY_BULB;

  const wireGeos = [];
  const SAG = 0.13;

  /**
   * One light string: `pts` are the anchor points of the wire in order.
   * Every segment gets `n` evenly-spaced bulbs, and a thin gold tube follows
   * the same sagging curve. The caller sets the stand-off, since it depends on
   * how far the surface it hangs on stands proud of the tier behind it.
   */
  const string = (pts, nPerSeg = 3, sag = SAG, closed = false) => {
    const wire = [];
    const segs = closed ? pts.length : pts.length - 1;
    for (let s = 0; s < segs; s++){
      const a = pts[s], b = pts[(s + 1) % pts.length];
      // the wire sags between the anchors
      const mid = a.clone().lerp(b, 0.5);
      mid.y -= sag;
      wire.push(mid);
      for (let i = 0; i < nPerSeg; i++){
        const t = (i + 0.5) / nPerSeg;
        const p = a.clone().lerp(b, t);
        p.y -= sag * Math.sin(Math.PI * t);
        bulbs.push({ pos: p, phase: rnd() * TAU, rate: rr(0.7, 1.7), base: rr(0.8, 1.25) });
      }
    }
    if (wire.length >= 2){
      const full = closed ? pts.concat([pts[0]]) : pts;
      const curvePts = [];
      for (let i = 0; i < full.length - 1; i++){
        curvePts.push(full[i]);
        curvePts.push(wire[i].clone().lerp(full[i + 1], 0.5));
      }
      curvePts.push(full[full.length - 1]);
      wireGeos.push(new THREE.TubeGeometry(
        new THREE.CatmullRomCurve3(curvePts), Math.max(8, curvePts.length * 2), 0.008, 4, false));
    }
  };
  /** n bulbs along a straight run (used for the vertical tower strings). */
  const run = (a, b, n) => {
    for (let i = 0; i < n; i++){
      const p = a.clone().lerp(b, (i + 0.5) / n);
      bulbs.push({ pos: p, phase: rnd() * TAU, rate: rr(0.7, 1.7), base: rr(0.8, 1.25) });
    }
    wireGeos.push(new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3([a, a.clone().lerp(b, 0.5), b]), 8, 0.008, 4, false));
  };

  /* ---- GROUND TIER PARAPET: a swag between each pair of pinnacles, all 4 sides ----
     The gold crenellation band is the line everything hangs from. The merlons
     are 0.18 deep, so the string has to clear their outer face rather than
     their centre plane — hence its own stand-off. */
  {
    /* The crenellation sits in the channel between the merlons' top face
       (parapetY + 0.15) and the attic roof slab's underside (parapetY + 0.275),
       and the slab only reaches z/x ±2.68 — so the string has to hang just
       outside the merlons' outer face, clear of both. */
    const py = parapetY + 0.21;
    const pd = GT_D + 0.16 + 0.13, pw = GT_W + 0.16 + 0.13;
    const P_OUT = 0.19;                    // 0.10 clear of the merlons' outer face
    const inner = TOWER_X - 0.9;
    // front + back: merlons every 0.46, pinnacles every second one
    const nF = Math.max(2, Math.round((2 * inner) / 0.46));
    for (const fz of [pd / 2 + P_OUT, -pd / 2 - P_OUT]){
      const us = [];
      for (let i = 0; i < nF; i++) us.push(-inner + (i + 0.5) * ((2 * inner) / nF));
      for (let i = 0; i + 1 < us.length; i += 2)
        string([V(us[i], py, fz), V(us[i + 1], py, fz)], 3, 0.08);
    }
    // the two side runs, which stop behind the towers
    const nS = Math.max(2, Math.round((pd / 2 + 0.45) / 0.46));
    for (const sx of [pw / 2 + P_OUT, -pw / 2 - P_OUT]){
      const zs = [];
      for (let i = 0; i < nS; i++) zs.push(pd / 2 - (i + 0.5) * ((pd / 2 + 0.45) / nS));
      for (let i = 0; i + 1 < zs.length; i += 2)
        string([V(sx, py, zs[i]), V(sx, py, zs[i + 1])], 3, 0.08);
    }
  }

  /* ---- TOWERS: 2 straight vertical strings down the front corner pilasters ----
     The corner pilasters stand proud on two faces at once, so the string sits
     diagonally off the corner. It starts just above the ground tier's top
     cornice — that is a full-width slab reaching x ±5.21 / z ±2.71, so it
     encloses the tower corner completely and no string can pass through it. */
  {
    const tw = TOWER_W / 2, T_OUT = 0.13, yBot = 5.7;
    const fz = TOWER_Z + tw + T_OUT;
    for (const tx of [-TOWER_X, TOWER_X]){
      const top = tx < 0 ? GT_Y0 - 0.1 + 9.4 : GT_Y0 - 0.1 + 7.0;
      for (const sx of [-tw - T_OUT, tw + T_OUT]){
        run(V(tx + sx, yBot, fz), V(tx + sx, top - 0.4, fz),
            Math.max(3, Math.round((top - 0.4 - yBot) / 0.6)));
      }
    }
  }

  /* ---- MIDDLE TIER: swags between the bays, just under the top cornice ----
     The cornice's underside is at MT_Y1 - 0.16, so the string hangs below that
     with room for the bulb's own radius. M_OUT clears the bay panels, which
     stand about 0.09 proud of the tier's face. */
  {
    const py = MT_Y1 - 0.28, M_OUT = 0.18;
    const bay = (xs, fz) => { for (let i = 0; i + 1 < xs.length; i++) string([V(xs[i], py, fz), V(xs[i + 1], py, fz)]); };
    bay([-1.62, 0, 1.62], MT_D / 2 + M_OUT);          // front, 3 bays
    bay([-1.6, 0, 1.6], -MT_D / 2 - M_OUT);          // back
    for (const sx of [MT_W / 2 + M_OUT, -MT_W / 2 - M_OUT]) string([V(sx, py, -1), V(sx, py, 1)]);
  }

  /* ---- STAGE A: follow the square perimeter just under its cornice ----
     Cornice underside at 10.20, so the string clears it by the bulb radius.
     A_OUT is 0.10 rather than 0.05 because the bulbs are 0.05 in radius —
     at 0.05 the bead would sit exactly tangent to the panel. */
  {
    const py = 10.2 - 0.14, A_OUT = 0.10, hx = 1.5 + A_OUT, hz = 1.3 + A_OUT;
    // 6 per side: 3.0/6 = 0.5 and 2.6/6 = 0.43, i.e. the ~0.45 spacing rule
    string([V(-hx, py, hz), V(hx, py, hz), V(hx, py, -hz), V(-hx, py, -hz)], 6, 0.1, true);
  }

  /* ---- STAGE B: follow the octagon just under its cornice ----
     Cornice underside at 11.60. The corners stand off the corner pilasters and
     the mid-faces off the window frames, so both sit a touch further out. */
  {
    const py = 11.6 - 0.14, B_OUT = 0.26;
    const rC = 1.05 + B_OUT, rF = 1.05 * Math.cos(Math.PI / 8) + B_OUT;
    const ring = [];
    for (let k = 0; k < 8; k++){
      const ac = (k * TAU / 8) + Math.PI / 8;      // face corners
      const am = k * TAU / 8;                      // face centres
      ring.push(V(Math.sin(ac) * rC, py, Math.cos(ac) * rC));
      bulbs.push({ pos: V(Math.sin(am) * rF, py, Math.cos(am) * rF),
                   phase: rnd() * TAU, rate: rr(0.7, 1.7), base: rr(0.8, 1.25) });
    }
    string(ring, 0, 0.07, true);   // 0 = wire only, the bulbs are already placed
  }

  /* ---- one InstancedMesh for the bulbs ---- */
  const n = bulbs.length;
  const im = new THREE.InstancedMesh(bulbGeo, bulbMat, n);
  const m4 = new THREE.Matrix4();
  const col = new THREE.Color();
  for (let i = 0; i < n; i++){
    m4.makeTranslation(bulbs[i].pos.x, bulbs[i].pos.y, bulbs[i].pos.z);
    im.setMatrixAt(i, m4);
    im.setColorAt(i, col.copy(DAY_BULB));
  }
  im.instanceMatrix.needsUpdate = true;
  im.instanceColor.needsUpdate = true;
  im.castShadow = false; im.receiveShadow = false;
  im.frustumCulled = false;
  fairyGroup.add(im);
  var fairyMesh = im;
  var fairyCount = n;

  /* ---- all the gold wires merged into a single mesh ---- */
  {
    let vCount = 0, iCount = 0;
    for (const g of wireGeos){ vCount += g.attributes.position.count; iCount += g.index.count; }
    const wp = new Float32Array(vCount * 3), wn = new Float32Array(vCount * 3);
    const wi = new Uint32Array(iCount);
    let vo = 0, io = 0;
    for (const g of wireGeos){
      wp.set(g.attributes.position.array, vo * 3);
      wn.set(g.attributes.normal.array, vo * 3);
      const gi = g.index.array;
      for (let i = 0; i < gi.length; i++) wi[io + i] = gi[i] + vo;
      vo += g.attributes.position.count; io += gi.length;
    }
    const merged = new THREE.BufferGeometry();
    merged.setAttribute('position', new THREE.BufferAttribute(wp, 3));
    merged.setAttribute('normal', new THREE.BufferAttribute(wn, 3));
    merged.setIndex(new THREE.BufferAttribute(wi, 1));
    const wire = new THREE.Mesh(merged, goldFoil());
    wire.castShadow = true; wire.receiveShadow = true;
    wire.frustumCulled = false;
    fairyGroup.add(wire);
    var fairyWire = wire;
  }
}

/* ---------- 7c · FIRE + SMOKE PARTICLES (instanced billboards) ----------
   Both systems are the same instanced quad with a custom shader, so every
   particle carries its own colour and alpha (a shared material opacity would
   make them all fade together). */
const FIRE_MAX = 160, SMOKE_MAX = 90;

/** A pool of view-aligned billboard quads, each with its own colour + alpha. */
function makeParticlePool(cap, map, additive){
  const quad = new THREE.PlaneGeometry(1, 1);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.attributes.position = quad.attributes.position;
  geo.attributes.uv = quad.attributes.uv;
  geo.instanceCount = cap;

  const aPos   = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3), 3);
  const aSize  = new THREE.InstancedBufferAttribute(new Float32Array(cap), 1);
  const aColor = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3), 3);
  const aAlpha = new THREE.InstancedBufferAttribute(new Float32Array(cap), 1);
  for (const a of [aPos, aSize, aColor, aAlpha]) a.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aPos', aPos);
  geo.setAttribute('aSize', aSize);
  geo.setAttribute('aColor', aColor);
  geo.setAttribute('aAlpha', aAlpha);

  const mat = new THREE.ShaderMaterial({
    uniforms: { uMap: { value: map } },
    transparent: true,
    depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    vertexShader: `
      attribute vec3 aPos; attribute float aSize;
      attribute vec3 aColor; attribute float aAlpha;
      varying vec2 vUv; varying vec3 vCol; varying float vA;
      void main(){
        vUv = uv; vCol = aColor; vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(aPos, 1.0);
        // billboard: offset along the camera's right / up axes
        vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 up    = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        mv.xyz += (right * position.x + up * position.y) * aSize;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uMap;
      varying vec2 vUv; varying vec3 vCol; varying float vA;
      void main(){
        float a = texture2D(uMap, vUv).a * vA;
        if (a < 0.004) discard;
        gl_FragColor = vec4(vCol, a);
      }`,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 5;

  const pool = new Array(cap).fill(null);
  const free = [];
  for (let i = cap - 1; i >= 0; i--) free.push(i);
  return { geo, mat, mesh, pool, free, aPos, aSize, aColor, aAlpha, cap, additive };
}

const firePool  = makeParticlePool(FIRE_MAX, fireTex, true);
const smokePool = makeParticlePool(SMOKE_MAX, dotTex, false);
scene.add(firePool.mesh, smokePool.mesh);

function poolSpawn(pool, p){
  if (!pool.free.length) return null;
  const i = pool.free.pop();
  pool.pool[i] = p;
  return i;
}
function poolRelease(pool, i){
  pool.pool[i] = null;
  pool.free.push(i);
  pool.aSize.setX(i, 0);          // collapses the quad to nothing
}

/** Advance one pool: integrate, fade, and write the instance buffers. */
function poolUpdate(pool, dt, tNow){
  for (let i = 0; i < pool.cap; i++){
    const p = pool.pool[i];
    if (!p) continue;
    p.life += dt;
    if (p.life >= p.max){ poolRelease(pool, i); continue; }

    const k = p.life / p.max;
    p.vel.y += p.rise * dt;                 // buoyancy
    p.vel.multiplyScalar(Math.exp(-p.drag * dt));
    p.pos.addScaledVector(p.vel, dt);
    p.pos.x += Math.sin(tNow * 2.1 + p.seed * 31) * p.wobble * dt;
    p.pos.z += Math.cos(tNow * 1.7 + p.seed * 17) * p.wobble * 0.6 * dt;

    const size = p.size0 + p.grow * Math.pow(k, 0.55);
    const fade = smoothstep(0, p.fadeIn, k);
    const a = p.hold ? (1 - smoothstep(p.hold, 1, k)) : (1 - k * k);

    pool.aPos.setXYZ(i, p.pos.x, p.pos.y, p.pos.z);
    pool.aSize.setX(i, size);

    // colour ramp: white-yellow → orange → red → dark grey
    const tt = clamp(p.puff + k * 0.9, 0, 0.9999);
    const n = RAMP.length - 1;
    const fpos = tt * n, ii = Math.floor(fpos);
    _col.copy(RAMP[ii]).lerp(RAMP[ii + 1], fpos - ii);
    if (pool.additive){
      // additive: the per-particle alpha is the brightness, so overlaps add up
      const m = a * fade * p.alpha;
      pool.aColor.setXYZ(i, _col.r * m, _col.g * m, _col.b * m);
      pool.aAlpha.setX(i, 1);
    } else {
      pool.aColor.setXYZ(i, _col.r, _col.g, _col.b);
      pool.aAlpha.setX(i, a * fade * p.alpha);
    }
  }
  pool.aPos.needsUpdate = true;
  pool.aSize.needsUpdate = true;
  pool.aColor.needsUpdate = true;
  pool.aAlpha.needsUpdate = true;
}

/* the fire colour ramp: white-yellow → orange → red → dark grey smoke */
const RAMP = [
  new THREE.Color(1.6, 1.3, 0.62),
  new THREE.Color(1.2, 0.5, 0.09),
  new THREE.Color(0.5, 0.11, 0.02),
  new THREE.Color(0.07, 0.065, 0.065),
];

/*
 * The flame is a continuous stream, not one big burst: emitting ~140 particles
 * a second keeps only a handful overlapping at the mouth, so the additive
 * blend never saturates to white.
 */
let fireEmitAcc = 0;
function emitFireTick(dt, origin, dir, strength){
  fireEmitAcc += dt * 170 * strength;
  while (fireEmitAcc >= 1){
    fireEmitAcc -= 1;
    _v3.copy(dir)
      .add(_v3b.set(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(0.62))
      .normalize();
    poolSpawn(firePool, {
      pos: origin.clone().add(_v3b.set(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(0.16)),
      vel: _v3.multiplyScalar(rr(3.2, 7.4) * (0.6 + rnd() * 0.5)),
      life: 0, max: rr(0.3, 0.6),
      size0: rr(0.1, 0.24), grow: rr(0.3, 0.62),
      drag: rr(1.1, 2.2), rise: 0.7, wobble: 0.35, seed: rnd(),
      puff: rr(0, 0.05), fadeIn: 0.1, hold: 0.42, alpha: 0.62,
    });
  }
}

/** The smoke that lingers after the flame. */
function emitSmoke(origin, dir, n){
  for (let i = 0; i < n; i++){
    _v3.copy(dir).add(_v3b.set(rnd() - 0.5, rnd() - 0.2, rnd() - 0.5).multiplyScalar(0.6)).normalize();
    poolSpawn(smokePool, {
      pos: origin.clone().add(_v3b.set(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(0.16)),
      vel: _v3.multiplyScalar(rr(0.7, 2.0)),
      life: 0, max: rr(1.4, 2.1),
      size0: rr(0.16, 0.34), grow: rr(0.7, 1.4),
      drag: rr(0.8, 1.4), rise: 0.62, wobble: 0.3, seed: rnd(),
      puff: 0.58 + rnd() * 0.16, fadeIn: 0.12, hold: 0.5, alpha: 0.38,
    });
  }
}

/* ---------- 7e · SNOW (1500 flakes in a cylinder, off by default) ---------- */
let snowPoints = null, snowVel = null;
/* Flakes fall past the island into space, so they recycle well below it. */
const SNOW_N = Math.round(1500 * PARTICLE_SCALE), SNOW_R = 12, SNOW_Y0 = -12, SNOW_Y1 = 17;

/* Two accumulation levels in 0..1 drive the cap opacities. They rise while it
   snows and decay slowly when it stops, so switching snow off never erases the
   ground instantly — it slides off over ~90 s (or gets shaken off). */

{

/* snow caps: thin white shells that fade in on the roofs, domes and pedestal */
const snowCaps = [];
let snowCapMat = null;
{
  /* One shared material for every cap. The island cap carries a white
     `color` attribute, but `vertexColors` stays off so the roof slabs and dome
     shells — which have no such attribute — still render correctly. */
  snowCapMat = new THREE.MeshStandardMaterial({
    color: 0xE2EAF6, roughness: 0.88, metalness: 0,
    transparent: true, opacity: 0, depthWrite: false,
  });
  /* These caps sit on the szopka's roofs, so they are parented to `szopka`
     and ride the floating island with it. */
  const slab = (w, d, x, y, z, r = 0) => {
    const m = new THREE.Mesh(worldUV(new THREE.BoxGeometry(w, 0.07, d)), snowCapMat);
    m.position.set(x, y, z); m.rotation.y = r;
    m.receiveShadow = true; m.renderOrder = 2;
    szopka.add(m); snowCaps.push(m);
  };
  /** A white cap following a lathe profile, from t0 up to the tip. */
  const capOn = (geoFn, x, y, z, t0 = 0.45, grow = 1.025, seg = 24) => {
    const g = geoFn(t0, 1, seg, grow);
    const m = new THREE.Mesh(g, snowCapMat);
    m.position.set(x, y, z);
    m.renderOrder = 2;
    szopka.add(m); snowCaps.push(m);
    return m;
  };
  // the onion profile, shared by every dome on the model
  const onionProfile = (r, h) => (t0, t1, seg, grow = 1) => {
    const pts = [];
    const N = 20;
    for (let i = 0; i <= N; i++){
      const t = lerp(t0, t1, i / N);
      let rr2 = r * Math.sin(Math.PI * Math.pow(t, 0.72)) * (1 + 0.16 * Math.sin(Math.PI * t));
      if (t > 0.86) rr2 *= 1 - 0.35 * (t - 0.86) / 0.14;
      pts.push(new THREE.Vector2(Math.max(0.002, rr2 * grow), t * h));
    }
    return worldUV(new THREE.LatheGeometry(pts, seg));
  };
  const spireProfile = (r, h) => (t0, t1, seg, grow = 1) => {
    const pts = [];
    const N = 14;
    for (let i = 0; i <= N; i++){
      const t = lerp(t0, t1, i / N);
      const rr2 = r * Math.pow(1 - t, 0.72) * (1 - 0.06 * Math.sin(Math.PI * t));
      pts.push(new THREE.Vector2(Math.max(0.002, rr2 * grow), t * h));
    }
    return worldUV(new THREE.LatheGeometry(pts, seg));
  };

  /* the island's rock top: a cap that follows the irregular slab, not an
     octagon. It reuses the island's own top-rim ring geometry so it hugs the
     real silhouette. */
  const ped = (() => {
    const SEGS = ISLE_SEGS;
    const src = islandTopRing;
    const pos = [], col = [], idx = [];
    for (let s = 0; s < SEGS; s++){
      const i = s * 3;                          // ring 0: the true rock top edge
      pos.push(islandTopRing[i] * 0.985, islandTopRing[i + 1] + 0.02, islandTopRing[i + 2] * 0.985);
      col.push(1, 1, 1);
    }
    const centre = pos.length / 3;
    pos.push(0, PED_H + 0.02, 0); col.push(1, 1, 1);
    for (let s = 0; s < SEGS; s++) idx.push(centre, (s + 1) % SEGS, s);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, snowCapMat);
    m.receiveShadow = true; m.renderOrder = 2;
    island.add(m);              // rides the island
    return m;
  })();
  // the parapet roof, just under the crenellations
  slab(GT_W + 0.3, GT_D + 0.3, 0, GT_Y1 + 0.62, 0);
  // middle tier roof
  slab(MT_W + 0.24, MT_D + 0.24, 0, MT_Y1 + 0.02, 0);
  // tower roofs
  slab(TOWER_W + 0.4, TOWER_W + 0.4, -TOWER_X, GT_Y0 - 0.1 + 9.4 + 0.2, TOWER_Z);
  slab(TOWER_W + 0.4, TOWER_W + 0.4,  TOWER_X, GT_Y0 - 0.1 + 7.0 + 0.2, TOWER_Z);
  // back turret roofs
  slab(1.02, 1.02, -3.9, GT_Y0 + 2.48, -1.15);
  slab(1.02, 1.02,  3.9, GT_Y0 + 2.48, -1.15);
  // the central tower: stage roofs, the little helmet, the spire, every onion
  slab(3.0 + 0.2, 2.6 + 0.2, 0, 10.2 + 0.18, 0);
  /* Stage B is an octagon, so its cap has to be one too — a square slab put
     its corners out past the round cornice. 1.2 matches the 1.22 cornice, and
     the extra 0.035 lifts it clear of the cornice's top face. */
  {
    const m = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(1.2, 1.2, 0.07, 8)), snowCapMat);
    m.position.set(0, 11.6 + 0.15 + 0.035, 0);
    m.rotation.y = Math.PI / 8;
    m.receiveShadow = true; m.renderOrder = 2;
    szopka.add(m); snowCaps.push(m);
  }
  capOn(onionProfile(0.85, 1.8), 0, 12.3 + 0.12, 0, 0.5, 1.022, 24);

/* ---------- 7f · DEEP SPACE: gradient + nebula + stars ---------- */
let skyMat = null, starField = null;
{
  const skyGeo = new THREE.SphereGeometry(150, 32, 24);
  skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop:     { value: new THREE.Color(0x050814) },
      uBottom:  { value: new THREE.Color(0x070A1C) },
      uHorizon: { value: new THREE.Color(0x0E1433) },
      uNebA:    { value: new THREE.Color(0x7B3FC4) },
      uNebB:    { value: new THREE.Color(0x2350C8) },
      uNebStr:  { value: 1.0 },
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uTop, uBottom, uHorizon, uNebA, uNebB;
      uniform float uNebStr;
      varying vec3 vDir;

      float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
      float noise(vec3 p){
        vec3 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float n = mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                          mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                      mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                          mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
        return n;
      }
      float fbm(vec3 p){
        float s = 0.0, a = 0.5;
        for (int i = 0; i < 4; i++){ s += a * noise(p); p *= 2.07; a *= 0.5; }
        return s;
      }

      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 c = mix(uBottom, uHorizon, smoothstep(0.30, 0.52, h));
        c = mix(c, uTop, smoothstep(0.50, 0.92, h));

        // two soft nebula sheets, pushed off to the sides so they never sit
        // directly behind the szopka
        vec3 q1 = d * 2.1 + vec3(3.2, 0.4, -1.1);
        vec3 q2 = d * 3.4 + vec3(-2.6, -0.8, 2.0);
        float n1 = smoothstep(0.42, 0.92, fbm(q1));
        float n2 = smoothstep(0.46, 0.95, fbm(q2));
        c += uNebA * n1 * 0.18 * uNebStr;
        c += uNebB * n2 * 0.13 * uNebStr;

        gl_FragColor = vec4(c, 1.0);
        #include <colorspace_fragment>
      }`,
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  /* twinkling stars on a FULL sphere, so they show when orbiting underneath */
  const SN = Math.round(1100 * PARTICLE_SCALE);
  const sp = new Float32Array(SN * 3);
  const ss = new Float32Array(SN);
  const sph = new Float32Array(SN);
  for (let i = 0; i < SN; i++){
    // uniform on the sphere: y spans the full range, including below
    const a = rnd() * TAU;
    const y = rr(-1, 1);
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    sp[i * 3] = Math.cos(a) * r * 110;
    sp[i * 3 + 1] = y * 110;
    sp[i * 3 + 2] = Math.sin(a) * r * 110;
    ss[i] = rr(0.6, 2.6);
    sph[i] = rnd() * TAU;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  sg.setAttribute('aSize', new THREE.BufferAttribute(ss, 1));
  sg.setAttribute('aPhase', new THREE.BufferAttribute(sph, 1));
  const sm = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 }, uTex: { value: starTex } },
    vertexShader: `
      attribute float aSize; attribute float aPhase;
      uniform float uTime;
      varying float vTw;
      void main(){
        vTw = 0.55 + 0.45 * sin(uTime * 1.7 + aPhase * 6.2831);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (1.0 + vTw * 0.6) * (300.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uTex; uniform float uOpacity;
      varying float vTw;
      void main(){
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vec3(1.0, 0.97, 0.9) * vTw, t.a * uOpacity);
      }`,
  });
  starField = new THREE.Points(sg, sm);
  starField.frustumCulled = false;
  starField.renderOrder = -1;
  scene.add(starField);
  var starMat = sm;
}

/* Which line of the dictionary the caption element is holding. Every character

   text has to be re-rendered whenever the language changes — shown or not, or
   a hidden caption would sit on the markup's original English until the next

let captionKey = 'dragon';
/* When each character is next allowed to speak. Keyed by the same strings the
   dictionary uses, so the cooldown is per character with nothing to keep in
   step: the dragon, the Lajkonik, the sweep, the shepherd and the sheep each
   have their own. */
const CAPTION_COOLDOWN = 5;
const captionReady = {};
/** Show one of the dictionary's caption lines for three seconds — unless this
    character said it less than CAPTION_COOLDOWN seconds ago. Returns whether it
    was shown, though nothing needs to act on that. */
function showCaption(key){
  const ready = captionReady[key];
  if (ready !== undefined && t < ready) return false;
  captionReady[key] = t + CAPTION_COOLDOWN;
  captionKey = key;
  captionEl.textContent = T(key);
  captionEl.classList.add('show');

}

function setSnow(on){
  const wasOn = state.snowTarget > 0.5;
  state.snowTarget = on ? 1 : 0;
  btnSnow.classList.toggle('on', on);
  btnSnow.setAttribute('aria-pressed', String(on));
  snowState.textContent = on ? T('on') : T('off');
  // No immediate hide: what has settled and what is still falling keeps going,
  // so switching snow off never erases the ground instantly.
  snowPoints.visible = true;
  /* Switching snow ON respawns every flake high in the sky, so it visibly
     starts up there and the first flakes need a few seconds to arrive —
     otherwise a switch looks like snow already lying on the rock. */
  if (on && !wasOn && snowPoints){
    const arr = snowPoints.geometry.attributes.position.array;
    for (let i = 0; i < SNOW_N; i++){
      const i3 = i * 3;
      const a = rnd() * TAU, r = Math.sqrt(rnd()) * SNOW_R;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      /* the brief's spread, SNOW_Y1 - 6 … SNOW_Y1 + 10 — but a flake that
         spawns below a roof would "land" on the very first frame, which is
         exactly what this is meant to avoid. So lift it clear of whatever is
         already above its own column. */
      let floorY = 0;
      if (overSzopka(x, z - SZ_Z)){
        const rf = roofUnder(x, z - SZ_Z);
        if (rf) floorY = rf.islandY;
      }
      arr[i3]     = x;
      arr[i3 + 1] = Math.max(SNOW_Y1 - 6 + rnd() * 16, floorY + 4.0);
      arr[i3 + 2] = z;
    }
    snowPoints.geometry.attributes.position.needsUpdate = true;
  }
}

/* Double-click on the rock or the szopka shakes it. A double-click on the
   dragon is excluded — that still means fire. */
renderer.domElement.addEventListener('dblclick', () => {
  markInteraction();
  if (hovering) return;                       // dragon keeps its own clicks
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(szopka.children, true);
  let hitSomething = hits.length > 0;
  if (!hitSomething){
    const rock = [];
    island.children.forEach(o => { if (o.isMesh) rock.push(o); });
    hitSomething = raycaster.intersectObjects(rock, false).length > 0;
  }
  if (hitSomething) doShake();
});

/* On a touch screen dblclick never fires reliably, so two quick taps inside
   half a second shake the island the same way. A single tap still goes to the
   dragon, the Lajkonik, the sheep, the shepherd, the sweep or the sky, so the
   double tap is only read when the second one is genuinely quick. */
let _tapN = 0, _tapT = 0;
renderer.domElement.addEventListener('touchend', e => {
  markInteraction();
  const now = (performance && performance.now) ? performance.now() : t * 1000;
  if (now - _tapT < 480) _tapN++; else _tapN = 1;
  _tapT = now;
  if (_tapN < 2) return;
  _tapN = 0;
  if (hovering) return;                       // dragon keeps its own taps
  raycaster.setFromCamera(pointer, camera);
  let hit = raycaster.intersectObjects(szopka.children, true).length > 0;
  if (!hit){
    const solid = [];
    island.children.forEach(o => { if (o.isMesh) solid.push(o); });
    hit = raycaster.intersectObjects(solid, false).length > 0;
  }
  if (hit) doShake();
}, { passive: true });

/* The bottom stack (hint, buttons, credits) is one flex column, and the caption
   and help tooltip float above it, clearing it by --stackH. The height has to
   be measured rather than guessed: the bar grows a row when the pills wrap and
   the hint changes height with the language. Declared up here because
   applyLang() calls it, and a module-level function is not on window — an
   `if (window.f)` guard around it silently does nothing. */
const stackEl = document.getElementById('stack');
function publishStackHeight(){
  const r = stackEl.getBoundingClientRect();
  if (r.height > 0) document.documentElement.style.setProperty('--stackH', Math.round(r.height) + 'px');
}

/* ======================================================================
   SOUND · the engine

   One AudioContext, two buses. It is created here, at load, so that the
   thirteen files can be fetched and decoded in the background from the first
   moment — but browsers hold a context suspended until a gesture, so nothing
   is ever audible before the visitor has clicked or tapped something. The
   decoded buffers wait in `bank` until then.

   Every failure is swallowed deliberately: a missing sounds folder, a 404, a
   file that will not decode, or no Web Audio at all, must all leave the page
   working, silently, with nothing in the console. A name that never arrives
   is simply a name that plays nothing.
   ====================================================================== */
const AUDIO_FILES = {

  music: null,                    // { src, gain } — the one looping track
  on: false,                      // the visitor's choice, not the context's
  unlocked: false,                // a gesture has happened
  started: false,                 // the loop is running
  suspendT: 0,
};
audio.on = store.get('szopka.sound') === 'on';

function bootAudio(){
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;                                  // no Web Audio: stay silent
  try {
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = 0;                          // silent until asked for
    master.connect(ctx.destination);
    const musicBus = ctx.createGain();
    musicBus.gain.value = MUSIC_BUS_VOL;
    musicBus.connect(master);
    const sfxBus = ctx.createGain();
    sfxBus.gain.value = SFX_BUS_VOL;
    sfxBus.connect(master);
    audio.ctx = ctx; audio.master = master;
    audio.musicBus = musicBus; audio.sfxBus = sfxBus;
  } catch (e){
    audio.ctx = null;                               // never allowed to throw
    return;
  }
  for (const name in AUDIO_FILES) loadOne(name, AUDIO_FILES[name]);
}

/** Fetch and decode one file. Nothing it can do reaches the console. */
function loadOne(name, file){
  fetch('sounds/' + file).then(function(res){
    if (!res.ok) throw new Error(String(res.status));
    return res.arrayBuffer();
  }).then(function(raw){
    return audio.ctx.decodeAudioData(raw);
  }).then(function(decoded){
    audio.bank[name] = decoded;
    /* The visitor may well have switched the sound on before this file
       arrived — the tracks are several megabytes and load in the background —
       so the last one to land starts the music for them. It still waits for a
       gesture: a remembered preference is a wish, not a click. */
    if (audio.unlocked && audio.on && audio.started === false &&
        audio.bank['music-night']) audioOn();
  }).catch(function(){
    /* absent, unreachable or undecodable: this name simply plays nothing */
  });
}

/** The one looping track, started once and never restarted, so its playback
    position survives every phase switch. */
function startMusic(){
  if (audio.music) return true;
  if (!audio.bank['music-night']) return false;
  const src = audio.ctx.createBufferSource();
  src.buffer = audio.bank['music-night'];
  src.loop = true;
  /* this gain is the duck: 1 normally, MUSIC_DUCK while the hejnał sounds */
  const gain = audio.ctx.createGain();
  gain.gain.value = 1;
  src.connect(gain);
  gain.connect(audio.musicBus);
  src.start(0);
  audio.music = { src: src, gain: gain };
  return true;
}
/** Half the music while the hejnał is up, then back over a second. */
function duckMusic(to, sec){
  if (!audio.music) return;
  const g = audio.music.gain.gain, now = audio.ctx.currentTime;
  g.cancelScheduledValues(now);
  g.setValueAtTime(g.value, now);
  g.linearRampToValueAtTime(to, now + sec);
}
function rampMaster(to, sec){
  const g = audio.master.gain, now = audio.ctx.currentTime;
  g.cancelScheduledValues(now);
  g.setValueAtTime(g.value, now);
  g.linearRampToValueAtTime(to, now + sec);
}
/** Bring the whole thing up: resume the context, start the loop, fade in. */
function audioOn(){
  if (!audio.ctx) bootAudio();
  if (!audio.ctx) return;
  if (audio.ctx.state === 'suspended') audio.ctx.resume();
  clearTimeout(audio.suspendT);
  /* The effects fade in whatever the music is doing. If the track has not
     finished decoding yet the sounds still have to be audible, and loadOne()
     comes back for the music as soon as it lands. */
  rampMaster(1, SFX_ON_FADE);
  if (!audio.started){
    if (!startMusic()) return;
    audio.started = true;
  }
  armFirstHejnal();
}

/** One sound effect. Random playbackRate so no two repeats sound identical,
    and never more than two copies of the same name at a time. */
function sfx(name, vol, delay){
  if (!audio.on || !audio.ctx || audio.ctx.state !== 'running') return;
  const buf = audio.bank[name];
  if (!buf) return;
  const live = audio.copies[name] || 0;
  if (live >= 2) return;
  const ctx = audio.ctx;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = 0.93 + rnd() * 0.14;
  const g = ctx.createGain();
  g.gain.value = vol === undefined ? 1 : vol;
  src.connect(g);
  g.connect(audio.sfxBus);
  audio.copies[name] = live + 1;
  /* a short ring of what was asked for and at what volume, so the mix can be
     checked from the console without having to tap the graph */
  audio.log.push({ name: name, vol: g.gain.value, delay: delay || 0,
                   rate: +src.playbackRate.value.toFixed(4) });
  if (audio.log.length > 16) audio.log.shift();
  src.onended = function(){
    audio.copies[name] = Math.max(0, (audio.copies[name] || 1) - 1);
    try { g.disconnect(); } catch (e){}
  };
  try { src.start(ctx.currentTime + (delay || 0)); } catch (e){}
}

/** Smoothly interpolate every light / material from the two presets. */
function applyPhase(n){
  const mix = (a, b) => a + (b - a) * n;

  sun.color.copy(MORNING.sun).lerp(EVENING.sun, n);
  sun.intensity = mix(MORNING.sunI, EVENING.sunI);
  hemi.color.copy(MORNING.hemiSky).lerp(EVENING.hemiSky, n);
  hemi.groundColor.copy(MORNING.hemiGnd).lerp(EVENING.hemiGnd, n);
  hemi.intensity = mix(MORNING.hemiI, EVENING.hemiI);
  scene.environmentIntensity = mix(MORNING.env, EVENING.env);
  bloom.strength = mix(MORNING.bloom, EVENING.bloom);

  for (const m of glowMats) m.emissiveIntensity = mix(MORNING.glow, EVENING.glow) * m.userData.glowScale;
  fairyMat.emissiveIntensity = mix(MORNING.fairy, EVENING.fairy) * 2.6;
  fairyMat.color.setScalar(mix(0.55, 0.9));
  caveLight.intensity = mix(MORNING.cave, EVENING.cave)
    * (1 + Math.sin(t * 7.3) * 0.06 + Math.sin(t * 13.7) * 0.04)
    * (1 + dragonHoverGlow * 0.35);
  // the hover boost warms toward gold instead of bleaching the dragon
  caveLight.color.set(0xff7a1c).lerp(HOVER_GOLD, dragonHoverGlow * 0.75);
  skyMat.uniforms.uTop.value.copy(MORNING.skyTop).lerp(EVENING.skyTop, n);
  skyMat.uniforms.uHorizon.value.copy(MORNING.skyHorizon).lerp(EVENING.skyHorizon, n);
  skyMat.uniforms.uBottom.value.copy(MORNING.skyBottom).lerp(EVENING.skyBottom, n);
  skyMat.uniforms.uNebStr.value = mix(0.75, 1.15, n);

  starMat.uniforms.uOpacity.value = mix(MORNING.star, EVENING.star);
  starField.visible = starMat.uniforms.uOpacity.value > 0.01;

  /* The cap opacities now live in updateSnow() on the roofAccum/groundAccum
     accumulators, so they survive the snow toggle being switched off. */

  /* ---- sun and moon travel along opposite arcs ----
     Both are real objects, and both are placed so they sit in the upper part
     of the default framing, just inside the 35° FOV. The DirectionalLight
     follows the same quadrant (upper-left-back by day, upper-right-back by
     night) but from a higher elevation, so shadows stay long-but-readable and
     are never clipped off the island. */
  // n = 0 day → sun high; n = 1 night → sun sunk below, moon risen.
  // The default camera sits at roughly (-2.6, 4, 39) looking down -Z, with a
  // 35° vertical / ~44° horizontal FOV. The model subtends about ±10° of that,
  // so these azimuths put each body's disc just outside its silhouette while
  // its corona still spills past the edge — and on opposite sides.
  const sunElev = mix(0.24, -0.26, n);
  const moonElev = mix(-0.28, 0.26, n);
  const sunAz = mix(-1.80, -1.72, n);     // upper-left
  const moonAz = mix(-1.32, -1.40, n);    // upper-right
  sunDiscDir.set(Math.cos(sunAz) * Math.cos(sunElev), Math.sin(sunElev), Math.sin(sunAz) * Math.cos(sunElev)).normalize();
  moonDiscDir.set(Math.cos(moonAz) * Math.cos(moonElev), Math.sin(moonElev), Math.sin(moonAz) * Math.cos(moonElev)).normalize();

  const BODY_D = 120;
  sunDisc.position.copy(sunDiscDir).multiplyScalar(BODY_D);
  moonDisc.position.copy(moonDiscDir).multiplyScalar(BODY_D);

  // hide (rather than pop) whichever body is below the horizon arc
  const sunVis = smoothstep(-0.05, 0.08, sunElev);
  const moonVis = smoothstep(-0.05, 0.08, moonElev);
  sunDisc.visible = sunVis > 0.01;
  moonDisc.visible = moonVis > 0.01;
  sunDisc.traverse(o => { if (o.material) o.material.opacity = sunVis; });
  moonDisc.traverse(o => { if (o.material) o.material.opacity = moonVis; });

  // the shadow-casting light follows the dominant body's quadrant, lifted so
  // the szopka's shadow lands on the rock top rather than stretching off it
  const az = n < 0.5 ? sunAz : moonAz;
  const elev = mix(0.78, 0.62, n);
  const lightDir = _lightDir.set(Math.cos(az) * Math.cos(elev), Math.sin(elev), Math.sin(az) * Math.cos(elev)).normalize();
  sun.position.copy(lightDir).multiplyScalar(34);
  sun.target.position.set(0, 4, 0);
  sun.target.updateMatrixWorld();
}

const raycaster = new THREE.Raycaster();

let hovering = false, dragonHoverGlow = 0;
/* 'lajkonik' | 'pigeon' | null — what the market is under the cursor */
let marketHit = null;

function markInteraction(){
  if (!state.started) return;

let pointerInside = false;

function updateHover(){
  if (!pointerInside || state.intro < 1){ hovering = false; marketHit = null; return; }
  raycaster.setFromCamera(pointer, camera);
  /* the market is picked first: the Lajkonik and the pigeons are small and sit
     in front of the dragon, so a plain "is the dragon under the cursor" test
     would steal their clicks */
  const mHit = raycaster.intersectObjects(lajkonikMeshes, false);
  if (mHit.length){ hovering = false; marketHit = 'lajkonik'; }
  else {
    const sHit = raycaster.intersectObjects(sweepMeshes, false);
    if (sHit.length){ hovering = false; marketHit = 'sweep'; }
    else {
      let hHit = raycaster.intersectObjects(SHEEP_MESHES, false);
      if (!hHit.length && FLOCK_MESHES.length)
        hHit = raycaster.intersectObjects(FLOCK_MESHES, false);
      if (hHit.length){ hovering = false; marketHit = 'sheep'; }
      else {
        const pHit = raycaster.intersectObjects(pigeonMeshes, false);
        if (pHit.length){ hovering = false; marketHit = 'pigeon'; }
        else {
          const bHit = raycaster.intersectObjects(bacaMeshes, false);
          if (bHit.length){ hovering = false; marketHit = 'baca'; }
          else if (rayHitsTrumpeter()){ hovering = false; marketHit = 'trumpet'; }
          else {
            const hit = raycaster.intersectObjects(dragonMeshes, false);
            hovering = hit.length > 0;
            marketHit = null;
          }
        }
      }
    }
  }
  renderer.domElement.classList.toggle('pointing', hovering || !!marketHit);

/* click → the dragon rears back, opens its jaw and breathes fire */
const fire = { t: -1, cooldown: 0, _fired: false, _smoked: false };
renderer.domElement.addEventListener('click', (ev) => {
  markInteraction();
  /* pick against exactly where the click landed, not the last hover */
  if (ev){
    pointer.x = (ev.clientX / innerWidth) * 2 - 1;
    pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
    pointerInside = true;
    updateHover();
  }
  /* the market gets first refusal: a click on the Lajkonik or on a pigeon
     belongs to them, not to the dragon */
  if (marketHit === 'lajkonik'){ tapLajkonik(); return; }
  if (marketHit === 'sweep'){ tapSweep(); return; }
  if (marketHit === 'sheep'){
    // whichever of them is nearest under the cursor answers
    let best = null, bestD = 1e9;
    for (let i = 1; i < SHEEP_FLOCK.length; i++){
      const h = raycaster.intersectObjects(SHEEP_FLOCK[i].meshes, false);
      if (h.length && h[0].distance < bestD){ bestD = h[0].distance; best = SHEEP_FLOCK[i]; }
    }
    if (best) tapFlock(best); else tapSheep();
    return;
  }
  if (marketHit === 'baca'){ tapBaca(); return; }
  if (marketHit === 'trumpet'){ tapTrumpeter(); return; }
  if (marketHit === 'pigeon'){ pigeonsTakeOff(); return; }
  /* nothing of the model under the cursor: the sky gets the click. The
     building, the island and the rocks are not sky, so they still fall
     through to the dragon exactly as before. */
  if (!hovering && !marketHit){
    if (skyUnderCursor()) fireworkAtPointer();
    return;
  }
  if (!hovering || fire.t >= 0 || fire.cooldown > 0) return;
  fire.t = 0;
  fire._fired = false;
  fire._smoked = false;
  fireEmitAcc = 0;

const FW_MAX = Math.round(1500 * PARTICLE_SCALE);

  vx: new Float32Array(FW_MAX), vy: new Float32Array(FW_MAX), vz: new Float32Array(FW_MAX),
  life: new Float32Array(FW_MAX), life0: new Float32Array(FW_MAX),

const FW_GOLD  = 0xE8B64A, FW_PALE = 0xF2D488, FW_WHITE = 0xFFFFFF;

/** Put one spark in the pool. Nothing that is not a finite number, and no
    zero-life particle, is ever allowed in. */
function fwSpawn(x, y, z, vx, vy, vz, life, size, drag, grav, col, glit, split){
  if (fw.n >= FW_MAX) return;
  if (!isFinite(x) || !isFinite(y) || !isFinite(z) ||
      !isFinite(vx) || !isFinite(vy) || !isFinite(vz) ||
      !isFinite(life) || !isFinite(size) || !isFinite(drag) || !isFinite(grav)) return;
  if (life <= 0 || size <= 0) return;
  const i = fw.n++;
  fw.px[i] = x; fw.py[i] = y; fw.pz[i] = z;
  fw.vx[i] = vx; fw.vy[i] = vy; fw.vz[i] = vz;
  fw.life[i] = life; fw.life0[i] = life;
  fw.size[i] = size; fw.drag[i] = drag; fw.grav[i] = grav;
  fw.glit[i] = glit || 0; fw.split[i] = split || 0;
  _fwCol.setHex(col);
  fw.cr[i] = _fwCol.r; fw.cg[i] = _fwCol.g; fw.cb[i] = _fwCol.b;
  fw.phase[i] = rnd() * TAU;
