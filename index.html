<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1430">
<meta name="description" content="An interactive Kraków szopka, the Polish folk-art tradition, built entirely in code with Three.js.">

<title>Szopka · a Kraków folk-art tradition, built in code</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070c1c'/%3E%3Cpath d='M16 4l3.1 7.1 7.6.7-5.7 5 1.6 7.5L16 20.6 9.4 24.3l1.6-7.5-5.7-5 7.6-.7z' fill='%23E8B64A'/%3E%3C/svg%3E">

<style>
  :root{
    --gold:#E8B64A;
    --cream:#F3E7CE;
    --ink:#070c1c;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--ink); }
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{ position:fixed; inset:0; }
  #stage canvas{ display:block; touch-action:none; cursor:grab;
                 overscroll-behavior:none; }
  #stage canvas.dragging{ cursor:grabbing; }
  #stage canvas.pointing{ cursor:pointer; }

  /* ---------- overlay scaffolding ----------
     The overlay covers the viewport, so it has to stay click-through. Only the
     button bar opts back in — note that `#ui > *` would out-specify a plain
     `.title` / `.hint` / `.caption` rule and silently swallow drags, so the
     opt-in is written explicitly here. */
  #ui{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  #ui .bar{ pointer-events:auto; }
  #ui .bar .pill{ pointer-events:auto; }

  /* ---------- title ---------- */
  .title{
    position:absolute; top:clamp(16px,3.2vh,34px); left:clamp(18px,3.4vw,40px);
    pointer-events:none; user-select:none;
  }
  .title h1{
    margin:0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-weight:400; font-size:clamp(30px,5.4vw,56px);
    letter-spacing:.05em; line-height:1;
    color:#F6E9CE;
    text-shadow:0 2px 26px rgba(0,0,0,.75), 0 0 60px rgba(232,182,74,.18);
  }
  .title h1 em{ font-style:normal; color:var(--gold); }
  .title p{
    margin:.85em 0 0; font-size:clamp(9.5px,1.15vw,12.5px);
    letter-spacing:.26em; text-transform:uppercase;
    color:rgba(243,231,206,.5); font-weight:500;
  }
  .title .rule{
    width:clamp(46px,7vw,84px); height:1px; margin-top:1.1em;
    background:linear-gradient(90deg,var(--gold),rgba(232,182,74,0));
  }

  /* ---------- bottom pill buttons ---------- */
  .bar{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:max(20px, env(safe-area-inset-bottom, 0px));
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  }
  .pill{
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
    backdrop-filter:blur(14px) saturate(1.3);
    background:rgba(14,20,40,.42);
    border:1px solid rgba(232,182,74,.26);
    color:rgba(243,231,206,.86);
    border-radius:999px;
    padding:.62em 1.15em .62em 1em;
    font:inherit; font-size:clamp(11px,1.1vw,13px); font-weight:500;
    letter-spacing:.12em; text-transform:uppercase;
    display:inline-flex; align-items:center; gap:.62em;
    cursor:pointer; white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, background .35s, color .35s;
  }
  .pill:hover{ transform:translateY(-2px); border-color:rgba(232,182,74,.6); color:#fff6e2; }
  .pill:active{ transform:translateY(0); }
  .pill:focus-visible{ outline:2px solid rgba(232,182,74,.75); outline-offset:3px; }
  .pill .dot{
    width:7px; height:7px; border-radius:50%;
    background:rgba(243,231,206,.28);
    box-shadow:none; transition:background .5s, box-shadow .5s;
  }
  .pill.on{ border-color:rgba(232,182,74,.5); color:#FFF3DC; }
  .pill.on .dot{ background:var(--gold); box-shadow:0 0 10px rgba(232,182,74,.9); }
  .pill .k{ color:rgba(243,231,206,.45); letter-spacing:.1em; }

  /* ---------- hint + caption ---------- */
  /* The stack owns the bottom of the screen: hint, then buttons, then credits.
     One column, so a wrapped bar pushes the hint up instead of colliding. */
  .stack{
    position:absolute; left:0; right:0;
    bottom:max(14px, calc(env(safe-area-inset-bottom, 0px) + 14px));
    padding:0 clamp(10px,2vw,18px);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    pointer-events:none;
  }
  .stack > *{ pointer-events:auto; }
  .hint{
    font-size:clamp(10px,1.05vw,12px); letter-spacing:.18em; text-transform:uppercase;
    color:rgba(243,231,206,.46); pointer-events:none; user-select:none;
    white-space:nowrap; text-align:center; max-width:100%; line-height:1.7;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
    transition:opacity 1.1s ease;
  }
  .bar{ position:static; transform:none; }
  .hint.gone{ opacity:0; }
  .caption{
    position:absolute; left:50%; transform:translateX(-50%) translateY(6px);
    /* --stackH is written by JS: the live height of the stack plus a margin */
    bottom:calc(var(--stackH, 150px) + 26px);
    font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:clamp(14px,1.7vw,19px); letter-spacing:.06em; font-style:italic;
    color:#F6E9CE; text-shadow:0 2px 20px rgba(0,0,0,.85);
    opacity:0; pointer-events:none; transition:opacity .7s ease, transform .7s ease;
  }
  .caption.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- loader ---------- */
  #loader{
    position:fixed; inset:0; z-index:20; display:grid; place-content:center; gap:22px; justify-items:center;
    background:radial-gradient(120% 90% at 50% 40%, #16224a 0%, #070c1c 70%);
    transition:opacity .9s ease .1s, visibility .9s;
  }
  #loader.gone{ opacity:0; visibility:hidden; pointer-events:none; }
  #loader .ring{
    width:30px; height:30px; border-radius:50%;
    border:1.5px solid rgba(232,182,74,.18); border-top-color:var(--gold);
    animation:spin 1.05s linear infinite;
  }
  #loader span{
    font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:rgba(243,231,206,.45);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- help tooltip ---------- */
  #helpBox{
    position:absolute; left:50%; transform:translateX(-50%) translateY(6px);
    bottom:calc(var(--stackH, 150px) + 26px);
    max-width:min(30rem, calc(100vw - 32px));
    padding:.85em 1.1em; border-radius:14px;
    background:rgba(10,14,30,.86);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid rgba(232,182,74,.24);
    font-size:clamp(11px,1.05vw,13px); line-height:1.65; letter-spacing:.02em;
    color:rgba(243,231,206,.86); text-transform:none;
    opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
  }
  #helpBox.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- credits ---------- */
  .credits{
    align-self:flex-end; text-align:right;
    max-width:min(21rem, 100%);
    font-size:clamp(8.5px,.82vw,10.5px); line-height:1.6;
    letter-spacing:.06em; text-align:right;
    color:rgba(243,231,206,.24);
    text-shadow:0 1px 8px rgba(0,0,0,.8);
    pointer-events:none; user-select:none;
  }

  /* ---------- thumb-sized controls ---------- */
  .pill{ min-height:44px; padding:.5em 1.05em .5em .95em; }
  .pill.icon{ padding:.5em .82em; font-size:15px; letter-spacing:0; }

  /* A 390 px phone cannot fit five pills at full size, so the labels tighten
     rather than wrap: the row stays one line and every target keeps its 44 px
     thumb height. */
  @media (max-width:460px){
    .pill{ padding:.5em .78em .5em .7em; letter-spacing:.06em; gap:.5em;
           font-size:11px; }
    .pill.icon{ padding:.5em .7em; }
    .bar{ gap:7px; }
  }

  /* below this the single line no longer fits, so it is allowed to wrap */
  @media (max-width:900px){
    .hint{ white-space:normal; max-width:34rem; }
  }

  @media (max-width:560px){
    .title p{ letter-spacing:.18em; }
    .hint{ font-size:9.5px; letter-spacing:.12em; }
    .stack{ gap:8px; padding:0 10px; }
  }
  @media (prefers-reduced-motion:reduce){
    #loader .ring{ animation:none; }
  }
</style>
