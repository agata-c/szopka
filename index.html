/* ---------- the shells climbing to their burst height ---------- */
const fwRockets = [];
/* Bursts are kept above the roof and always on the far side of the island, so
   a shell can never come down in front of the building. */
/* ---------- the szopka's footprint on screen ---------- */
const _szBox = new THREE.Box3();
const _szV = new THREE.Vector3();
/** The szopka's projected screen box, as NDC. Recomputed on each launch, so
    it is right for whatever angle the camera happens to be at. */
function szopkaNdcBox(){
  _szBox.setFromObject(szopka);
  let x0 = 9e9, x1 = -9e9, y0 = 9e9, y1 = -9e9, seen = false;
  for (let i = 0; i < 8; i++){
    _szV.set(i & 1 ? _szBox.max.x : _szBox.min.x,
             i & 2 ? _szBox.max.y : _szBox.min.y,
             i & 4 ? _szBox.max.z : _szBox.min.z);
    _szV.project(camera);
    if (_szV.z < -1 || _szV.z > 1) continue;          // behind the eye
    seen = true;
    if (_szV.x < x0) x0 = _szV.x;
    if (_szV.x > x1) x1 = _szV.x;
    if (_szV.y < y0) y0 = _szV.y;
    if (_szV.y > y1) y1 = _szV.y;
  }
  return seen ? { x0: x0, x1: x1, y0: y0, y1: y1 } : null;
}

/* ---------- a burst site on a screen point ---------- */
const _bRay = new THREE.Vector3(), _bIsland = new THREE.Vector3();
const FW_MIN_Y = 12;            // clear of the roofs; the sides are wide open
const FW_MARGIN = 0.10;          // keep this much daylight around the building
/** Unproject (nx, ny) onto a ray and sit the burst on it, far enough back to
    be behind the island from wherever the camera is. If the ray is still too
    low there, lift the screen point instead, and never leave the burst under
    the roofs. Returns the world point and how far down the ray it sits. */
function burstPoint(nx, ny){
  let sy = clamp(ny, -0.35, 0.80);
  const depth = camera.position.distanceTo(_bIsland.set(0, 6, szopka.position.z)) + 12;
  let px = 0, py = 0, pz = 0;
  for (let k = 0; k < 12; k++){
    _bRay.set(nx, sy, 0.5).unproject(camera).sub(camera.position).normalize();
    px = camera.position.x + _bRay.x * depth;
    py = camera.position.y + _bRay.y * depth;
    pz = camera.position.z + _bRay.z * depth;
    if (py >= FW_MIN_Y || sy >= 0.80) break;
    sy += 0.05;
  }
  return { x: px, y: Math.max(py, FW_MIN_Y), z: pz, d: depth };
}
/** Nudge a screen point out of the szopka's box plus a margin, sideways,
    which is always the shorter way out from a side band. */
function clearOfBox(x, y, bb, margin){
  if (!bb) return { x: x, y: y };
  const x0 = bb.x0 - margin, x1 = bb.x1 + margin;
  const y0 = bb.y0 - margin, y1 = bb.y1 + margin;
  if (x < x0 || x > x1 || y < y0 || y > y1) return { x: x, y: y };
  if (Math.abs(x - x0) <= Math.abs(x1 - x)) x = x0 - 0.02;
  else x = x1 + 0.02;
  return { x: clamp(x, -0.94, 0.94), y: y };
}
/** Where an automatic shell should go: one of the two side skies, never over
    the building. From the default framing the bands sit clear of the box by
    itself; the check matters once the camera zooms in and the box widens. */
function autoTarget(){
  const left = rnd() < 0.5;
  let x = left ? rr(-0.85, -0.38) : rr(0.38, 0.85);
  const y = rr(0.20, 0.62);
  const p2 = clearOfBox(x, y, szopkaNdcBox(), FW_MARGIN);
  return { x: p2.x, y: clamp(p2.y, 0.16, 0.66) };
}

/* The burst radius as a fraction of the view: a burst should read as about a
   fifth of the half-height. Each style has a natural radius from its own
   speed, drag and life, so the launch speeds are scaled by the ratio rather
   than the geometry being rebuilt. */
const FW_VIEW_FRAC = 0.28;
const FW_NAT_R = [12.90, 3.06, 4.15, 5.78];   // peony, willow, ring, crackle

/* the first show lands 16–30 s in, so it never opens on the first frame */
const fwAuto = { timer: rr(16, 30), left: 0, gap: 0 };
/* one warm flash, so the burst actually lights the foil for a moment */
const fwFlash = new THREE.PointLight(0xFFD9A0, 0, 34, 2);
scene.add(fwFlash);
let fwFlashT = 0;
const fwRim = { x: 0, y: 0, z: 0 };

/** Launch one shell at a screen point. With a target it goes where you point;
    without one it picks a spot in the upper part of the frame itself. */
function launchFirework(target){
  const a = rnd() * TAU, rim = rr(5.4, 6.4);
  const aim = target || autoTarget();
  const pt = burstPoint(aim.x, aim.y);
  const tx = pt.x, ty = pt.y, tz = pt.z;
  /* one burst in six is white and red */
  let colA, colB;
  if (rnd() < 1 / 6){ colA = FW_WHITE; colB = FW_RED; }
  else {
    colA = FW_COLS[(rnd() * FW_COLS.length) | 0];
    colB = rnd() < 0.45 ? FW_COLS[(rnd() * FW_COLS.length) | 0] : colA;
  }
  fwRockets.push({
    sx: Math.cos(a) * rim, sy: PLAZA_Y + 0.25, sz: Math.sin(a) * rim - 1.5,
    tx: tx, ty: ty, tz: tz,
    x: 0, y: 0, z: 0, d: pt.d,
    t: 0, fuse: rr(1.05, 1.55), trail: 0,
    style: (rnd() * 4) | 0, colA: colA, colB: colB,
    spark: rnd() < 0.5 ? 0xFFE0A8 : 0xFFD0C0,
  });
  if (fwRockets.length > 10) fwRockets.shift();
}

/** The burst. Four styles, 80–140 sparks, one or two palette colours. */
function fwBurst(r){
  const n = 80 + ((rnd() * 61) | 0);
  const px = r.x, py = r.y, pz = r.z;
  /* the ring wants a plane that faces the camera */
  let ex = null, ey = null, ez = null;
  if (r.style === 2){
    _fwA.copy(camera.position).sub(_fwB.set(px, py, pz));
    if (_fwA.lengthSq() < 1e-6) _fwA.set(0, 0, 1);
    _fwA.normalize();
    _fwC.set(0, 1, 0);
    if (Math.abs(_fwA.y) > 0.9) _fwC.set(1, 0, 0);
    _fwB.crossVectors(_fwA, _fwC).normalize();
    _fwC.crossVectors(_fwB, _fwA).normalize();
    ex = _fwB.x; ey = _fwB.y; ez = _fwB.z;
  }
  const tx = ex === null ? 0 : _fwC.x, ty = ey === null ? 0 : _fwC.y,
        tz2 = ez === null ? 0 : _fwC.z;
  /* Scale the burst to the view: the radius we want comes from the FOV and how
     far back the shell burst; the speeds are scaled by the ratio of that to
     this style's own natural radius, so all four keep their character. */
  const halfV = camera.fov * Math.PI / 360;
  const wantR = (r.d || 60) * Math.tan(FW_VIEW_FRAC * halfV);
  const k = clamp(wantR / FW_NAT_R[r.style], 0.30, 2.50);
  for (let i = 0; i < n; i++){
    const u = rnd() * 2 - 1, ph = rnd() * TAU;
    const sr = Math.sqrt(Math.max(0, 1 - u * u));
    let dx = Math.cos(ph) * sr, dy = u, dz = Math.sin(ph) * sr;
    let sp, gr, dr, li, sz, gl = 0, spAt = 0, col;
    if (r.style === 0){                     // a) peony: a sphere, drooping
      sp = rr(4.5, 9.5) * k; gr = 3.4; dr = 0.55; li = rr(1.5, 2.5); sz = rr(1.00, 1.90);
    } else if (r.style === 1){              // b) willow: long gold, slow fall
      dy = dy * 0.5 - 0.42;
      const l = Math.hypot(dx, dy, dz) || 1;
      dx /= l; dy /= l; dz /= l;
      sp = rr(2.2, 4.6) * k; gr = 1.45; dr = 1.5; li = rr(2.8, 4.4); sz = rr(0.60, 1.10);
      col = rnd() < 0.6 ? FW_GOLD : FW_PALE;
    } else if (r.style === 2){              // c) ring: flat, tilted to camera
      const c2 = Math.cos(ph), s2 = Math.sin(ph);
      const wob = rr(-0.11, 0.11);
      dx = ex * c2 + tx * wob; dy = ey * s2 + ty * wob; dz = ez * c2 + tz2 * wob;
      const l2 = Math.hypot(dx, dy, dz) || 1;
      dx /= l2; dy /= l2; dz /= l2;
      sp = rr(5.6, 7.4) * k; gr = 1.25; dr = 1.7; li = rr(1.1, 1.8); sz = rr(0.90, 1.60);
    } else {                                // d) crackle: splits at the end
      sp = rr(3.4, 7.2) * k; gr = 2.3; dr = 0.85; li = rr(0.95, 1.35); sz = rr(0.90, 1.65);
      spAt = rr(0.20, 0.34);
    }
    if (col === undefined) col = rnd() < 0.5 ? r.colA : r.colB;
    fwSpawn(px, py, pz, dx * sp, dy * sp, dz * sp, li, sz, dr, gr, col, gl, spAt);
  }
  /* the flash, and the birds go up */
  fwFlash.position.set(px, py, pz);
  fwFlashT = 0.32;
  pigeonsTakeOff();
}

/* ---------- the per-frame sweep ---------- */
function updateFireworks(dt){
  const d = Math.min(dt, 0.05);
  /* by day they still work, but dimmer */
  fwMat.uniforms.uGain.value = 0.40 + 0.60 * state.night;

  /* the shells */
  for (let k = fwRockets.length - 1; k >= 0; k--){
    const r = fwRockets[k];
    r.t += d;
    const u = clamp(r.t / r.fuse, 0, 1);
    const e = 1 - (1 - u) * (1 - u);          // ease out: it slows into the top
    r.x = r.sx + (r.tx - r.sx) * e;
    r.y = r.sy + (r.ty - r.sy) * e;
    r.z = r.sz + (r.tz - r.sz) * e;
    r.trail -= d;
    while (r.trail <= 0){
      r.trail += 0.014;
      // the head is the brightest thing in the pool, so it is the biggest
      fwSpawn(r.x, r.y, r.z, rr(-0.5, 0.5), rr(-0.9, 0.2), rr(-0.5, 0.5),
        rr(0.16, 0.30), rr(2.30, 3.10), 2.4, 1.4, r.spark, 0.25, 0);
      fwSpawn(r.x, r.y, r.z, rr(-0.7, 0.7), rr(-1.3, 0.2), rr(-0.7, 0.7),
        rr(0.34, 0.62), rr(1.40, 2.30), 2.2, 1.5, r.spark, 0.4, 0);
    }
    if (u >= 1){ sfx('fireworks', rr(0.5, 0.8)); fwBurst(r); fwRockets.splice(k, 1); }
  }

  /* the sparks — lim is snapshotted so the crackle splits below, which append,
     cannot be integrated twice in one frame */
  const lim = fw.n;
  for (let i = 0; i < lim; i++){
    const l = fw.life[i] - d;
    if (l <= 0){ fw.life[i] = 0; continue; }
    if (fw.split[i] > 0 && l <= fw.split[i]){
      /* the parent pops into three tiny white twinkles and is gone */
      for (let j = 0; j < 3; j++){
        fwSpawn(fw.px[i], fw.py[i], fw.pz[i],
          fw.vx[i] * 0.5 + rr(-1.7, 1.7),
          fw.vy[i] * 0.5 + rr(-1.2, 1.7),
          fw.vz[i] * 0.5 + rr(-1.7, 1.7),
          rr(0.45, 0.9), rr(0.50, 0.80), 1.3, 2.4, FW_WHITE, 1, 0);
      }
      fw.life[i] = 0; fw.split[i] = 0;
      continue;
    }
    const dr = Math.exp(-fw.drag[i] * d);
    fw.vx[i] *= dr; fw.vz[i] *= dr;
    fw.vy[i] = fw.vy[i] * dr - fw.grav[i] * d;
    const nx = fw.px[i] + fw.vx[i] * d;
    const ny = fw.py[i] + fw.vy[i] * d;
    const nz = fw.pz[i] + fw.vz[i] * d;
    if (!isFinite(nx) || !isFinite(ny) || !isFinite(nz)){ fw.life[i] = 0; continue; }
    fw.px[i] = nx; fw.py[i] = ny; fw.pz[i] = nz;
    fw.life[i] = l;
  }

  /* write the live ones out and close the gaps in the same pass */
  let w = 0;
  for (let i = 0; i < fw.n; i++){
    if (fw.life[i] <= 0) continue;
    if (w !== i){
      fw.px[w] = fw.px[i]; fw.py[w] = fw.py[i]; fw.pz[w] = fw.pz[i];
      fw.vx[w] = fw.vx[i]; fw.vy[w] = fw.vy[i]; fw.vz[w] = fw.vz[i];
      fw.life[w] = fw.life[i]; fw.life0[w] = fw.life0[i];
      fw.size[w] = fw.size[i]; fw.drag[w] = fw.drag[i]; fw.grav[w] = fw.grav[i];
      fw.glit[w] = fw.glit[i]; fw.split[w] = fw.split[i];
      fw.cr[w] = fw.cr[i]; fw.cg[w] = fw.cg[i]; fw.cb[w] = fw.cb[i];
      fw.phase[w] = fw.phase[i];
    }
    const u = clamp(fw.life[w] / fw.life0[w], 0, 1);
    const gl = fw.glit[w];
    const tw = 0.5 + 0.5 * Math.sin(t * 22 + fw.phase[w] * 6.2831);
    fwPos[w * 3] = fw.px[w]; fwPos[w * 3 + 1] = fw.py[w]; fwPos[w * 3 + 2] = fw.pz[w];
    fwCol[w * 3] = fw.cr[w]; fwCol[w * 3 + 1] = fw.cg[w]; fwCol[w * 3 + 2] = fw.cb[w];
    fwSize[w] = fw.size[w] * (0.75 + 0.25 * u);
    fwAlpha[w] = u * u * ((1 - gl) + gl * tw);
    w++;
  }
  fw.n = w;
  fwGeo.setDrawRange(0, w);
  fwGeo.attributes.position.needsUpdate = true;
  fwGeo.attributes.aColor.needsUpdate = true;
  fwGeo.attributes.aSize.needsUpdate = true;
  fwGeo.attributes.aAlpha.needsUpdate = true;

  /* the flash: a short warm pulse that dies to exactly zero */
  if (fwFlashT > 0){
    fwFlashT -= d;
    const k = Math.max(0, fwFlashT / 0.32);
    fwFlash.intensity = k * k * 900 * fwMat.uniforms.uGain.value;
  } else fwFlash.intensity = 0;

  /* the automatic show: night only, a run of three to five */
  if (state.night > 0.55){
    if (fwAuto.timer <= 0){
      if (fwAuto.left <= 0){
        fwAuto.left = 3 + ((rnd() * 3) | 0);
        fwAuto.gap = 0;
      }
      if (fwAuto.gap > 0) fwAuto.gap -= d;
      if (fwAuto.gap <= 0){
        launchFirework(null);
        fwAuto.left--;
        fwAuto.gap = rr(0.3, 0.75);
        if (fwAuto.left <= 0) fwAuto.timer = rr(40, 60);
      }
    }
    fwAuto.timer -= d;
  }
}

/* ======================================================================
   THE COMET
   A long crossing of the upper back of the sky at a constant radius of 80,
   so it is never anywhere near the island — the tallest thing on it is 16 —
   and can never cross the building from any angle. It fades out whenever it
   comes within a few degrees of the sun's or the moon's disc.
   ====================================================================== */
const COMET_D = 60;             // how far down the view ray its path is set
const comet = {
  /* the first comet waits a while longer, so the fireworks get the opening */
  on: false, t: 0, dur: 5, next: rr(20, 35),
  ax: 0, ay: 0, az: 0, bx: 0, by: 0, bz: 0,
  fade: 1, emit: 0, x: 0, y: 0, z: 0,
};
const cometHead = new THREE.Sprite(new THREE.SpriteMaterial({
  map: starTex, color: 0xFFF4DC, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
}));
cometHead.scale.setScalar(2.1);
cometHead.renderOrder = -2;
cometHead.visible = false;
scene.add(cometHead);
const cometHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: dotTex, color: 0xFFDFA0, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
}));
cometHalo.scale.setScalar(6.0);
cometHalo.renderOrder = -2;
cometHalo.visible = false;
scene.add(cometHalo);

/** A point on the view ray for a screen coordinate, at COMET_D from the eye. */
function cometScreen(nx, ny){
  _fwA.set(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize();
  return _fwB.copy(camera.position).addScaledVector(_fwA, COMET_D);
}

function launchComet(){
  sfx('sparkle', 0.3);
  comet.on = true;
  comet.t = 0;
  comet.dur = rr(4, 6);
  /* in from just off one edge, out past the other, on a gentle diagonal
     through the upper-middle band: 0.66 at one end, 0.52 at the other. The
     "Szopka" title sits at x < -0.55 and y > 0.72, and the 0.70 ceiling here
     keeps the comet out of it without any extra test. Passing behind the
     building is fine: it is 60 units out and the building is 40, and depth
     testing puts it solidly behind. */
  const fwd = rnd() < 0.5;
  const sx = fwd ? -1.10 : 1.10;
  const ex = fwd ? 1.10 : -1.10;
  const down = rnd() < 0.5;
  const j = rr(-0.02, 0.02);
  const sy = clamp((down ? 0.66 : 0.52) + j, 0.45, 0.70);
  const ey = clamp((down ? 0.52 : 0.66) + j, 0.45, 0.70);
  const A = cometScreen(sx, sy);
  comet.ax = A.x; comet.ay = A.y; comet.az = A.z;
  const B = cometScreen(ex, ey);
  comet.bx = B.x; comet.by = B.y; comet.bz = B.z;
  /* the head is about 2.5% of the view height, the halo three times that */
  const viewH = 2 * COMET_D * Math.tan(camera.fov * Math.PI / 360);
  cometHead.scale.setScalar(Math.max(0.35, viewH * 0.025));
  cometHalo.scale.setScalar(Math.max(1.0, viewH * 0.075));
  comet.emit = 0;
  comet.fade = 1;
  comet.next = rr(45, 80);
  cometHead.visible = cometHalo.visible = true;
}

function updateComet(dt){
  const d = Math.min(dt, 0.05);
  if (!comet.on){
    comet.next -= d;
    if (comet.next <= 0) launchComet();
    return;
  }
  comet.t += d;
  const u = clamp(comet.t / comet.dur, 0, 1);
  const x = lerp(comet.ax, comet.bx, u);
  const y = lerp(comet.ay, comet.by, u);
  const z = lerp(comet.az, comet.bz, u);
  comet.x = x; comet.y = y; comet.z = z;

  /* It must not sit on the sun's or the moon's disc, and it must not cross the
     building's screen box either, so the closer it gets to either, the more it
     fades. Both angles are now measured from the eye, since the comet is only
     60 units out while the discs are 120. */
  _fwA.set(x - camera.position.x, y - camera.position.y, z - camera.position.z).normalize();
  let clear = 9;
  if (sunDisc.visible){
    _fwB.copy(sunDisc.position).sub(camera.position).normalize();
    clear = Math.min(clear, _fwA.angleTo(_fwB));
  }
  if (moonDisc.visible){
    _fwB.copy(moonDisc.position).sub(camera.position).normalize();
    clear = Math.min(clear, _fwA.angleTo(_fwB));
  }
  comet.fade = lerp(comet.fade, smoothstep(0.05, 0.15, clear), 1 - Math.exp(-d * 8));
  const env = smoothstep(0, 0.10, u) * (1 - smoothstep(0.88, 1, u));
  const vis = env * comet.fade * (0.30 + 0.70 * state.night);
  cometHead.position.set(x, y, z);
  cometHalo.position.set(x, y, z);
  cometHead.material.opacity = vis;
  cometHalo.material.opacity = vis * 0.45;

  /* the tail: gold and white, drifting, with a sparkle in every few */
  comet.emit -= d;
  let n = 0;
  while (comet.emit <= 0 && n < 6){
    comet.emit += 0.012; n++;
    const back = 0.5;
    /* the drift is back along the path, so the sparks trail rather than hang */
    const vx = (comet.bx - comet.ax) / comet.dur;
    const vy = (comet.by - comet.ay) / comet.dur;
    const vz = (comet.bz - comet.az) / comet.dur;
    fwSpawn(x + rr(-back, back) * 0.4, y + rr(-back, back) * 0.4, z + rr(-back, back) * 0.4,
      rr(-0.35, 0.35) - vx * 0.30, rr(-0.35, 0.35) - vy * 0.30,
      rr(-0.35, 0.35) - vz * 0.30,
      rr(0.65, 1.00), rr(0.60, 1.40), 0.30, 0.18,
      rnd() < 0.5 ? FW_GOLD : FW_PALE, 0.45, 0);
    if (rnd() < 0.22){
      fwSpawn(x, y, z, rr(-0.8, 0.8) - vx * 0.2, rr(-0.8, 0.8) - vy * 0.2,
        rr(-0.8, 0.8) - vz * 0.2,
        rr(0.45, 0.75), rr(0.45, 0.70), 0.7, 0.25, FW_WHITE, 1, 0);
    }
  }
  if (u >= 1){ comet.on = false; cometHead.visible = cometHalo.visible = false; }
}

/* ---------- clicking the sky ---------- */
/* Nothing solid within 70 units means the cursor is on empty sky: the island
   is 12 across and the tallest thing on it is 16, so from anywhere in the
   16–40 orbit a real hit is under 55. The sky dome is at 150. */
function skyUnderCursor(){
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(scene, true);
  for (const h of hits){
    if (!h.object.isMesh || h.object.isInstancedMesh) continue;
    return h.distance > 70;
  }
  return true;
}
/** A shell toward wherever the cursor is, kept above the roof and behind the
    island so the burst can never land in front of the building. */
function fireworkAtPointer(){
  // the clicked point itself, capped at y 0.75 so the burst's radius stays in
  // frame; a click on the building is pushed sideways out of its box
  const p2 = clearOfBox(clamp(pointer.x, -0.9, 0.9), clamp(pointer.y, -0.3, 0.75),
    szopkaNdcBox(), FW_MARGIN);
  launchFirework({ x: p2.x, y: p2.y });
}

/* ======================================================================
   10 · ANIMATION
   ====================================================================== */
let t = 0;                                  // seconds since load
const introDur = 2.5;
const camEnd = new THREE.Vector3(), camStart = new THREE.Vector3();

function animateDragon(dt){
  // breathing
  const br = Math.sin(t * 1.7) * 0.5 + 0.5;
  const bs = 1 + br * 0.02;
  dragonBody.scale.set(bs, 1 + (br - 0.5) * 0.012, bs);

  // blink every 3–6 s
  const blinkCycle = (t % 4.4);
  const blinking = blinkCycle > 4.4 - 0.16;
  for (const e of dragonEyes){
    const open = blinking ? Math.abs(Math.sin((blinkCycle - (4.4 - 0.16)) / 0.16 * Math.PI)) * 0.9 + 0.1 : 1;
    e.scale.y = lerp(e.scale.y, open, 0.5);
  }

  /* --- startled by a shake: a quick blink-blink, a small hop, one nose wisp --- */
  if (dragonStartle > 0){
    dragonStartle -= dt;
    // two fast blinks in the first 0.28 s
    if (dragonStartle > 0.34){
      const p = (0.62 - dragonStartle) / 0.28;      // 0 → 1 across the blink pair
      const shut = (p < 0.5)
        ? Math.abs(Math.sin(p * 2 * Math.PI)) * 0.9 + 0.1
        : Math.abs(Math.sin((p - 0.5) * 2 * Math.PI)) * 0.9 + 0.1;
      for (const e of dragonEyes) e.scale.y = Math.min(e.scale.y, shut);
    }
    // a small hop: up 0.06 and back down again
    const hk = clamp((0.62 - dragonStartle) / 0.62, 0, 1);
    const hop = Math.sin(hk * Math.PI) * 0.06;
    dragonBody.position.y = dragonBaseY + hop;
    if (dragonStartle <= 0){
      dragonBody.position.y = dragonBaseY;           // land exactly back
    }
    if (dragonStartle > 0 && dragonStartle - dt <= 0){
      noseWisp();                                    // one wisp as he settles
    }
  }

  // tail tip sway
  dragonTail.rotation.y = Math.sin(t * 0.9) * 0.16;
  dragonTail.rotation.z = Math.sin(t * 0.62 + 1.1) * 0.07;

  // nose wisp every so often
  wispTimer -= dt;

      dragonHead.rotation.x = -ease * 0.3;
      dragonHead.position.z = 0.06 + ease * 0.1;
      dragonBody.rotation.x = -ease * 0.1;

      const k = clamp((fire.t - 0.25) / 0.7, 0, 1);
      const s = Math.sin(k * Math.PI);
      dragonNeck.rotation.x = -0.5 + s * 0.12;
      dragonHead.rotation.x = -0.3 + s * 0.08;
      dragonBody.rotation.x = -0.1 + s * 0.03;

    const openAmt = clamp((fire.t - 0.18) / 0.12, 0, 1) * (1 - clamp((fire.t - 0.62) / 0.28, 0, 1));

     bleached the vinyl to white, so the materials are left alone entirely.
     The glow also ducks out while he is breathing fire, so the flame is
     never competing with it. */
  const hoverWanted = (hovering && fire.t < 0) ? 1 : 0;
  dragonHoverGlow = lerp(dragonHoverGlow, hoverWanted, 1 - Math.exp(-dt * 9));
  if (dragonGlowSprite){

    // track the dragon (it moves in inspect mode) and keep it behind him
    dragonGlowSprite.position.set(
      dragon.position.x,
      dragon.position.y + 0.95 * dragon.scale.x,
      dragon.position.z - 0.35 * dragon.scale.x);

/* ---------- the trumpeter plays the hejnał ---------- */
let hejnalT = 6, hejnalPlaying = false, hejnalNoteT = 0;

/* ---------- the mariacki hejnał, the real recording ----------
   A public-domain recording from Wikimedia Commons, 38 s, mono. It used to be
   synthesized here; it is simply played now, through a lowpass at 6 kHz so it
   carries a little distance, panned toward whichever side of the screen the
   trumpeter is on, with the background music ducked half-way underneath.
   If the file is missing or will not decode, playHejnal() simply does nothing
   and he still goes through the motions. */
const HEJNAL_VOL = 0.4, HEJNAL_LOWPASS = 6000;
/* his short silent animation, used when there is no recording to play */
const HEJNAL_SILENT_MS = 4200;
/* with the sound off he still does his little turn, but only every three minutes */
const HEJNAL_SILENT_EVERY = 180;

const _hjPos = new THREE.Vector3();
/** Which side of the screen the trumpeter is on, as a pan value. */
function hejnalPan(){
  trumpeter.getWorldPosition(_hjPos);
  _hjPos.project(camera);
  return clamp(_hjPos.x, -1, 1) * 0.7;
}

/** Play the recording. Ignored if it is already sounding. */
function playHejnal(){
  if (!audio.on || !audio.ctx || audio.ctx.state !== 'running') return false;
  if (hejnalPlaying) return false;
  const buf = audio.bank['hejnal'];
  if (!buf) return false;                  // no recording: he animates silently
  const ctx = audio.ctx;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = HEJNAL_LOWPASS;
  const g = ctx.createGain();
  g.gain.value = HEJNAL_VOL;
  src.connect(filt);
  filt.connect(g);
  let pan = null;
  if (ctx.createStereoPanner){
    pan = ctx.createStereoPanner();
    pan.pan.value = hejnalPan();
    g.connect(pan);
    pan.connect(audio.sfxBus);
  } else {
    g.connect(audio.sfxBus);
  }
  hejnalPlaying = true;                    // his arm stays up for the recording
  duckMusic(MUSIC_DUCK, DUCK_IN);
  audio.hejnal = { startedAt: ctx.currentTime, dur: buf.duration,
                   pan: pan ? +pan.pan.value.toFixed(3) : null };
  src.onended = function(){
    /* the trumpet comes down as the last note dies, and the music returns */
    hejnalPlaying = false;
    hejnalT = nextHejnalDelay();
    audio.hejnalNext = hejnalT;
    duckMusic(1, DUCK_OUT);
    try { g.disconnect(); filt.disconnect(); if (pan) pan.disconnect(); } catch (e){}
    if (audio.hejnal) audio.hejnal.endedAt = ctx.currentTime;
  };
  try { src.start(); } catch (e){}
  return true;
}

/** The short animation with no sound: used when the recording is missing, and
    whenever the visitor has the sound off. Counted on the scene clock like
    everything else, so it cannot outrun the animation it is driving. */
let hejnalSilentT = 0;
function silentHejnal(){
  hejnalPlaying = true;
  hejnalNoteT = 0;
  hejnalSilentT = HEJNAL_SILENT_MS / 1000;
}

/** Begin a performance, whichever kind is available. */
function beginHejnal(){
  hejnalNoteT = 0;
  if (!playHejnal()) silentHejnal();
}

/** With the sound on he plays on the hour, like the real tower; with it off, or
    with no recording to play, every three minutes. */
function nextHejnalDelay(){
  if (!audio.on || !audio.bank['hejnal']) return HEJNAL_SILENT_EVERY;
  const now = new Date();
  const top = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                       now.getHours() + 1, 0, 0, 0);
  return Math.max(2, (top.getTime() - now.getTime()) / 1000);
}

/** Once per visit, about twenty seconds after the sound is first switched on. */
let firstHejnalIn = 0;
function armFirstHejnal(){
  if (audio.firstHejnalDone) return;
  audio.firstHejnalDone = true;

}

const _htr = new THREE.Vector3(), _hto = new THREE.Vector3();
function rayHitsTrumpeter(){
  trumpeter.getWorldPosition(_htr);
  _hto.copy(_htr).sub(raycaster.ray.origin);
  const along = _hto.dot(raycaster.ray.direction);
  if (along < 0) return false;
  const r = 0.42 * trumpeter.scale.x;
  const hit = _hto.lengthSq() - along * along <= r * r;
  if (hit) audio.trumpetRayHits = (audio.trumpetRayHits || 0) + 1;

  markInteraction();

function updateTrumpeter(dt){
  /* the one-off welcome performance, about twenty seconds after the visitor
     first switches the sound on */
  if (firstHejnalIn > 0){
    firstHejnalIn -= dt;
    if (firstHejnalIn <= 0){ firstHejnalIn = 0; hejnalT = 0; }
  }
  /* a silent performance ends on the scene clock, not on a timer */
  if (hejnalSilentT > 0){
    hejnalSilentT -= dt;
    if (hejnalSilentT <= 0){
      hejnalSilentT = 0;
      hejnalPlaying = false;
      hejnalT = nextHejnalDelay();
      audio.hejnalNext = hejnalT;
    }
  }
  hejnalT -= dt;
  if (hejnalT <= 0 && !hejnalPlaying){
    /* whichever kind is available; playHejnal() sets hejnalPlaying itself and
       its own onended clears it when the recording runs out */
    beginHejnal();
  }
  // raise the trumpet up and outward — rotating +X toward +Y
  const target = hejnalPlaying ? 1.15 : 0;
  trumpeterArm.rotation.z = lerp(trumpeterArm.rotation.z, target, 1 - Math.exp(-dt * 4));
  trumpeterArm.rotation.y = hejnalPlaying ? -0.25 : 0;
  trumpeterBody.position.y = hejnalPlaying ? -0.06 + Math.sin(t * 9) * 0.006 : -0.06;

  if (hejnalPlaying){
    hejnalNoteT -= dt;
    if (hejnalNoteT <= 0){
      hejnalNoteT = 0.5;
      const n = musicalNotes.find(m => m.life <= 0);
      if (n){
        n.life = n.maxLife;
        n.vel.set(rr(-0.18, 0.18), rr(0.5, 0.8), rr(0.1, 0.3));
        n.spin = rr(-0.6, 0.6);
        n.sprite.position.copy(trumpeterNoteOrigin);
        n.sprite.position.z += 0.2;
        n.sprite.visible = true;
      }
    }
  }
  for (const n of musicalNotes){
    if (n.life <= 0) continue;
    n.life -= dt;
    const k = 1 - n.life / n.maxLife;
    n.sprite.position.addScaledVector(n.vel, dt);
    n.vel.y *= 0.995;
    n.sprite.material.opacity = Math.sin(Math.PI * Math.min(1, k * 1.1));
    n.sprite.material.rotation = n.spin * k;
    if (n.life <= 0) n.sprite.visible = false;
  }
}

   9b · THE KRAKÓW CHRISTMAS MARKET on the front plaza
   A small folk market on the rock in front of the szopka: four stalls, the
   blue obwarzanki cart, a tree, a string of lights, a flock of pigeons and the
   Lajkonik himself. Everything is parented to `island`, so the whole market

/* The rock top's outline, as a radius-per-angle lookup. islandTopRing holds the
   true silhouette, so "is this point still on the rock?" follows the real edge
   instead of an approximation. Both the market and the snow use this. */
const SEGS_T = ISLE_SEGS;
const rimR = new Float32Array(SEGS_T);
for (let s = 0; s < SEGS_T; s++){
  const i = s * 3;                                   // ring 0: the true top edge
  rimR[s] = Math.hypot(islandTopRing[i], islandTopRing[i + 2]);
}
/** Is (x,z) inside the rock top, with `margin` slack kept clear of the rim? */
function overRockTop(x, z, margin = 0){
  const r = Math.hypot(x, z);
  if (r < 1e-4) return true;
  const a = Math.atan2(z, x);
  const f = ((a / TAU + 1) % 1) * SEGS_T;
  const i0 = Math.floor(f) % SEGS_T, i1 = (i0 + 1) % SEGS_T, fr = f - Math.floor(f);
  return r < lerp(rimR[i0], rimR[i1], fr) - margin;
}
/** Distance from (x,z) out to the rock's rim, measured radially. */
function rimDistAt(x, z){
  const r = Math.hypot(x, z);
  const a = Math.atan2(z, x);
  const f = ((a / TAU + 1) % 1) * SEGS_T;
  const i0 = Math.floor(f) % SEGS_T, i1 = (i0 + 1) % SEGS_T, fr = f - Math.floor(f);
  return Math.max(0, lerp(rimR[i0], rimR[i1], fr) - r);
}

/* ---- a small local batcher ---------------------------------------------
   The global BATCH is flushed to `szopka` and cannot be reused for the market,
   so the market keeps its own. As with BATCH, the key MUST carry the geometry
   size — a shared key would render everything at the first piece's size. */
const MKT = new Map();
/** Merge a list of { geo, matrix } into one geometry, position/normal/uv and
    all. Used where a cluster is dozens of identical little pieces — merging
    them costs one draw call instead of one each. */
function mergeGeos(list){
  const P = [], N = [], U = [];
  for (const e of list){
    const g = e.geo.index ? e.geo.toNonIndexed() : e.geo.clone();
    g.applyMatrix4(e.matrix);
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    /* uv is itemSize 2 — pushing a third component writes undefined, which
       becomes NaN in the typed array, and the bloom pass smears a NaN pixel
       into a flickering black square. Same for the vertex-colour pass. */
    for (let i = 0; i < p.count; i++){
      P.push(p.getX(i), p.getY(i), p.getZ(i));
      if (n) N.push(n.getX(i), n.getY(i), n.getZ(i));
      if (u) U.push(u.getX(i), u.getY(i));
    }
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  out.setAttribute('normal',   new THREE.Float32BufferAttribute(
    N.length === P.length ? N : P.map((_, i) => i % 3 === 1 ? 1 : 0), 3));
  if (U.length / 2 === P.length / 3)
    out.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
  out.computeBoundingSphere();
  return out;
}
function mktAdd(key, geo, mat, m, color = null, shadow = true){
  let b = MKT.get(key);
  if (!b){ b = { geo, mat, ms: [], cs: color === null ? null : [], shadow }; MKT.set(key, b); }
  b.ms.push(m.clone());
  if (b.cs) b.cs.push(new THREE.Color(color));
}
function mktFlush(parent){
  for (const [key, b] of MKT){
    const im = new THREE.InstancedMesh(b.geo, b.mat, b.ms.length);
    for (let i = 0; i < b.ms.length; i++){
      im.setMatrixAt(i, b.ms[i]);
      if (b.cs) im.setColorAt(i, b.cs[i]);
    }
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.castShadow = b.shadow; im.receiveShadow = true;
    im.frustumCulled = false;
    im.name = 'mkt:' + key;
    parent.add(im);
  }
  MKT.clear();
}

  ? '#' + c.toString(16).padStart(6, '0') : c;

  const [c, g] = canvas2d(256, 64);
  const w = 256 / n;
  for (let i = 0; i < n; i++){ g.fillStyle = css(i % 2 ? b : a); g.fillRect(i * w, 0, w + 1, 64); }
  return c;

/** Burgundy cloth with bold scrolling spirals. The strokes stay thin enough
    that the burgundy ground still reads between them. */
function spiralCanvas(bg, cols){
  const [c, g] = canvas2d(256, 256);
  g.fillStyle = bg; g.fillRect(0, 0, 256, 256);
  for (let q = 0; q < 4; q++){
    const cx = (q % 2) * 128 + 64, cy = ((q / 2) | 0) * 128 + 64;
    g.lineCap = 'round';
    for (let k = 0; k < 3; k++){
      g.strokeStyle = cols[(q + k) % cols.length];
      g.lineWidth = 5;
      g.beginPath();
      for (let a = 0; a <= Math.PI * 4.4; a += 0.1){
        const rad = 4 + a * 7.4;
        const x = cx + Math.cos(a + k * 2.1) * rad;
        const y = cy + Math.sin(a + k * 2.1) * rad;
        if (a === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }
  }
  return c;
}

  const [c, g] = canvas2d(256, 256);

    g.beginPath(); g.moveTo(i * 34, 0); g.lineTo(i * 34 + 256, 256); g.stroke();

/** Lace: white cloth, a scalloped hem along the bottom, and a grid of small
    holes. Rows v < LACE_HEM are the fringe the drape shows; above it is the
    solid part the counter sheet uses. The gaps are cut, not painted. */
const LACE_HEM = 0.30;
function laceCanvas(){
  const [c, g] = canvas2d(256, 256);
  g.fillStyle = '#FFFFFF';
  g.fillRect(0, 0, 256, 256);
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = '#000';
  // the scalloped hem: nine lobes along the bottom of the cloth
  const N = 9, top = (1 - LACE_HEM) * 256;
  g.beginPath();
  g.moveTo(0, 256);
  g.lineTo(0, top);
  for (let i = 0; i < N; i++){
    const x0 = i * 256 / N, x1 = (i + 1) * 256 / N;
    g.quadraticCurveTo((x0 + x1) / 2, top + 26, x1, top);
  }
  g.lineTo(256, 256);
  g.closePath();
  g.fill();
  // a scalloped inner edge, so the fringe itself is lacy and not a solid band
  g.beginPath();
  g.moveTo(0, top + 15);
  for (let i = 0; i < N * 2; i++){
    const x0 = i * 256 / (N * 2), x1 = (i + 1) * 256 / (N * 2);
    g.quadraticCurveTo((x0 + x1) / 2, top - 9, x1, top + 15);
  }
  g.lineTo(256, top + 40); g.lineTo(0, top + 40);
  g.closePath();
  g.fill();
  // the little holes: a diamond grid over the whole cloth, plus eyelets
  // along the hem
  for (let row = 0; row < 9; row++){
    for (let col = 0; col < 15; col++){
      const x = 8 + col * 17 + (row % 2) * 8.5, y = 12 + row * 26;
      g.beginPath();
      g.moveTo(x, y - 5); g.lineTo(x + 5, y); g.lineTo(x, y + 5); g.lineTo(x - 5, y);
      g.closePath(); g.fill();
    }
  }
  return c;
}

/* The Kraków knot pretzel: ONE tube following a single strand that folds
   through itself — out, round, back across, round again — so there is not a
   radial ridge anywhere on it. Open at both ends, hence the two round caps. */
const PRETZEL_PATH = [
  [-0.22, -0.42, 0], [-0.05, -0.12, 0.04], [0.20, 0.18, 0.04], [0.42, 0.36, 0],
  [0.50, 0.12, 0], [0.44, -0.14, 0], [0.28, -0.38, 0], [0.00, -0.48, 0],
  [-0.28, -0.38, 0], [-0.44, -0.14, 0], [-0.50, 0.12, 0], [-0.42, 0.36, 0],
  [-0.20, 0.18, -0.04], [0.05, -0.12, -0.04], [0.22, -0.42, 0],
];
function pretzelCurve(){
  return new THREE.CatmullRomCurve3(
    PRETZEL_PATH.map(q => new THREE.Vector3(q[0], q[1], q[2])), false, 'catmullrom', 0.5);
}
function knotPretzel(scale, tubeR = 0.07, seg = 64){
  const curve = pretzelCurve();
  const parts = [{ geo: new THREE.TubeGeometry(curve, seg, tubeR, 8, false),
                   matrix: new THREE.Matrix4() }];
  const up = new THREE.Vector3(0, 1, 0);
  for (const u of [0, 1]){
    const pt = curve.getPointAt(u), tg = curve.getTangentAt(u);
    const q = new THREE.Quaternion().setFromUnitVectors(up, tg);
    parts.push({ geo: ballGeo(tubeR, 10, 8),
      matrix: new THREE.Matrix4().makeRotationFromQuaternion(q)
        .premultiply(new THREE.Matrix4().makeTranslation(pt.x, pt.y, pt.z)) });
  }
  const g = mergeGeos(parts);
  g.scale(scale, scale, scale);
  return g;
}
/* The Kraków obwarzanek: a thin ring of dough made of TWO strands genuinely
   twisted around each other — each strand's centre rides its own helix about
   the ring circle — which is what actually reads as a braid. */
function braidedObwarzanek(ringR, tubeR, twists, orbit, perTwist = 13){
  const parts = [];
  const n = Math.max(30, Math.round(twists * perTwist));
  for (let s = 0; s < 2; s++){
    const pts = [];
    for (let i = 0; i <= n; i++){
      const u = i / n;
      const a = u * TAU;
      const ph = s * Math.PI + u * twists * TAU;
      const r = ringR + orbit * Math.cos(ph);
      pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, orbit * Math.sin(ph)));
    }
    parts.push({ geo: new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(pts), n, tubeR, 6, false),
      matrix: new THREE.Matrix4() });
  }
  return mergeGeos(parts);
}

/* A piernik: brown biscuit, a white icing border and a simple dotted pattern
   piped across the middle. */
function gingerCanvas(kind){
  const [c, g] = canvas2d(128, 128);
  g.fillStyle = '#7A4524'; g.fillRect(0, 0, 128, 128);
  // the piped icing outline
  g.strokeStyle = '#F4EFE2'; g.lineWidth = 9; g.lineJoin = 'round';
  g.beginPath();
  if (kind === 'heart'){
    g.moveTo(64, 112);
    g.bezierCurveTo(6, 70, 20, 20, 64, 46);
    g.bezierCurveTo(108, 20, 122, 70, 64, 112);
  } else {
    for (let i = 0; i < 10; i++){
      const a = -Math.PI / 2 + i * (TAU / 5);
      const b = a + TAU / 10;
      const x1 = 64 + Math.cos(a) * 52, y1 = 64 + Math.sin(a) * 52;
      const x2 = 64 + Math.cos(b) * 24, y2 = 64 + Math.sin(b) * 24;
      if (i === 0) g.moveTo(x1, y1); else g.lineTo(x1, y1);
      g.lineTo(x2, y2);
    }
    g.closePath();
  }
  g.stroke();
  // dots piped inside the border
  g.fillStyle = '#F4EFE2';
  for (let i = 0; i < 9; i++){
    const a = (i / 9) * TAU;
    g.beginPath();
    g.arc(64 + Math.cos(a) * 26, 64 + Math.sin(a) * 24, 4, 0, TAU);
    g.fill();
  }
  g.beginPath(); g.arc(64, 64, 5, 0, TAU); g.fill();
  return c;
}

/* An oscypek is a smoked sheep-cheese spindle: pointed at both ends, fat in
   the middle, with a raised decorative band round the middle. The lathe profile
   carries the bulge; the texture carries the pattern on the band. */
function oscypekCanvas(){
  const [c, g] = canvas2d(128, 128);
  g.fillStyle = '#EBDCAE'; g.fillRect(0, 0, 128, 128);
  // a soft smoked gradient towards the tips
  const grd = g.createLinearGradient(0, 0, 0, 128);
  grd.addColorStop(0, 'rgba(150,96,36,0.55)');
  grd.addColorStop(0.32, 'rgba(150,96,36,0)');
  grd.addColorStop(0.68, 'rgba(150,96,36,0)');
  grd.addColorStop(1, 'rgba(150,96,36,0.55)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  // the embossed band round the middle: a row of stamped rosettes
  g.strokeStyle = 'rgba(120,72,20,0.75)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(0, 46); g.lineTo(128, 46); g.stroke();
  g.beginPath(); g.moveTo(0, 82); g.lineTo(128, 82); g.stroke();
  g.fillStyle = 'rgba(120,72,20,0.7)';
  for (let i = 0; i < 8; i++){
    const x = 8 + i * 16;
    for (const y of [58, 70]){
      g.beginPath();
      for (let k = 0; k < 6; k++){
        const a = k * TAU / 6;
        g.lineTo(x + Math.cos(a) * 5, y + Math.sin(a) * 5);
      }
      g.closePath(); g.fill();
    }
  }
  return c;
}
function oscypekGeo(){
  const prof = [[0.0, 0], [0.022, 0.028], [0.05, 0.07], [0.068, 0.125],
                [0.072, 0.16], [0.068, 0.195], [0.05, 0.25], [0.022, 0.292], [0.0, 0.32]];
  const g = new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 12);
  // v runs along the cheese, u around it, so the band texture lands on the band
  const uv = g.attributes.uv, p = g.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 2, p.getY(i) / 0.32);
  uv.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

/* ---- the bombki glass ---------------------------------------------------
   Hand-blown Polish baubles: a few shapes in deep saturated colours, some
   hand-painted with gold, every one with a small gold cap and a hanger. One
   InstancedMesh per shape and finish, so the whole display is a handful of
   draw calls; the hung ones have their matrices rewritten each frame so they
   sway — gently at rest, harder while the island is being shaken. */
const BOMBKI_RACK_Y = 1.48;        // where the threads meet the roof rack
const bombkiHangs = [];            // { im, capIM, slot, shape, hang }
const _bkM = new THREE.Matrix4(), _bkM2 = new THREE.Matrix4(), _bkQ = new THREE.Quaternion();
const _bkP = new THREE.Vector3(), _bkE = new THREE.Euler();
const _bkS = new THREE.Vector3(1, 1, 1);
const _bkD = new THREE.Vector3(), _bkQ2 = new THREE.Quaternion();
const _bkUP = new THREE.Vector3(0, 1, 0);
/* how far above a bauble's own origin its gold cap sits, per shape */
const BOMBKI_CAP_Y = { ball: 0.05, drop: 0.125, onion: 0.128, spire: 0.075, bird: 0.032, cone: 0.105 };
const bombkiCapGeo = mergeGeos([
  { geo: new THREE.CylinderGeometry(0.016, 0.019, 0.018, 8),
    matrix: new THREE.Matrix4() },
  { geo: new THREE.TorusGeometry(0.011, 0.0035, 5, 9),
    matrix: new THREE.Matrix4().makeRotationX(Math.PI / 2)
      .premultiply(new THREE.Matrix4().makeTranslation(0, 0.02, 0)) },
]);
const bombkiTailMat = cardboard(0xF6F2E8);
const bombkiTailGeo = mergeGeos([0, 1, 2].map(i => ({
  geo: ballGeo(0.015, 6, 5),
  matrix: new THREE.Matrix4().makeTranslation(0, 0.016, -0.048 - i * 0.011),
})));

/** Build one stall's baubles. `list` is a list of
    { shape, m, col, painted, hang? }, with m in the stall's local space. */
function bombkiBuild(g, list){
  const byKey = new Map();
  for (const e of list){
    const k = e.shape + '|' + (e.painted ? 1 : 0);
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(e);
  }
  // the threads: one thin line per hung bauble, all in a single InstancedMesh
  const hung = list.filter(e => e.hang);
  let threadIM = null;
  if (hung.length){
    threadIM = new THREE.InstancedMesh(
      worldUV(new THREE.CylinderGeometry(0.0035, 0.0035, 1, 4)), GOOD.thread, hung.length);
    threadIM.frustumCulled = false;
    threadIM.name = 'bombkiThread';
    g.add(threadIM);
    hung.forEach((e, i) => {
      e.threadSlot = i;
      // the one record the sway walks: thread, cap, tail and body together
      e.sway = { im: null, capIM: null, tailIM: null, slot: -1, shape: e.shape,
                 hang: e.hang, threadIM: threadIM, threadSlot: i };
      bombkiHangs.push(e.sway);
    });
  }
  for (const kv of byKey){
    const items = kv[1], parts = kv[0].split('|');
    const shape = parts[0], painted = parts[1] === '1';
    const n = items.length;
    const mk = (geo, mat, name) => {
      const im = new THREE.InstancedMesh(geo, mat, n);
      im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;
      im.name = name;
      g.add(im);
      return im;
    };
    const im = mk(bombkiGeo[shape], painted ? bombkiPaintMat : bombkiMat, 'bombki:' + kv[0]);
    const capIM = mk(bombkiCapGeo, goldFoil(), 'bombkiCap:' + kv[0]);
    const tailIM = shape === 'bird' ? mk(bombkiTailGeo, bombkiTailMat, 'bombkiTail') : null;
    const capY = BOMBKI_CAP_Y[shape] || 0.05;
    for (let i = 0; i < n; i++){
      const e = items[i];
      im.setMatrixAt(i, e.m);
      im.setColorAt(i, new THREE.Color(e.col));
      _bkM.copy(e.m).multiply(_bkM2.makeTranslation(0, capY, 0));
      capIM.setMatrixAt(i, _bkM);
      if (tailIM) tailIM.setMatrixAt(i, _bkM);
      if (e.sway){ e.sway.im = im; e.sway.capIM = capIM;
                    e.sway.tailIM = tailIM; e.sway.slot = i; }

    }
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    capIM.instanceMatrix.needsUpdate = true;
    if (tailIM) tailIM.instanceMatrix.needsUpdate = true;
  }
}

/** The gentle sway. The island's own shake damper drives it, so shaking the
    rock sends the whole rack swinging. */
function updateBombki(){
  if (!bombkiHangs.length) return;
  const jolt = (shake.t >= 0) ? 2.8 : 1;
  for (const h of bombkiHangs){
    const g = h.hang;
    const sw = Math.sin(t * 1.25 + g.phase) * g.amp * 0.2 * jolt
             + Math.sin(t * 3.3 + g.phase * 1.7) * g.amp * 0.07 * jolt;
    const ti = Math.cos(t * 1.05 + g.phase * 0.8) * g.amp * 0.16 * jolt;
    _bkE.set(sw, g.sway, ti);
    _bkQ.setFromEuler(_bkE);
    // the bauble hangs on a thread, swinging about where it meets the rack
    const len = g.len;
    const ax = g.lx, ay = BOMBKI_RACK_Y, az = g.lz;
    const bx = ax + Math.sin(ti) * len * 0.55;
    const by = ay - Math.cos(sw) * len * 0.98;
    const bz = az + Math.sin(sw) * len * 0.55;
    // the thread spans anchor -> bauble, so it stretches as it swings
    if (h.threadIM){
      _bkD.set(bx - ax, by - ay, bz - az);
      const tl = _bkD.length() || 1e-4;
      _bkD.divideScalar(tl);
      _bkQ2.setFromUnitVectors(_bkUP, _bkD);
      _bkP.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
      _bkS.set(1, tl, 1);
      _bkM.compose(_bkP, _bkQ2, _bkS);
      _bkS.set(1, 1, 1);
      h.threadIM.setMatrixAt(h.threadSlot, _bkM);
    }
    if (h.im){
      _bkP.set(bx, by, bz);
      _bkM.compose(_bkP, _bkQ, _bkS);
      h.im.setMatrixAt(h.slot, _bkM);
      _bkM.multiply(_bkM2.makeTranslation(0, BOMBKI_CAP_Y[h.shape] || 0.05, 0));
      h.capIM.setMatrixAt(h.slot, _bkM);
      if (h.tailIM) h.tailIM.setMatrixAt(h.slot, _bkM);
      h.im.instanceMatrix.needsUpdate = true;
      h.capIM.instanceMatrix.needsUpdate = true;
      if (h.tailIM) h.tailIM.instanceMatrix.needsUpdate = true;
    }
    if (h.threadIM) h.threadIM.instanceMatrix.needsUpdate = true;
  }
}
/** One stall: booth, counter, striped peaked awning, goods and a lantern. */
function buildStall(spot, idx){
  const g = new THREE.Group();
  g.position.set(spot.x, PLAZA_Y, spot.z);
  g.rotation.y = spot.rot;
  marketGroup.add(g);
  const W = 1.4, D = 0.85, H = 1.6, COUNTER = 0.62;
  const CT = COUNTER + 0.035;          // the top face of the counter board

  for (const sx of [-1, 1]) for (const sz of [-1, 1]){
    const p = new THREE.Mesh(boxGeo(0.07, H, 0.07), boothWood);
    p.position.set(sx * (W / 2 - 0.05), H / 2, sz * (D / 2 - 0.05));
    p.castShadow = true; p.receiveShadow = true; g.add(p);
  }
  /* The stall is bare brown wood like the other three. The gingerbread used to
     need a red back and a red counter to read against; it now reads against a
     white lace cloth instead, which is what a real pierniki stall looks like. */
  const TOP = CT;
  const back = new THREE.Mesh(boxGeo(W, H * 0.82, 0.05), boothWoodDark);
  back.position.set(0, H * 0.41, -D / 2 + 0.03);
  back.castShadow = true; back.receiveShadow = true; g.add(back);
  for (const sx of [-1, 1]){
    const side = new THREE.Mesh(boxGeo(0.05, H * 0.5, D * 0.8), boothWoodDark);
    side.position.set(sx * (W / 2 - 0.02), H * 0.3, 0);
    side.castShadow = true; g.add(side);
  }
  const counter = new THREE.Mesh(boxGeo(W + 0.18, 0.07, D * 0.55), boothWood);
  counter.position.set(0, COUNTER, D * 0.2);
  counter.castShadow = true; counter.receiveShadow = true; g.add(counter);

  /* the striped awning: two slopes at a ridge, plus a scalloped front edge */
  const awnPair = STALL_AWNINGS[idx];
  const awnMat = awningMat(awnPair[0], awnPair[1]);
  const RISE = 0.42, OVER = 0.14;
  for (const sz of [1, -1]){
    /* a plain BoxGeometry on purpose: worldUV() would re-project the UVs from
       world space and shred the stripe pattern */
    const slope = new THREE.Mesh(
      new THREE.BoxGeometry(W + OVER, 0.045, Math.hypot(D / 2 + OVER, RISE)), awnMat);
    slope.position.set(0, H + RISE / 2 - 0.02, sz * (D / 4 + OVER / 2));
    slope.rotation.x = sz * Math.atan2(RISE, D / 2 + OVER);
    slope.castShadow = true; slope.receiveShadow = true; g.add(slope);
  }
  const ridge = new THREE.Mesh(boxGeo(W + OVER + 0.06, 0.07, 0.09), goldFoil());
  ridge.position.set(0, H + RISE - 0.02, 0);
  ridge.castShadow = true; g.add(ridge);
  /* seven scallops along the front eave — merged into one mesh, since they
     never move relative to each other. A plain sphere (not ballGeo) so the
     stripes wrap the little ball instead of sampling one world-projected texel. */
  const scallops = [];
  for (let i = 0; i < 7; i++){
    const u = (i / 6 - 0.5) * (W + OVER - 0.04);
    scallops.push({ geo: new THREE.SphereGeometry(0.055, 8, 6),
      matrix: new THREE.Matrix4().makeTranslation(u, H - 0.02, D / 2 + OVER) });
  }
  const scallopMesh = new THREE.Mesh(mergeGeos(scallops), awnMat);
  g.add(scallopMesh);
  /* Snow on the gold ridge bar: a narrow lumpy roll following it exactly —
     0.06 across and 0.03 tall, running the bar's full length, its underside
     0.005 down inside the gold. The old cap was a 0.30-deep slab on a bar
     only 0.09 deep, so it overhung each side by 0.105 and hung in the air. */
  const ridgeTop = H + RISE - 0.02 + 0.035;      // the gold bar's top face
  const snowRoll = (len, n, seed) => {
    const out = [];
    for (let i = 0; i < n; i++){
      const u = (i / (n - 1) - 0.5) * len;
      // a deterministic 0.86..1.14 wobble, so the roll is lumpy, not beaded
      const r = 0.032 * (0.86 + 0.28 * (((i * seed) % 5) / 4));
      out.push({ geo: new THREE.SphereGeometry(r, 8, 6),
        matrix: new THREE.Matrix4().makeScale(1, 0.5, 1)
          .premultiply(new THREE.Matrix4().makeTranslation(
            u, ridgeTop - 0.005 + r * 0.5, 0)) });
    }
    return out;
  };
  const cap = new THREE.Mesh(mergeGeos(snowRoll(W + OVER + 0.02, 21, 7)), snowCapMat);
  cap.receiveShadow = true; cap.renderOrder = 2;
  g.add(cap); snowCaps.push(cap);

  const hook = new THREE.Mesh(worldUV(new THREE.TorusGeometry(0.05, 0.012, 5, 10)), goldFoil());
  hook.position.set(W / 2 - 0.12, H - 0.1, D / 2 + 0.02);
  g.add(hook);
  const bulb = new THREE.Mesh(lampGeo, lampMat);
  bulb.position.set(W / 2 - 0.12, H - 0.22, D / 2 + 0.02);
  g.add(bulb);

  /* ---- goods on the counter, built from primitives ----
     The goods are batched into one InstancedMesh per kind and flushed into
     `marketGroup`, so each matrix has to be lifted out of the stall's own
     frame into the plaza's — otherwise every stall's goods land in a heap at
     the middle of the square. */
  const STALL_M = new THREE.Matrix4().compose(
    new THREE.Vector3(spot.x, PLAZA_Y, spot.z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, spot.rot, 0)),
    new THREE.Vector3(1, 1, 1));
  const M = (x, y, z, rx, ry, rz) => new THREE.Matrix4().multiplyMatrices(STALL_M,
    new THREE.Matrix4().compose(
      new THREE.Vector3(x, y, z),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
      new THREE.Vector3(1, 1, 1)));
  const RING_MAT = cardboard(0xC79A5B);
  const put = (kind, x, y, z, rx = 0, ry = 0, rz = 0, col = null) => {
    const m = M(x, y, z, rx, ry, rz);
    switch (kind){
      case 'gingerHeart': mktAdd('good:gheart:h', heartGeo, GOOD.gingerHeart, m, null, true); break;
      case 'gingerStar':  mktAdd('good:gstar:0.012', starGeo, GOOD.gingerStar, m, null, true); break;
      case 'sugar':       mktAdd('good:sugar:0.016', ballGeo(0.016, 6, 5), foil(0xffffff, 0.22), m, col, true); break;
      case 'zinc':        mktAdd('good:zinc:0.085', zincGeo, GOOD.zinc, m, null, true); break;
      case 'roseRed':     mktAdd('good:rose:0.030', roseGeo, GOOD.roseRed, m, null, true); break;
      case 'rosePink':    mktAdd('good:rose:0.030', roseGeo, GOOD.rosePink, m, null, true); break;
      case 'roseWhite':   mktAdd('good:rose:0.030', roseGeo, GOOD.roseWhite, m, null, true); break;
      case 'chrysY':      mktAdd('good:chrys:0.034', chrysGeo, GOOD.chrysY, m, null, true); break;
      case 'chrysW':      mktAdd('good:chrys:0.034', chrysGeo, GOOD.chrysW, m, null, true); break;
      case 'leaf':        mktAdd('good:leaf:0.05', leafGeo, GOOD.leaf, m, null, true); break;
      case 'oscypek':     mktAdd('good:oscypek:0.072', oscypekG, GOOD.oscypek, m, col, true); break;
      case 'grilled':     mktAdd('good:grilled:0.05', sliceGeo, GOOD.grilled, m, null, true); break;
    }
  };
  /* The bombki are instanced INTO this stall group rather than flushed into
     marketGroup, so their matrices must stay in the stall's own frame — going
     through M() would apply the stall's placement twice. */
  const LM = (x, y, z, rx = 0, ry = 0, rz = 0) => new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
    new THREE.Vector3(1, 1, 1));

  /* a small rack under the awning: pierniki hearts and the glass bombki both
     hang from it, and the oscypek bundle dangles from it too */
  const rack = new THREE.Group();
  g.add(rack);
  if (idx === 0 || idx === 2 || idx === 3){
    const bar = new THREE.Mesh(boxGeo(W + OVER - 0.1, 0.022, 0.022), boothWoodDark);
    bar.position.set(0, H - 0.12, 0.02);
    bar.castShadow = true; rack.add(bar);
  }

  if (idx === 0){
    /* ---- STALL 1 · PIERNIKI: hearts and stars only, never gingerbread men.
       Big hearts hang from the rack on red ribbons; smaller ones lie on the
       counter, some with a sugar button in the middle. ---- */
    /* two rows of three hearts on red ribbons, at staggered lengths, so the
       stall reads as properly stocked rather than three samples on a string */
    for (let i = 0; i < 6; i++){
      const col = i % 3, row = (i / 3) | 0;
      const lx = -0.5 + col * 0.5;
      const lz = 0.04 - row * 0.11;
      const len = 0.17 + row * 0.1 + col * 0.025;
      const rib = new THREE.Mesh(boxGeo(0.013, len, 0.006), GOOD.ribbon);
      rib.position.set(lx, H - 0.13 - len / 2, lz);
      rib.castShadow = true; rack.add(rib);
      mktAdd('good:gheart:h', heartGeo, GOOD.gingerHeart,
        M(lx, H - 0.13 - len - 0.075, lz + 0.015, 0, 0, rr(-0.12, 0.12)), null, true);
      mktAdd('good:sugar:0.016', ballGeo(0.016, 6, 5), foil(0xffffff, 0.22),
        M(lx, H - 0.13 - len - 0.07, lz + 0.02), CYCLE[(col + row) % CYCLE.length], true);
    }
    /* ---- the white lace cloth: a sheet over the counter and a short drape
       hanging off its front edge, one material, one canvas. The sheet samples
       the solid part of the cloth (v from LACE_HEM up) and the drape samples
       the scalloped hem (v 0 to LACE_HEM), so the frill hangs where it should. */
    {
      const CLOTH_W = W + 0.16, CLOTH_Z0 = D * 0.2 - D * 0.275 - 0.02,
            CLOTH_Z1 = D * 0.2 + D * 0.275;
      const sheet = new THREE.Mesh(
        new THREE.PlaneGeometry(CLOTH_W, CLOTH_Z1 - CLOTH_Z0), laceMat);
      const uv = sheet.geometry.attributes.uv;
      for (let i = 0; i < uv.count; i++)
        uv.setY(i, LACE_HEM + (1 - LACE_HEM) * uv.getY(i));
      sheet.rotation.x = -Math.PI / 2;
      sheet.position.set(0, TOP + 0.004, (CLOTH_Z0 + CLOTH_Z1) / 2);
      sheet.castShadow = true; sheet.receiveShadow = true;
      g.add(sheet);
      const drape = new THREE.Mesh(new THREE.PlaneGeometry(CLOTH_W, 0.19), laceMat);
      const duv = drape.geometry.attributes.uv;
      for (let i = 0; i < duv.count; i++) duv.setY(i, LACE_HEM * duv.getY(i));
      drape.position.set(0, TOP - 0.09, CLOTH_Z1 + 0.005);
      drape.castShadow = true;
      g.add(drape);
    }
    /* Cream-and-red checks hung behind the hearts, so the brown biscuits have
       something to read against now the back wall is plain wood. */
    {
      const cloth = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.12, 0.60),
        backclothMat);
      cloth.position.set(0, 1.26, -D / 2 + 0.075);
      cloth.receiveShadow = true;
      g.add(cloth);
    }
    /* Twelve on the counter: three rows of four, hearts and stars both, each
       lying on its own paper doily. The row is offset in x as well as in z, so
       no biscuit hides the one behind. */
    const doilies = [];
    const doilyGeo0 = doilyGeo(0.115);
    for (let i = 0; i < 12; i++){
      const heart = i % 2 === 0;
      const row = (i / 4) | 0, col = i % 4;
      const lx = -0.56 + col * 0.37 + (row % 2) * 0.185;
      const lz = 0.08 + row * 0.11;
      doilies.push({ geo: doilyGeo0,
        matrix: new THREE.Matrix4().makeTranslation(lx, TOP + 0.010, lz)
      });
      // stood up and leaning back against the boards, the way a stall displays them
      put(heart ? 'gingerHeart' : 'gingerStar', lx, TOP + 0.09, lz,
          -0.3, rr(0, TAU), rr(-0.1, 0.1));
      if (i % 4 === 0) put('sugar', lx, TOP + 0.095, lz + 0.035, 0, 0, 0, CYCLE[row]);
    }
    const doilyMesh = new THREE.Mesh(mergeGeos(doilies), doilyMat);
    // white on a white cloth, so the only thing that makes a doily read is the
    // little ring of shadow its raised scalloped edge throws on the lace
    doilyMesh.castShadow = true;
    g.add(doilyMesh);
  } else if (idx === 1){
    /* ---- STALL 2 · FLOWERS: the Main Square flower sellers. Zinc buckets of
       roses and chrysanthemums with greenery, and ready bouquets wrapped in
       paper cones on the counter. ---- */
    const ROSE = ['roseRed', 'rosePink', 'roseWhite'];
    const CHRYS = ['chrysY', 'chrysW'];
    const bloom = (x, y, z) => {
      const kind = rnd() < 0.55 ? ROSE[(rnd() * 3) | 0] : CHRYS[(rnd() * 2) | 0];
      const isC = kind === 'chrysY' || kind === 'chrysW';
      // the colour goes in the key: mktAdd latches the first material it is
      // given for a key and ignores every later one, so one key for all roses
      // meant every rose in the market shared whichever colour was rolled first
      mktAdd('good:' + kind + ':' + (isC ? 0.034 : 0.030), isC ? chrysGeo : roseGeo, GOOD[kind],
        M(x, y, z, rr(0, TAU), 0, rr(0, TAU)), null, true);
    };
    /* The bucket is a plain open tube, so the old bunches hovered over a hole:
       no stems, and nothing below the rim to fill it. Everything now grows out
       of the tin — the stems start 70% of the way down its depth and lean
       outward, the heads sit a hand's width above the rim, and a dark foliage
       plug closes the opening. */
    const RIM_Y = 0.175, RIM_R = 0.085;
    const STEM_Y = 0.005 + 0.70 * 0.17;             // 70% of the bucket's depth
    const UP = new THREE.Vector3(0, 1, 0), DIR = new THREE.Vector3();
    const Q = new THREE.Quaternion();
    const bucket = (x, z, n) => {
      mktAdd('good:zinc:0.085', zincGeo, GOOD.zinc, M(x, 0.09, z), null, true);
      mktAdd('good:foliage:0.082', foliageGeo, GOOD.foliage,
        M(x, RIM_Y - 0.014, z), null, true);
      // leaves flopping over the rim
      for (let i = 0; i < 5; i++){
        const a = rr(0, TAU);
        mktAdd('good:fleaf:0.03', foliageLeafGeo, GOOD.leaf,
          M(x + Math.cos(a) * (RIM_R - 0.012), RIM_Y + 0.002,
            z + Math.sin(a) * (RIM_R - 0.012),
            rr(-0.55, 0.55), a, rr(-0.55, 0.55)), null, true);
      }
      for (let i = 0; i < n; i++){
        const a = rr(0, TAU), rad = rr(0.02, 0.062);
        const hx = x + Math.cos(a) * rad, hz = z + Math.sin(a) * rad;
        const headY = RIM_Y + 0.10 + rr(0, 0.15);
        // the stem: rooted inside the tin, leaning out to meet its head
        const lean = 0.16;
        DIR.set(Math.sin(lean) * Math.cos(a), Math.cos(lean), Math.sin(lean) * Math.sin(a));
        Q.setFromUnitVectors(UP, DIR);
        const stemM = new THREE.Matrix4().multiplyMatrices(STALL_M, new THREE.Matrix4().compose(
          new THREE.Vector3(x + Math.cos(a) * rad * 0.45, STEM_Y, z + Math.sin(a) * rad * 0.45),
          Q, new THREE.Vector3(1, headY - STEM_Y, 1)));
        mktAdd('good:stem:0.006', stemGeo0, GOOD.stem, stemM, null, true);
        bloom(hx, headY, hz);
        mktAdd('good:leaf:0.05', leafGeo, GOOD.leaf,
          M(hx + rr(-0.03, 0.03), headY - rr(0.03, 0.10), hz + rr(-0.03, 0.03),
            rr(-0.9, 0.9), rr(0, TAU), rr(-0.9, 0.9)), null, true);
      }
    };
    /* Four buckets, all of them on the plaza in front of the stall. One used
       to stand right out by the island's rim, and three were hidden underneath
       the counter board. */
    bucket(-0.52, 0.62, 11);
    bucket(-0.10, 0.70, 9);
    bucket( 0.32, 0.64, 10);
    bucket( 0.94, 0.48, 9);
    // three ready bouquets in paper cones, tied with a ribbon
    for (let i = 0; i < 3; i++){
      const lx = -0.5 + i * 0.5;
      const wrap = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.26, 8, 1, true),
        i % 2 ? GOOD.cellophane : GOOD.kraft);
      wrap.position.set(lx, CT + 0.165, 0.06);
      wrap.rotation.x = Math.PI; wrap.castShadow = true; g.add(wrap);
      const tie = new THREE.Mesh(worldUV(new THREE.TorusGeometry(0.05, 0.008, 5, 10)), GOOD.ribbon);
      tie.position.set(lx, CT + 0.085, 0.06);
      tie.rotation.x = Math.PI / 2; g.add(tie);
      /* The mouth of the cone is at CT + 0.295. The heads used to start above
         that, so they floated clear of the paper; they now sit down inside and
         break the rim only just, with a few leaves filling the gap. */
      for (let k = 0; k < 7; k++){
        const a = rr(0, TAU), rad = rr(0.01, 0.062);
        bloom(lx + Math.cos(a) * rad, CT + 0.283 + rr(0, 0.048), 0.06 + Math.sin(a) * rad);
      }
      for (let k = 0; k < 3; k++){
        const a = rr(0, TAU);
        mktAdd('good:leaf:0.05', leafGeo, GOOD.leaf,
          M(lx + Math.cos(a) * 0.072, CT + 0.298 + rr(-0.02, 0.02), 0.06 + Math.sin(a) * 0.072,
            rr(-0.9, 0.9), a, rr(-0.9, 0.9)), null, true);
      }
    }
  } else if (idx === 2){
    /* ---- STALL 3 · OSCYPKI: the smoked highland sheep cheese. Spindles
       stacked in a pyramid and hung in a bundle, with a little grill plate
       and a bowl of cranberry jam. ---- */
    const SMOKE = [0xE8D29A, 0xE0C489, 0xD4B478, 0xC79B62, 0xB7803A];
    const rows = [[-0.36, 0, 0.36], [-0.18, 0.18], [0]];
    for (let r = 0; r < rows.length; r++){
      for (const lx of rows[r]){
        // each course rests in the hollows of the one below it
        put('oscypek', lx, CT + 0.073 + r * 0.126, -0.12 + r * 0.062 + rr(-0.015, 0.015),
            0, rr(0, TAU), Math.PI / 2 + rr(-0.1, 0.1), SMOKE[(rnd() * SMOKE.length) | 0]);
      }
    }
    for (let i = 0; i < 4; i++){
      const lx = 0.3 + (i % 2) * 0.09, lz = 0.04 - 0.1 * (i < 2 ? 0 : 1);
      const str = new THREE.Mesh(boxGeo(0.006, 0.16, 0.006), GOOD.thread);
      str.position.set(lx, H - 0.2, lz); rack.add(str);
      put('oscypek', lx, H - 0.3, lz, 0, rr(0, TAU), Math.PI / 2 + rr(-0.12, 0.12),
          SMOKE[(rnd() * SMOKE.length) | 0]);
    }
    const plate = new THREE.Mesh(
      worldUV(new THREE.CylinderGeometry(0.13, 0.14, 0.022, 14)), GOOD.grill);
    plate.position.set(-0.02, CT + 0.011, 0.25);
    plate.castShadow = true; g.add(plate);
    for (let i = 0; i < 3; i++){
      put('grilled', -0.07 + i * 0.06, CT + 0.03, 0.25 + rr(-0.02, 0.02),
          rr(-0.2, 0.2), 0, rr(-0.2, 0.2));
    }
    const bowl = new THREE.Mesh(
      worldUV(new THREE.SphereGeometry(0.055, 12, 8, 0, TAU, Math.PI / 2, Math.PI / 2)),
      cardboard(0xE8E2D2));
    bowl.position.set(0.44, CT + 0.055, 0.27);
    bowl.castShadow = true; g.add(bowl);
    const jam = new THREE.Mesh(ballGeo(0.045, 10, 6, 0, TAU, 0, Math.PI / 2), GOOD.jam);
    jam.position.set(0.44, CT + 0.062, 0.27); g.add(jam);
  } else {
    /* ---- STALL 4 · BOMBKI: hand-blown Polish glass, the star of the market.
       Open boxes of them on the counter, and eleven more hung from the rack
       on threads of different lengths (they sway, more during the shake). ---- */
    const glass = [];
    for (let b = 0; b < 2; b++){
      const bx = -0.26 + b * 0.52;
      const crate = new THREE.Group();
      crate.position.set(bx, CT - 0.040, 0.08);
      crate.castShadow = true; crate.receiveShadow = true;
      g.add(crate);
      crate.add(new THREE.Mesh(mergeGeos([
        { geo: boxGeo(0.44, 0.02, 0.3), matrix: new THREE.Matrix4() },
        { geo: boxGeo(0.44, 0.09, 0.02),
          matrix: new THREE.Matrix4().makeTranslation(0, 0.045, 0.14) },
        { geo: boxGeo(0.44, 0.09, 0.02),
          matrix: new THREE.Matrix4().makeTranslation(0, 0.045, -0.14) },
        { geo: boxGeo(0.02, 0.09, 0.3),
          matrix: new THREE.Matrix4().makeTranslation(0.21, 0.045, 0) },
        { geo: boxGeo(0.02, 0.09, 0.3),
          matrix: new THREE.Matrix4().makeTranslation(-0.21, 0.045, 0) },
      ]), boothWood));
      for (let i = 0; i < 5; i++){
        glass.push({ shape: 'ball',
          m: LM(bx - 0.15 + (i % 3) * 0.15, CT + 0.022, 0.08 + ((i / 3) | 0) * 0.12,

  glassCap.position.y = 1.4; glassCap.castShadow = true; cartGroup.add(glassCap);
  /* the obwarzanki heaped inside the glass box — the batch is flushed into

  const CART_M = new THREE.Matrix4().compose(

      new THREE.Vector3(1, 1, 1)));

     three more sticks on the cart's roof carry more. A ring's hole points along

     +Z) has to be threaded on a dowel that runs front-to-back. Each ring is a
     braided torus and carries its own topping: sesame, poppy or coarse salt. */
  const OBW_R = 0.095, OBW_T = 0.030;          // the braided ring, thin

    for (let i = 0; i < pos.count; i++){

        .normalize().multiplyScalar(0.07);

      const q = p.clone().add(up).add(side);

    { key: 'obw:salt:0.007',   geo: ballGeo(0.007, 5, 4), mat: GOOD.salt },

  let obwCount = 0;

  const obwarzanek = (x, y, z, dz) => {

  for (let i = 0; i < 3; i++){

      worldUV(new THREE.CylinderGeometry(0.014, 0.017, 1.16, 6)), boothWood);

  dowelMesh.castShadow = true;
  cartGroup.add(dowelMesh);
  /* The axle runs ACROSS the cart, along Z, and each wheel is a disc in the
     plane of the cart's long side, so the cart rolls forward and back along its
     length. A torus already lies in XY, so the disc needs no rotation at all —

/* ---------- A SMALL CHRISTMAS TREE, flanking the dragon's cave ---------- */
const treeGroup = new THREE.Group();
{
  // moved in off the plaza corner: it now stands beside the cave, framing it
  const spot = { x: 2.75, z: 1.8 };
  treeGroup.position.set(spot.x, PLAZA_Y, spot.z);
  marketGroup.add(treeGroup);
  const needle = cardboard(0x1C4A2E);
  const trunk = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(0.06, 0.08, 0.3, 8)), boothWoodDark);
  trunk.position.y = 0.15; trunk.castShadow = true; treeGroup.add(trunk);
  /* four tiers, tall enough that the gold star clears the awnings and the tree
     still reads from the default camera */
  const TIERS = [[0.44, 0.66, 0.36], [0.36, 0.58, 0.92], [0.27, 0.50, 1.36], [0.19, 0.42, 1.74]];
  for (const [r, h, y] of TIERS){
    const c = new THREE.Mesh(worldUV(new THREE.ConeGeometry(r, h, 10)), needle);
    c.position.y = y; c.castShadow = true; c.receiveShadow = true; treeGroup.add(c);
  }
  const tstar = new THREE.Mesh(starGeo, goldFoil());
  tstar.scale.set(2.2, 2.2, 2.6); tstar.position.y = 2.06;
  tstar.castShadow = true; treeGroup.add(tstar);
  /* A cone narrows as it rises, so anything sitting on a tier has to go on THAT
     tier's own surface. ConeGeometry is centred on its own origin, so a tier's
     wide end is at y0 − h/2 and its point at y0 + h/2 — the old onTier() assumed
     the base was at y0, which put every bauble a half-height too high, out in
     the air beside the tree. surfaceAt() finds the tier a height falls in and
     returns that cone's radius there. */
  const surfaceAt = (y, sink = 0) => {
    for (const [R, h, y0] of TIERS){
      const base = y0 - h / 2, top = y0 + h / 2;
      if (y >= base - 0.02 && y <= top + 0.02){
        const k = clamp((y - base) / h, 0, 1);
        return { r: R * (1 - k) + sink, R, h, y0, base, top };
      }
    }
    return null;
  };
  /* the same glossy glass the ornament stall is blown from, one material per
     palette colour so the merge can still fold them down */
  const treeGlass = BOMBKI_COLS.map(c => {
    const m = bombkiMat.clone();
    m.color = new THREE.Color(c);
    return m;
  });
  for (let i = 0; i < 8; i++){
    const t = TIERS[i % TIERS.length];
    const a = rr(0, TAU);
    const y = rr(t[2] - t[1] / 2 + 0.07, t[2] + t[1] / 2 - 0.05);
    const s = surfaceAt(y, 0.055 * 0.35);
    if (!s) continue;
    const b = new THREE.Mesh(bombkiGeo.ball, treeGlass[i % treeGlass.length]);
    b.position.set(Math.cos(a) * s.r, y, Math.sin(a) * s.r);
    b.castShadow = true; treeGroup.add(b);
  }
  /* ---- the lower two tiers, which used to come down to bare needles ---- */
  /* fourteen more baubles, spread evenly around the two bottom tiers and sunk a
     little way into the needles so they sit ON the cone, not beside it */
  const LOW_TIERS = TIERS.slice(0, 2);
  const lowSpan = (t) => [t[2] - t[1] / 2 + 0.09, t[2] + t[1] / 2 - 0.07];
  for (let i = 0; i < 14; i++){
    const t = LOW_TIERS[i % 2];
    const [y0r, y1r] = lowSpan(t);
    const y = y0r + (y1r - y0r) * ((i * 0.37) % 1);      // even, non-repeating
    const a = (i / 14) * TAU * 2 + t[0];                   // two full rounds
    const s = surfaceAt(y, 0.052 * 0.30);
    if (!s) continue;
    const b = new THREE.Mesh(bombkiGeo.ball, treeGlass[i % treeGlass.length]);
    b.position.set(Math.cos(a) * s.r, y, Math.sin(a) * s.r);
    b.castShadow = true; treeGroup.add(b);
  }
  /* ---- one continuous string of warm lights, spiralling up the lower tiers
     and on into the ones above, on a thin wire ---- */
  const treeLampMat = new THREE.MeshStandardMaterial({
    color: 0xF2D488, emissive: 0xFFC46A, emissiveIntensity: 1.0, roughness: 0.4, metalness: 0,
  });
  treeLampMat.userData.glowScale = 0.6; glowMats.push(treeLampMat);
  for (let i = 0; i < 7; i++){
    const t = TIERS[i % TIERS.length];
    const a = rr(0, TAU);
    const y = rr(t[2] - t[1] / 2 + 0.10, t[2] + t[1] / 2 - 0.07);
    const s = surfaceAt(y, 0.032 * 0.35);
    if (!s) continue;
    const b = new THREE.Mesh(ballGeo(0.032, 6, 5), treeLampMat);
    b.position.set(Math.cos(a) * s.r, y, Math.sin(a) * s.r);
    treeGroup.add(b);
  }
  {
    /* from just above the trunk to the top of the second tier: 2.5 turns, 30
       bulbs, every one of them on the cone's own surface with the wire just
       outside it, so the string hugs the branches all the way round */
    const yLo = TIERS[0][2] - TIERS[0][1] / 2 + 0.10;
    const yHi = TIERS[1][2] + TIERS[1][1] / 2 - 0.08;
    const TURNS = 2.5, NBULB = 30, PHASE = 0.6;
    const helix = (u, sink) => {
      const y = yLo + (yHi - yLo) * u;
      const a = PHASE + u * TAU * TURNS;
      const s = surfaceAt(y, sink);
      if (!s) return null;
      return new THREE.Vector3(Math.cos(a) * s.r, y, Math.sin(a) * s.r);
    };
    const wirePts = [];
    for (let i = 0; i <= 64; i++){
      const v = helix(i / 64, 0.010);
      if (v) wirePts.push(v);
    }
    if (wirePts.length > 2){
      const wire = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(wirePts), 72, 0.0055, 4, false),
        GOOD.thread);
      treeGroup.add(wire);
    }
    const bulbParts = [];
    for (let i = 0; i < NBULB; i++){
      const v = helix((i + 0.5) / NBULB, 0.030);
      if (!v) continue;
      const b = new THREE.Mesh(ballGeo(0.030, 7, 6), treeLampMat);
      b.position.copy(v);
      b.castShadow = true;
      treeGroup.add(b);
      bulbParts.push(b);
    }
  }
  markFootprint(spot.x, spot.z, 0.55, 0.55, 0);
}

/** Mark a mesh as never-merge. Some parts move on their own or hang off a pivot

function dyn(mesh){ mesh.userData.dyn = true; return mesh; }

/** A soft curved white strand, used for the plume and the horse's tail. */
function strandGeo(len, bend, r = 0.018){
  const pts = [];

/* ---- his prancing path, and the behaviour that goes with it ---- */
const laj = {
  u: 0, spin: 0, spinT: 0, nextSpin: 8, wait: 0, mode: 'prance',
  tap: 0, bobT: 0, wobble: 0,
};
/* The loop now keeps to the open plaza IN FRONT of the stall rows — z about
   5.0 to 6.0, x -3.8 to 3.8 — where nothing stands in his way and he is seen
   against open rock rather than lost among the awnings. The cart and the tree
   have moved up to the cave, so there is nothing left to loop around. Every
   point sits well over 0.8 inside the rim. It only ever touches the fire
   corridor (x ±2, z 1.0-4.5) if that corridor is ever widened; today it does
   not come near it. */
const LAJ_PATH = [
  [-3.80, 5.30], [-2.90, 5.80], [-1.40, 5.95], [ 0.00, 5.90],
  [ 1.40, 5.95], [ 2.90, 5.80], [ 3.80, 5.30], [ 3.35, 4.95],
  [ 2.00, 4.90], [ 0.00, 4.98], [-2.00, 4.90], [-3.35, 4.95],
];
function lajPointAt(u, out){
  const n = LAJ_PATH.length;
  const f = ((u % 1) + 1) % 1 * n;
  const i = Math.floor(f), fr = f - i;
  const a = LAJ_PATH[i % n], b = LAJ_PATH[(i + 1) % n];
  // smooth the corners a little
  const e = fr * fr * (3 - 2 * fr);
  out.set(lerp(a[0], b[0], e), PLAZA_Y, lerp(a[1], b[1], e));
  return out;
}
/** The dragon's fire corridor: the clear lane in front of his cave. */
const FIRE_X = 2.0, FIRE_Z0 = 1.0, FIRE_Z1 = 4.5;
const _lajAhead = new THREE.Vector3();
const inFireCorridor = (x, z) => Math.abs(x) < FIRE_X && z > FIRE_Z0 && z < FIRE_Z1;
/** Would the next step of his path cross the dragon's fire corridor? */
function lajWouldCrossCorridor(u, ahead){
  const p = lajPointAt(u + ahead, _lajAhead);
  return inFireCorridor(p.x, p.z);
}

  const g = lajGoldSparks.group;
  g.position.copy(lajkonik.position);
  g.visible = true;
  for (const p of lajGoldSparks){
    p.sp.position.set(0.22, 0.7, 0.1);
    p.vel.set(rr(-1.2, 1.2), rr(0.6, 2.2), rr(-1.2, 1.2));
    p.life = p.max;                    // not 0: the group shows only while life > 0
    p.sp.visible = true;
