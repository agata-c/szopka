/* ======================================================================
   SNOW MOUNDS — real little drifts, not dots
   A mound is an icosahedron pushed up by a height field, flattened on the
   bottom so it sits ON the surface, and roughened so no two look alike.
   Three variants share one InstancedMesh; the pick is baked into each
   instance matrix, so the whole pile costs a single draw call.
   ====================================================================== */
const MOUND_VARIANTS = 3;
const GROUND_MAX = 1400, ROOF_MAX = 400;
const spillMax = 300;
const snowWhite = new THREE.MeshStandardMaterial({
  color: 0xEEF3FA, roughness: 0.9, metalness: 0, vertexColors: true,
});

/* A position hash, so duplicated vertices of the non-indexed icosahedron get
   the SAME displacement and the surface never tears open. */
function hash3(x, y, z){
  const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return s - Math.floor(s);
}

/** One mound variant: unit-wide, flat-bottomed, taller than wide, lumpy. */
function makeMoundGeo(seedOff, sharp){
  const g = new THREE.IcosahedronGeometry(1, 2);
  const p = g.attributes.position;
  const col = new Float32Array(p.count * 3);
  const rough = sharp ? 0.26 : 0.15;      // ±25 % lumpy displacement
  const bump  = sharp ? 0.46 : 0.30;      // extra noise on the peak
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), y0 = p.getY(i), z = p.getZ(i);
    const rad = Math.hypot(x, z);
    const dome = Math.max(0, 1 - rad * rad);          // 1 at the middle, 0 at the rim
    // a smooth height field over the plan, so the drift is tall in the centre
    const hf = fbm2(x * 0.85 + seedOff, z * 0.85 - seedOff, 3, 3) - 0.5;
    const lump = hash3(x * 3.1 + seedOff, y0 * 2.7, z * 3.1 - seedOff) - 0.5;
    let y = y0 * (0.5 + 0.5 * dome) + hf * bump + lump * rough;
    y = Math.max(y * 0.66, 0);                       // flat bottom: clamp to y ≥ 0
    // the middle swells outward a little, the edges stay tight
    const w = 1 + hf * 0.14 + lump * rough * 0.5;
    p.setXYZ(i, x * w, y, z * w);
    // faint blue-grey in the crevices: the low, lumpy areas read as shadowed
    const crev = clamp(0.55 * (1 - dome) + 0.75 * clamp(1 - y * 1.6, 0, 1), 0, 1);
    col[i * 3]     = 1 - crev * 0.30;
    col[i * 3 + 1] = 1 - crev * 0.25;
    col[i * 3 + 2] = 1 - crev * 0.10;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}
{   // one InstancedMesh per variant: a merged geometry cannot be drawn
    // selectively per instance without a custom shader, and 3 draw calls is
    // cheaper than that
  const geos = [makeMoundGeo(0, false), makeMoundGeo(7.3, true), makeMoundGeo(19.1, false)];
  const cap = Math.ceil((GROUND_MAX + ROOF_MAX) / MOUND_VARIANTS) + 8;
  var moundMeshes = geos.map(g => {
    const im = new THREE.InstancedMesh(g, snowWhite, cap);
    im.count = 0;
    im.castShadow = false;
    im.receiveShadow = true;
    im.frustumCulled = false;
    island.add(im);
    return im;
  });
  var MOUND_CAP = cap;
}

/* Mounds live in island-local space, so one mesh parented to `island` carries
   both the rock-top drifts and the roof drifts and rides the drift and shake
   for free. Ground mounds and roof mounds are kept in separate arrays only so
   their caps can be counted separately. */
const mounds = [];        // { x, y, z, size, h, rot, v, roof, k, melt, vx, vz }
let spillMesh = null;
const spill = [];        // { pos, vel, rot, spin, life, max, s }
const spillChunkGeo = new THREE.IcosahedronGeometry(1, 0);
{
  const sm = new THREE.MeshStandardMaterial({
    color: 0xEEF3FA, roughness: 0.9, metalness: 0,
  });
  spillMesh = new THREE.InstancedMesh(spillChunkGeo, sm, spillMax);
  spillMesh.count = 0;
  spillMesh.castShadow = false;
  spillMesh.receiveShadow = false;
  spillMesh.frustumCulled = false;
  island.add(spillMesh);
}

/* The szopka's footprint on the rock, in island-local coords. */
const SZ_Z = szopka.position.z;                     // -1.5
const SZ_Y = szopka.position.y;                     // 0
const SZ_HX = GT_W / 2 + 0.1, SZ_HZ = GT_D / 2 + 0.1;
function overSzopka(x, z){
  return Math.abs(x) < SZ_HX && Math.abs(z - SZ_Z) < SZ_HZ;
}

/* ---- FLAT ROOF AREAS, in szopka-local, HIGHEST FIRST --------------------
   A flake falling over one of these lands on it as a mound at that roof's
   height. Domes, spires and the helmet are deliberately absent — flakes over
   them keep vanishing, which is what the snow caps are for.
   `inner` is an exclusion radius (the spire bases on the tower tops);
   `holes` are rectangles punched out of the plan. */
const ROOF_EDGE_KEEP = 0.15;      // mounds stay this far inside each roof edge
const ROOFS = [
  { name:'stageA', y: 10.2 + 0.18, x:0, z:0, hx:1.34, hz:1.14, holes:[], inner:0 },
  { name:'towerL', y: GT_Y0 - 0.1 + 9.4 + 0.2, x:-TOWER_X, z:TOWER_Z, hx:0.86, hz:0.86, holes:[], inner:0.80 },
  { name:'midTier', y: MT_Y1 + 0.03, x:0, z:0, hx:MT_W/2, hz:MT_D/2,
    // the second hole is the chimney and the sweep: no snow settles on either
    holes:[{ x:0, z:0, hx:1.62, hz:1.42 },
           { x:(CHIMNEY_X + SWEEP_X) / 2, z:(CHIMNEY_Z + SWEEP_Z) / 2, hx:0.95, hz:0.95 }], inner:0 },
  { name:'towerR', y: GT_Y0 - 0.1 + 7.0 + 0.2, x:TOWER_X, z:TOWER_Z, hx:0.86, hz:0.86, holes:[], inner:0.72 },
  { name:'ground', y: GT_Y1 + 0.62, x:0, z:0, hx:GT_W/2, hz:GT_D/2,
    holes:[{ x:0, z:0, hx:MT_W/2, hz:MT_D/2 },
           { x:-TOWER_X, z:TOWER_Z, hx:TOWER_W/2 + 0.05, hz:TOWER_W/2 + 0.05 },
           { x: TOWER_X, z:TOWER_Z, hx:TOWER_W/2 + 0.05, hz:TOWER_W/2 + 0.05 }],
    inner:0 },
];
for (const r of ROOFS){
  r.hx -= ROOF_EDGE_KEEP; r.hz -= ROOF_EDGE_KEEP;
  r.islandX = r.x; r.islandZ = r.z + SZ_Z; r.islandY = r.y + SZ_Y;
}
const ROOF_TOP = ROOFS[0].islandY;

/** Is (x,z) — szopka-local — on this roof's flat, walkable area? */
function onRoof(r, x, z){
  const dx = x - r.x, dz = z - r.z;
  if (Math.abs(dx) > r.hx || Math.abs(dz) > r.hz) return false;
  if (r.inner > 0 && Math.hypot(dx, dz) < r.inner) return false;   // spire base
  for (const h of r.holes){
    if (Math.abs(x - h.x) < h.hx && Math.abs(z - h.z) < h.hz) return false;
  }
  return true;
}
/** The highest roof a flake at szopka-local (x,z) would land on, or null. */
function roofUnder(x, z){
  for (const r of ROOFS) if (onRoof(r, x, z)) return r;
  return null;
}

/* ---- MOUNDS: grow, melt, get kicked ------------------------------------- */
const MOUND_MAX_W = 0.45, MOUND_MAX_H = 0.35, MERGE_DIST = 0.3;
const ROCK_LAND_Y = PED_H + 0.02;

/** Drop a mound at an island-local spot, or feed a neighbour within MERGE_DIST. */
function addMound(x, y, z, roof){
  for (const m of mounds){
    if (m.roof !== roof) continue;
    const d = Math.hypot(m.x - x, m.z - z);
    if (d < MERGE_DIST + m.size * 0.5){
      // a neighbouring drift GROWS instead of a new one appearing
      m.size = Math.min(MOUND_MAX_W, m.size * 1.12);
      m.h    = Math.min(MOUND_MAX_H, m.h * 1.15);
      return m;
    }
  }
  const cap = roof === null ? GROUND_MAX : ROOF_MAX;
  let live = 0;
  for (const m of mounds) if ((m.roof === null) === (roof === null)) live++;
  if (live >= cap){
    // recycle the smallest mound of this kind rather than dropping the flake
    let worst = -1, ws = Infinity;
    for (let i = 0; i < mounds.length; i++){
      const m = mounds[i];
      if ((m.roof === null) !== (roof === null)) continue;
      if (m.size < ws && m.k > 0){ ws = m.size; worst = i; }
    }
    if (worst >= 0) mounds.splice(worst, 1);
  }
  const m = {
    x, y, z, roof,
    size: rr(0.08, 0.12), h: rr(0.07, 0.11),
    rot: rnd() * TAU, v: (rnd() * 3) | 0,
    sxz: rr(0.8, 1.25), sy: rr(0.6, 1.3),
    k: 1,                          // current multiplier — 1 solid, 0 melted
    melting: false, meltDelay: 0, meltDur: 1, meltT: 0,
    vx: 0, vz: 0,                   // kick velocity
  };
  mounds.push(m);
  return m;
}

/** A knocked-off chunk: gravity, outward push, tumble. */
function spawnSpill(x, y, z, s, vx, vz){
  if (spill.length >= spillMax) spill.shift();
  const life = rr(1.6, 3.2);
  spill.push({
    pos: new THREE.Vector3(x, y + s * 0.4, z),
    vel: new THREE.Vector3(vx, rr(-0.1, 0.35), vz),
    rot: rnd() * TAU,
    spin: new THREE.Vector3(rr(-4, 4), rr(-4, 4), rr(-4, 4)),
    life, max: life, s,
  });
}

/** Distance to the edge a mound would be thrown off, and that edge's normal. */
const _edge = { d: 0, nx: 0, nz: 0 };
function edgeToThrow(m){
  if (m.roof === null){
    const r = Math.hypot(m.x, m.z) || 1;
    _edge.d = rimDistAt(m.x, m.z);
    _edge.nx = m.x / r; _edge.nz = m.z / r;
  } else {
    const r = m.roof;
    const dx = m.x - r.islandX, dz = m.z - r.islandZ;
    // nearest of the four sides of the walkable rect
    const cand = [
      { d: r.hx - Math.abs(dx), nx: 1,  nz: 0 },
      { d: r.hx + Math.abs(dx), nx: -1, nz: 0 },
      { d: r.hz - Math.abs(dz), nx: 0,  nz: 1 },
      { d: r.hz + Math.abs(dz), nx: 0,  nz: -1 },
    ];
    let best = cand[0];
    for (const c of cand) if (c.d < best.d) best = c;
    _edge.d = Math.max(0, best.d);
    _edge.nx = Math.sign(dx) * best.nx || best.nx;
    _edge.nz = Math.sign(dz) * best.nz || best.nz;
    const l = Math.hypot(_edge.nx, _edge.nz) || 1;
    _edge.nx /= l; _edge.nz /= l;
  }
  return _edge;
}

/* A shake throws the snow off. The kick is sized so it actually carries each
   mound past its edge: v0 = sqrt(2 · decel · d), then a little overshoot and a
   random sideways drift. While it is still snowing, ~15 % of the mounds
   survive (small kick, and they lose 40 % of their size). */
const KICK_DECEL = 2.2, SURVIVE_FRAC = 0.13;
function kickMounds(snowing){
  for (let i = mounds.length - 1; i >= 0; i--){
    const m = mounds[i];
    const survive = snowing && rnd() < SURVIVE_FRAC;
    const e = edgeToThrow(m);
    if (survive){
      m.size *= 0.6;                // the shake knocked 40 % of it off
      m.vx = e.nx * rr(0.1, 0.35) + rr(-0.3, 0.3);
      m.vz = e.nz * rr(0.1, 0.35) + rr(-0.3, 0.3);
      continue;
    }
    const v0 = Math.sqrt(2 * KICK_DECEL * e.d) * rr(1.15, 1.45) + 0.3;
    m.vx = e.nx * v0 + rr(-0.5, 0.5);
    m.vz = e.nz * v0 + rr(-0.5, 0.5);
  }
}

/* ---------- OCCASIONAL SMALL AVALANCHES ----------
   While it snows, every 6-12 s one fully-grown drift that has crept up to an
   edge lets go on its own. It uses the same kick physics as the shake, so it
   really does slide outward for about a second before it clears the rim and
   tips off as 2-3 spill chunks. Only ever one at a time, and never while the
   snow is off — then drifts only melt. */
const AVALANCHE_EDGE = 1.5;
const avalanche = { t: rr(6, 12), m: null };
function updateAvalanche(dt, snowing){
  if (!snowing){                       // nothing slides off: it just melts
    avalanche.t = rr(6, 12);
    avalanche.m = null;
    return;
  }
  if (avalanche.m){                    // one already on its way — wait for it
    if (mounds.indexOf(avalanche.m) < 0) avalanche.m = null;   // it went over
    return;
  }
  avalanche.t -= dt;
  if (avalanche.t > 0) return;
  avalanche.t = rr(6, 12);
  // the fullest drift sitting right up against an edge, ground or roof
  let best = null, bestD = Infinity;
  for (const m of mounds){
    if (m.melting || m.k <= 0) continue;
    if (m.vx !== 0 || m.vz !== 0) continue;             // already on the move
    if (m.size < MOUND_MAX_W - 1e-3) continue;          // has to be full size
    const e = edgeToThrow(m);
    if (e.d > AVALANCHE_EDGE) continue;
    if (e.d < bestD){ bestD = e.d; best = m; }
  }
  if (!best){
    // nothing fully grown near an edge yet — look again shortly, so the gap
    // between avalanches stays near the 6-12 s rhythm instead of drifting
    avalanche.t = rr(1.5, 3);
    return;
  }
  const e = edgeToThrow(best);
  const v0 = Math.sqrt(2 * KICK_DECEL * e.d) * rr(1.0, 1.2) + 0.25;
  best.vx = e.nx * v0 + rr(-0.25, 0.25);
  best.vz = e.nz * v0 + rr(-0.25, 0.25);
  avalanche.m = best;
}

/** Snow OFF: every mound starts melting, each after its own random delay, so
    the drifts disappear unevenly rather than all at once. */
function startMelting(){
  for (const m of mounds){
    if (!m.melting){
      m.melting = true;
      m.meltDelay = rr(0, 6);
      m.meltDur = rr(20, 30);
      m.meltT = 0;
    }
  }
}
/** Snow back ON: cancel any melting and let the drifts stand again. */
function stopMelting(){
  for (const m of mounds){ m.melting = false; m.meltDelay = 0; m.meltT = 0; m.k = 1; }
}

const _mm = new THREE.Matrix4(), _mq = new THREE.Quaternion();
const _mp = new THREE.Vector3(), _ms = new THREE.Vector3();
const _euler = new THREE.Euler();
const _isleInv = new THREE.Matrix4();
const _local = new THREE.Vector3();

function updateMounds(dt){
  const snowing = state.snowTarget > 0.5;
  for (let i = mounds.length - 1; i >= 0; i--){
    const m = mounds[i];
    // --- melting: shrink away in place, spawning nothing
    if (m.melting){
      if (m.meltDelay > 0){
        m.meltDelay -= dt;
      } else {
        m.meltT += dt;
        m.k = clamp(1 - m.meltT / m.meltDur, 0, 1);
        if (m.k <= 0.001){ mounds.splice(i, 1); continue; }   // gone, no drip
      }
    }
    // --- kicked motion: outward, decelerating
    if (m.vx !== 0 || m.vz !== 0){
      const sp = Math.hypot(m.vx, m.vz);
      if (sp <= KICK_DECEL * dt){ m.vx = 0; m.vz = 0; }
      else {
        const nx = m.vx / sp, nz = m.vz / sp;
        m.vx -= nx * KICK_DECEL * dt;
        m.vz -= nz * KICK_DECEL * dt;
      }
      m.x += m.vx * dt;
      m.z += m.vz * dt;
      m.rot += dt * 1.4;
      // has it cleared its edge?
      const e = edgeToThrow(m);
      const across = m.roof === null
        ? !overRockTop(m.x, m.z, -0.06)
        : !onRoof(m.roof, m.x - 0, m.z - SZ_Z);
      if (across){
        // a big mound breaks into 2–3 chunks, a small one into a single puff
        const chunks = m.size > 0.15 ? 2 + ((rnd() * 2) | 0) : 1;
        for (let c = 0; c < chunks; c++){
          spawnSpill(m.x, m.y, m.z, m.size * rr(0.45, 0.8),
                     m.vx * rr(0.5, 0.9) + rr(-0.6, 0.6),
                     m.vz * rr(0.5, 0.9) + rr(-0.6, 0.6));
        }
        mounds.splice(i, 1);
        continue;
      }
    }
  }

  // --- write the instance matrices: one InstancedMesh per variant
  for (let v = 0; v < MOUND_VARIANTS; v++){
    const mesh = moundMeshes[v];
    let c = 0;
    for (let i = 0; i < mounds.length; i++){
      const m = mounds[i];
      if (m.v !== v) continue;
      const s = m.size * m.k, hgt = m.h * m.k;
      _euler.set(0, m.rot, 0);
      _mq.setFromEuler(_euler);
      _mp.set(m.x, m.y, m.z);
      _ms.set(s * m.sxz, hgt * m.sy, s * m.sxz);
      _mm.compose(_mp, _mq, _ms);
      mesh.setMatrixAt(c++, _mm);
    }
    mesh.count = c;
    if (c) mesh.instanceMatrix.needsUpdate = true;
  }

  // --- spill chunks: gravity, fade by y = -12
  for (let i = spill.length - 1; i >= 0; i--){
    const p = spill[i];
    p.life -= dt;
    p.vel.y -= 5.5 * dt;
    p.pos.addScaledVector(p.vel, dt);
    p.rot += p.spin.x * dt;
    if (p.life <= 0 || p.pos.y < -12) spill.splice(i, 1);
  }
  for (let i = 0; i < spill.length; i++){
    const p = spill[i];
    const k = clamp(p.life / p.max, 0, 1);
    const s = p.s * Math.min(1, k * 2.2);
    _euler.set(p.rot, p.rot * 0.7, p.rot * 1.3);
    _mq.setFromEuler(_euler);
    _mm.compose(p.pos, _mq, _ms.setScalar(s));
    spillMesh.setMatrixAt(i, _mm);
  }
  spillMesh.count = spill.length;
  if (spill.length) spillMesh.instanceMatrix.needsUpdate = true;
}

/* Snow falling off the roof/cornice edges when the island is shaken. The count
   is scaled by how much roof snow is actually there, so a shake on a bare
   building throws nothing at all. */
function burstRoofSpill(roofAccum){
  if (roofAccum < 0.05) return 0;
  const count = Math.round(160 * roofAccum);
  for (let i = 0; i < count; i++){
    const r = ROOFS[i % ROOFS.length];
    // a point on that roof's outer edge
    const a = rnd() * TAU;
    const ex = r.islandX + Math.cos(a) * r.hx;
    const ez = r.islandZ + Math.sin(a) * r.hz;
    const nx = Math.cos(a), nz = Math.sin(a);
    spawnSpill(ex, r.islandY, ez, rr(0.06, 0.1),
               nx * rr(0.2, 0.9) + rr(-0.4, 0.4),
               nz * rr(0.2, 0.9) + rr(-0.4, 0.4));
  }
  return count;
}

/* ---------- snow fall ---------- */
function updateSnow(dt){
  const target = state.snowTarget;
  state.snow = lerp(state.snow, target, 1 - Math.exp(-dt * 1.6));
  const snowing = target > 0.5;
  const wasMelting = mounds.some(m => m.melting);

  /* Accumulation rises over ~35 s while snowing. Once it stops the caps melt
     away over ~25 s — nothing slides any more, it just melts. Switching snow
     back on cancels any melting in progress. */
  if (snowing){
    roofAccum   = Math.min(1, roofAccum   + dt / 35);
    groundAccum = Math.min(1, groundAccum + dt / 35);
    if (wasMelting) stopMelting();
  } else {
    roofAccum   = Math.max(0, roofAccum   - dt / 25);
    groundAccum = Math.max(0, groundAccum - dt / 25);
    if (!wasMelting) startMelting();
  }

  /* One drift now and then lets go on its own, but only while it snows. */
  updateAvalanche(dt, snowing);

  /* Every roof/dome cap shares snowCapMat, so they all take roofAccum. The
     rock-top cap has its own material instance and takes groundAccum. */
  snowCapMat.opacity = roofAccum * 0.85;
  for (const c of snowCaps) c.visible = roofAccum > 0.004;
  if (pedCapMesh){
    pedCapMesh.visible = groundAccum > 0.004;
    pedCapMeshMat.opacity = groundAccum * 0.85;
  }

  const anythingLeft = state.snow > 0.002 || mounds.length > 0 || spill.length > 0;
  if (!anythingLeft && target === 0){
    snowPoints.visible = false;
    updateMounds(dt);
    return;
  }
  snowPoints.visible = true;
  snowMat.opacity = state.snow * 0.85;

  const arr = snowPoints.geometry.attributes.position.array;
  const fall = dt * lerp(0.35, 1.4, state.snow);
  // one inverse island transform per frame — flakes are authored in world space
  // but must be tested against the island's own top surface
  _isleInv.copy(island.matrixWorld).invert();
  const rockLanding = PED_H + 0.03;
  const testTop = ROOF_TOP + 0.6;
  for (let i = 0; i < SNOW_N; i++){
    const i3 = i * 3;
    arr[i3 + 1] -= snowVel[i * 2 + 1] * fall;
    arr[i3] += (Math.sin(t * snowVel[i * 2] + i) * 0.5 + 0.22) * fall * 0.42;
    arr[i3 + 2] += Math.cos(t * snowVel[i * 2] * 0.8 + i * 0.7) * fall * 0.3;
    if (arr[i3 + 1] < SNOW_Y0){
      arr[i3 + 1] = SNOW_Y1;
      const a = rnd() * TAU, r = Math.sqrt(rnd()) * SNOW_R;
      arr[i3] = Math.cos(a) * r;
      arr[i3 + 2] = Math.sin(a) * r;
    }
    // keep inside the cylinder
    let d = Math.hypot(arr[i3], arr[i3 + 2]);
    if (d > SNOW_R){ arr[i3] *= SNOW_R / d; arr[i3 + 2] *= SNOW_R / d; }

    if (arr[i3 + 1] > testTop) continue;              // still well above everything
    /* No landing once the snow has stopped: those flakes are on their way out
       (opacity → 0) and must not quietly keep building new mounds. */
    if (!snowing) continue;
    _local.set(arr[i3], arr[i3 + 1], arr[i3 + 2]).applyMatrix4(_isleInv);
    const lx = _local.x, ly = _local.y, lz = _local.z;
    let landed = false;

    if (overSzopka(lx, lz)){
      /* Over the building. Land on the highest flat roof whose plan contains
         this column, at that roof's own height. Domes, spires and the helmet
         are not in ROOFS, so flakes over them keep vanishing. */
      const r = roofUnder(lx, lz - SZ_Z);
      if (r && ly <= r.islandY + 0.03){
        addMound(lx, r.islandY, lz, r);
        landed = true;
      }
    } else if (ly <= rockLanding && overRockTop(lx, lz, 0)){
      /* On the rock. A flake within 0.5 of the rim does not settle — it just
         carries on past the edge. Nor does one land inside a stall, the cart
         or under the Christmas tree, nor on the Lajkonik. */
      if (overRockTop(lx, lz, 0.5)
          && !inMarketObject(lx, lz, 0.5)          // keep clear of the stalls
          && Math.hypot(lx - lajkonik.position.x, lz - lajkonik.position.z) > 0.6){
        addMound(lx, ROCK_LAND_Y, lz, null);
        landed = true;
      }
    }

    if (landed){
      arr[i3 + 1] = SNOW_Y1;
      const a = rnd() * TAU, r = Math.sqrt(rnd()) * SNOW_R;
      arr[i3] = Math.cos(a) * r; arr[i3 + 2] = Math.sin(a) * r;
    }
  }
  snowPoints.geometry.attributes.position.needsUpdate = true;
  updateMounds(dt);
}

/* ---------- 10c · THE ISLAND DRIFTS ---------- */
let settleFragments = 0, fragKicked = false;
const _shakeTilt = new THREE.Vector3();
const _shakeJit = new THREE.Vector3();
function updateIsland(dt){
  /* The drift is written fresh every frame, so the shake offsets added below
     can never accumulate: position and rotation are absolute, not incremental. */
  island.position.x = 0;
  island.position.z = 0;
  island.position.y = Math.sin(t * (TAU / 6.0)) * 0.12;
  island.rotation.x = Math.sin(t * (TAU / 11.0) + 0.7) * 0.0105;   // ≈0.6°
  island.rotation.z = Math.sin(t * (TAU / 8.5) + 2.1) * 0.0105;

  /* --- the shake: a damped spring layered ON TOP of that drift --- */
  _shakeTilt.set(0, 0, 0);
  _shakeJit.set(0, 0, 0);
  let bump = 0;
  if (shake.t >= 0){
    shake.t += dt;
    const k = shake.t / SHAKE_DUR;
    if (k >= 1){
      // ease to exactly zero, so there is no pop at the end
      shake.t = -1;
    } else {
      /* Gentle exponential decay so the wobble is still visibly going at ~0.6 s,
         with a raised-cosine tail that reaches exactly zero at k = 1. The
         (1 - k²) factor alone would kill it inside 0.2 s. */
      const env = Math.exp(-k * 1.9) * (1 - k * k);
      const w = TAU * 8.5;
      _shakeTilt.x = Math.sin(k * w) * env * 0.0698;          // ±4° on x
      _shakeTilt.z = Math.sin(k * w * 1.17 + 1.9) * env * 0.0698;  // ±4° on z, different phase
      _shakeJit.x = Math.sin(k * w * 0.83 + 0.6) * env * 0.15;
      _shakeJit.z = Math.cos(k * w * 1.07 + 2.4) * env * 0.15;
      bump = Math.max(0, 1 - k * 3.2) * 0.09;                 // small upward kick
    }
  }
  if (shake.cooldown > 0) shake.cooldown -= dt;
  if (shake.flash > 0){
    shake.flash -= dt;
    btnShake.classList.add('on');
    if (shake.flash <= 0) btnShake.classList.remove('on');
  }
  island.position.y += bump;
  island.position.x += _shakeJit.x;
  island.position.z += _shakeJit.z;
  island.rotation.x += _shakeTilt.x;
  island.rotation.z += _shakeTilt.z;

  // roots sway gently
  for (const r of islandRoots){
    r.rotation.z = Math.sin(t * 0.55 + r.userData.phase) * r.userData.sway;
    r.rotation.x = Math.cos(t * 0.41 + r.userData.phase) * r.userData.sway * 0.7;
  }
  /* fragments bob and tumble; a shake gives them a kick and more wobble,
     then they settle back to their usual drift */
  if (settleFragments > 0) settleFragments -= dt;
  const fragWobble = settleFragments > 0 ? 1 + settleFragments * 2.5 : 1;
  if (settleFragments > 0 && !fragKicked){
    fragKicked = true;
    for (const o of island.children){
      const u = o.userData;
      if (u && u.bob !== undefined) u.spinKick = rr(-0.9, 0.9);
    }
  }
  if (settleFragments <= 0) fragKicked = false;
  for (const o of island.children){
    const u = o.userData;
    if (u && u.bob !== undefined){
      o.position.y = u.y0 + Math.sin(t * 0.42 * fragWobble + u.phase) * u.bob * fragWobble;
      const spin = u.spin + (u.spinKick || 0);
      o.rotation.y += spin * dt;
      o.rotation.x += spin * 0.6 * dt;
    }
  }
}

/* ======================================================================
   11 · CAMERA INTRO + MAIN LOOP
   ====================================================================== */
function frameDistance(){
  // fit the whole island: y -8 → 15.6 (≈23.6 tall), and the market in front of
  // it (z out to ~6.4) needs a little more room than the old ±10 half-width
  const vFov = camera.fov * Math.PI / 180;
  const dV = (27.6 / 2) / Math.tan(vFov / 2);
  const dH = (21.5 / 2) / (Math.tan(vFov / 2) * camera.aspect);
  return Math.max(dV, dH) * 1.05;
}
function frameCamera(){
  // a little lower than before, so the market in front reads and the szopka
  // still fits above it
  camEnd.set(0, 3.2, frameDistance());
  return camEnd;
}
function resetIntro(){
  // ease in from far away and high up, so the model reveals itself
  controls.target.set(0, 3.2, 0);
  const dist = 58;
  const dir = new THREE.Vector3(0.42, 0.52, 0.74).normalize();
  camStart.copy(controls.target).addScaledVector(dir, dist);
  camStart.y = 34;
  camera.position.copy(camStart);
  state.intro = 0;
}
frameCamera();
resetIntro();
controls.maxDistance = Math.max(40, frameDistance() * 1.6);

let last = performance.now();
let hidden = false, loopRunning = false;
document.addEventListener('visibilitychange', () => {
  hidden = document.hidden;
  if (hidden) stopLoop();          // no point burning GPU on a hidden tab
  else startLoop();
});

const _introTarget = new THREE.Vector3();
function step(dt){
  t += dt;

  // --- day/night + snow cross-fade ---
  const k = 1 - Math.exp(-dt * 1.9);
  state.night = lerp(state.night, state.nightTarget, k);
  applyPhase(state.night);

  // --- camera intro: ease in from far and high ---
  if (state.intro < 1){
    state.intro = Math.min(1, state.intro + dt / introDur);
    const e = easeInOutCubic(state.intro);
    camera.position.lerpVectors(camStart, camEnd, e);
    camera.position.y += Math.sin(e * Math.PI) * 1.4;    // a little arc
    controls.target.lerp(_introTarget.set(0, 3.2, 0), 0.2);
    if (state.intro >= 1) camera.position.copy(camEnd);
  }

  // --- idle auto-rotate, paused while the user is driving ---
  controls.autoRotate = state.intro >= 1 && !inspect.on && (t - lastInteraction) > 4;
  controls.update();

  // --- scene animation ---
  updateIsland(dt);
  updateInspect(dt);
  updateHover();
  animateDragon(dt);
  updateFire(dt);
  updateFairy();
  updateSparkles(dt);
  updateFlags();
  updateTrumpeter(dt);
  updateSnow(dt);
  updatePigeons(dt);
  updateLajkonik(dt);
  updateSweep(dt);
  updateSheep(dt);
  updateFlock(dt);
  updateFlockNotes(dt);
  updateBaca(dt);
  updateLamps(dt);
  updateBombki();
  updateCaption(dt);
  updateFireworks(dt);
  updateComet(dt);
  /* the plaza string of lights twinkle on the same clock as the szopka's */
  if (plazaBulbs.length){
    const lit = plazaLampMat;
    for (const b of plazaBulbs){
      const tw = 0.45 + 0.55 * Math.pow(0.5 + 0.5 * Math.sin(t * b.rate + b.phase), 2.2);
      b.mesh.scale.setScalar(0.85 + tw * 0.3);
    }
    lit.emissiveIntensity = lerp(0.25, 2.4, state.night);
  }
  starMat.uniforms.uTime.value = t;

  composer.render();

  if (!state.started) dismissLoader();
}

/** Dismiss the loading overlay. Idempotent, and deliberately callable from
    anywhere — a full-screen overlay that outlives a stalled rAF would swallow
    every pointer event and make the whole page look frozen. */
function dismissLoader(){
  if (state.started) return;
  state.started = true;
  loaderEl.classList.add('gone');
}
setTimeout(dismissLoader, 3000);                       // failsafe
addEventListener('error', dismissLoader, { once:true });
addEventListener('unhandledrejection', dismissLoader, { once:true });

function tick(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (hidden) return;
  step(dt);
}

/* Render one frame straight away, so the szopka is on screen — and the loader
   is gone — before the browser gets round to its first requestAnimationFrame. */
step(1 / 60);
function startLoop(){ if (loopRunning) return; loopRunning = true; last = performance.now(); renderer.setAnimationLoop(tick); }
function stopLoop(){ if (!loopRunning) return; loopRunning = false; renderer.setAnimationLoop(null); }
startLoop();

/* ---------- resize ---------- */
function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio());
  renderer.setSize(w, h);
  composer.setPixelRatio(pixelRatio());
  composer.setSize(w, h);
  bloom.setSize(w, h);
  publishStackHeight();
  // widen the zoom-out limit on narrow screens, and re-frame only if the
  // visitor hasn't taken control of the camera yet
  controls.maxDistance = Math.max(40, frameDistance() * 1.6);
  if (state.intro >= 1 && lastInteraction < 0){
    frameCamera();
    camera.position.copy(camEnd);
  }
  controls.update();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 120));

/* Every vertex attribute in the scene is checked once, at startup, for NaN and
   Infinity. A single bad float does not just look wrong in that one spot — the
   bloom pass reads it, multiplies it, and smears it across the frame as a
   flickering black square. Cheap insurance: this walks a few hundred thousand
   numbers once and then never again. */
function auditGeometry(){
  const bad = [];
  const seen = new Set();
  scene.traverse(o => {
    const g = o.geometry;
    if (!g || seen.has(g.uuid)) return;
    seen.add(g.uuid);
    for (const name of Object.keys(g.attributes)){
      const a = g.attributes[name], arr = a.array;
      let n = 0;
      for (let i = 0; i < arr.length; i++) if (!Number.isFinite(arr[i])) n++;
      if (n) bad.push({ name: o.name || o.type, attr: name, itemSize: a.itemSize, bad: n,
                        total: arr.length });
    }
  });
  if (bad.length) console.warn('SZOPKA geometry audit: non-finite vertex data', bad);
  else console.info('SZOPKA geometry audit: all', seen.size, 'geometries finite');
  return bad;
}
/* ======================================================================
   ONE DRAW CALL PER MATERIAL
   The stalls, the cart, the tree, the facade and the four characters were
   all authored as dozens of little meshes, one per part. That is comfortable
   to write and expensive to draw: every mesh is a draw call, and every mesh
   that casts a shadow is drawn a second time in the shadow pass.

   So once the model is built they are collapsed, group by group: for each
   group, its own direct mesh children are bucketed by material, baked into
   the group's local frame and merged into one geometry per material. Working
   one group at a time is what makes this safe — a merged mesh always stays
   inside the group that owned it, so every animated pivot chain above it is
   untouched. The dragon's neck still hinges, the Lajkonik's hat still tips,
   the flag cloth still ripples.

   Deliberately left alone:
     · InstancedMesh — already one call, matrices rewritten every frame
     · Sprite        — billboards, never merged
     · the snow caps — snowCaps[] toggles their visibility
     · the tower flag cloths — waveFlag() rewrites their vertices each frame
     · vertex-coloured or multi-material meshes — mergeGeos drops the extras
   A mesh that the mouse picks is not lost either: it is folded into the
   merged mesh that absorbed it, and the pick lists are rebuilt around it.
   ====================================================================== */
function _keepSubtree(obj, set){
  if (!obj) return;
  set.add(obj);
  for (const c of obj.children) _keepSubtree(c, set);
}
/** Built from the live objects, so nothing animated can be merged away by
    accident: the snow caps toggle their own visibility and the flag cloths
    have their vertices rewritten. */
function staticMergeKeep(){
  const s = new Set();
  for (const m of snowCaps) _keepSubtree(m, s);
  for (const tw of [leftTower, rightTower])
    if (tw && tw.userData && tw.userData.flag) _keepSubtree(tw.userData.flag, s);
  if (typeof sparkleMesh !== 'undefined' && sparkleMesh) _keepSubtree(sparkleMesh, s);
  return s;
}
function collapseGroup(g, keep, absorbed){
  const byMat = new Map();
  const doomed = [];
  for (const c of g.children){
    // userData.dyn: the mesh has a pivot of its own or moves on its own, so it
    // stays its own mesh even inside a group of otherwise mergeable parts
    if (keep.has(c) || c.userData.dyn) continue;
    if (!(c.isMesh && !c.isInstancedMesh && !c.isSprite && c.visible
          && c.material && !Array.isArray(c.material) && !c.material.vertexColors)) continue;
    let geo = c.geometry;
    // a material with a map needs uv on every piece, or the merge drops it
    if (c.material.map && geo.attributes && !geo.attributes.uv){
      geo = geo.clone();
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(
        new Float32Array(geo.attributes.position.count * 2), 2));
    }
    let list = byMat.get(c.material);
    if (!list){ list = []; byMat.set(c.material, list); }
    list.push({ geo, matrix: c.matrix.clone(), cast: !!c.castShadow, src: c });
    doomed.push(c);
  }
  if (!doomed.length) return 0;
  for (const m of doomed) g.remove(m);
  let made = 0;
  for (const [mat, list] of byMat){
    const geo = mergeGeos(list);
    if (!geo.attributes.position || !geo.attributes.position.count) continue;
    const m = new THREE.Mesh(geo, mat);
    // only shadow-cast if every original did, so nothing gains a shadow it never had
    m.castShadow = list.every(e => e.cast);
    m.receiveShadow = true;
    m.name = 'merged';
    g.add(m);
    for (const e of list) absorbed.set(e.src, m);
    made++;
  }
  return made;
}
function collapseTree(root, keep, absorbed){
  root.updateMatrixWorld(true);
  const groups = [];
  (function collect(o){ groups.push(o); for (const c of o.children) collect(c); })(root);
  let merged = 0, into = 0;
  for (const g of groups){
    const n = collapseGroup(g, keep, absorbed);
    merged += n; into += n;
  }
  return { merged, into };
}
/** Point a pick list at whatever ended up carrying each of its meshes. */
function rebuildPickList(arr, absorbed){
  if (!arr || !arr.length) return;
  const out = [], seen = new Set();
  for (const m of arr){
    const t = absorbed.get(m) || m;
    if (t && !seen.has(t)){ seen.add(t); out.push(t); }
  }
  arr.length = 0;
  for (const m of out) arr.push(m);
}
var STATIC_MERGE_REPORT;
{
  const keep = staticMergeKeep();
  const absorbed = new Map();
  marketGroup.updateMatrixWorld(true);
  szopka.updateMatrixWorld(true);
  let merged = 0;
  for (const root of [marketGroup, szopka].concat(ROUND7_GROUPS)){
    let before = 0;
    (function count(o){ if (o.isMesh && !o.isInstancedMesh && !o.isSprite && !keep.has(o)) before++;
      for (const c of o.children) count(c); })(root);
    collapseTree(root, keep, absorbed);
    merged += before;
  }
  // the mouse still has to find the dragon, the Lajkonik, the sweep and the sheep
  for (const list of [dragonMeshes, lajkonikMeshes, sweepMeshes, SHEEP_MESHES,
                      pigeonMeshes, bacaMeshes]) rebuildPickList(list, absorbed);
  // and every sheep's own list, then rebuild the flat one the mouse raycasts
  for (const f of SHEEP_FLOCK) rebuildPickList(f.meshes, absorbed);
  FLOCK_MESHES.length = 0;
  for (let i = 1; i < SHEEP_FLOCK.length; i++)
    for (const m of SHEEP_FLOCK[i].meshes) FLOCK_MESHES.push(m);
  STATIC_MERGE_REPORT = { mergedInto: merged, groups: absorbed.size };
}

window.SZOPKA = {

  get marketHit(){ return marketHit; },
