<body>

<div id="stage"></div>

<div id="ui">
  <div class="title">
    <h1>Szop<em>k</em>a</h1>
    <p id="subtitle">A Kraków folk-art tradition, built in code</p>
    <div class="rule"></div>
  </div>

  <div class="caption" id="caption">No SMS required.</div>

  <div id="helpBox" role="tooltip"></div>

  <div class="stack" id="stack">
  <div class="hint" id="hint">Drag to rotate · Scroll to zoom · Click the dragon · Double-click to shake</div>

  <div class="bar">
    <button class="pill on" id="btnPhase" aria-pressed="true">
      <span class="dot"></span><span id="phaseLabel">Night</span>
    </button>
    <button class="pill" id="btnSnow" aria-pressed="false">
      <span class="dot"></span><span><span id="snowLabel">Snow</span> <span class="k" id="snowState">off</span></span>
    </button>
    <button class="pill" id="btnShake">
      <span class="dot"></span><span id="shakeLabel">Shake</span> <span class="k">S</span>
    </button>
    <button class="pill" id="btnSound" aria-pressed="false">
      <span class="dot"></span><span><span id="soundLabel">Sound</span> <span class="k" id="soundState">off</span></span>
    </button>
    <button class="pill icon" id="btnHelp" aria-expanded="false" aria-controls="helpBox" title="?">?</button>
    <button class="pill icon" id="btnLang" title="PL / EN">PL</button>
  </div>

  <div class="credits" id="credits"></div>
  </div>
</div>

<div id="loader">
  <div class="ring"></div>
  <span id="loaderText">Folding the foil</span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ======================================================================
   1 · SETUP
   ====================================================================== */
const stage = document.getElementById('stage');

/* One budget, read once. A phone-sized window or a very dense display gets
   half the particles and a lower pixel ratio; a desktop gets the lot. */
const SMALL_SCREEN = innerWidth < 768;
const HIGH_DPR = (window.devicePixelRatio || 1) > 2;
const LOW_POWER = SMALL_SCREEN || HIGH_DPR;
const PARTICLE_SCALE = LOW_POWER ? 0.5 : 1;
function pixelRatio(){
  return Math.min(window.devicePixelRatio || 1, LOW_POWER ? 1.5 : 2);
}

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(pixelRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // applied by OutputPass at the end
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.5, 400);

/* Lighting — exactly one shadow-casting light (the sun / the moon). */
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.position.set(13, 17, 13);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 80;
/* The island spans y ≈ -9.2 → 15.6, x ±9.7, z ±7.8. Projected into light space
   that needs ~±9.8 across and ~±16.3 up, so the ortho box gets a little
   margin — otherwise shadows clip from some directions. */
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 18;   sun.shadow.camera.bottom = -18;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.028;
sun.shadow.radius = 3.2;
sun.target.position.set(0, 4, 0);
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0xcfe2ff, 0x2a1c14, 0.55);
scene.add(hemi);

/* (the fire light inside the dragon's cave is added once the niche exists) */
let caveLight = null;

/* Environment — PMREM of RoomEnvironment: the foil needs something to reflect. */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.85;

/* Post-processing: bloom gives the glitter its bite. */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(pixelRatio());
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.72, 0.68);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* Camera controls. */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 16;
controls.maxDistance = 40;
controls.minPolarAngle = 0.35;   // allow looking almost straight down
controls.maxPolarAngle = 2.25;   // …and all the way underneath the rock
controls.autoRotate = false;
controls.autoRotateSpeed = 0.4;
controls.target.set(0, 4, 0);
controls.rotateSpeed = 0.75;
controls.zoomSpeed = 0.8;

/* Small helpers used everywhere. */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
/** always-positive modulo, so array lookups never come back undefined */
const mod = (a, n) => ((a % n) + n) % n;
const easeOutCubic  = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20240101);          // deterministic — the same szopka every visit
const rr = (a, b) => a + (b - a) * rnd();
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ======================================================================
   2 · PALETTE + PROCEDURAL TEXTURES
   Every pixel in this scene is generated here — no image files.
   ====================================================================== */
const PAL = {
  red:     0xC8102E,   // foil red
  gold:    0xE8B64A,   // foil gold — every trim, dome and crown
  emerald: 0x1E9E6A,
  cobalt:  0x2350C8,
  pink:    0xE85A9A,
  violet:  0x7B3FC4,
  silver:  0xD8DEE8,
  wood:    0x3A2418,   // pedestal only
};
/* the szopka colour cycle — neighbours never share a colour */
const CYCLE = [PAL.red, PAL.cobalt, PAL.emerald, PAL.pink, PAL.violet];
const CYCLE2 = [PAL.violet, PAL.emerald, PAL.red, PAL.cobalt, PAL.pink];

function canvas2d(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function texFromCanvas(c, { srgb = false, repeat = 1 } = {}){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---- tileable value noise -------------------------------------------- */
function vnoise(g, p, x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const x0 = ((xi % p) + p) % p, y0 = ((yi % p) + p) % p;
  const x1 = (x0 + 1) % p, y1 = (y0 + 1) % p;
  const a = g[y0 * p + x0], b = g[y0 * p + x1], c = g[y1 * p + x0], d = g[y1 * p + x1];
  const top = a + (b - a) * u, bot = c + (d - c) * u;
  return top + (bot - top) * v;
}

/**
 * The single most important texture in the scene: a seamless, crinkled
 * "crumpled foil" normal map. Layered value noise for the wrinkles, plus a
 * coarse grid of randomly tilted facets for the hard creases real foil makes.
 * Applied with normalScale ~0.6 so every panel glints unevenly.
 */
function makeFoilNormalCanvas(size = 512, bump = 9){
  const h = new Float32Array(size * size);
  const cells = 16;                                  // facet grid
  const fx = new Float32Array(cells * cells);
  const fy = new Float32Array(cells * cells);
  const fo = new Float32Array(cells * cells);
  for (let i = 0; i < cells * cells; i++){ fx[i] = rnd() * 2 - 1; fy[i] = rnd() * 2 - 1; fo[i] = rnd() * 2 - 1; }

  const oct = [];
  for (let o = 0; o < 6; o++){
    const p = 4 << o, g = new Float32Array(p * p);
    for (let i = 0; i < p * p; i++) g[i] = rnd();
    oct.push({ p, g, a: 0.42 / (o + 1) });
  }
  // low-frequency warp lattice, so the facet grid never lines up with itself
  const wp = 8, wg = new Float32Array(wp * wp);
  for (let i = 0; i < wp * wp; i++) wg[i] = rnd();

  for (let y = 0; y < size; y++){
    for (let x = 0; x < size; x++){
      const u = x / size, v = y / size;
      let hv = 0;                                    // the soft wrinkles
      for (const o of oct) hv += o.a * vnoise(o.g, o.p, u * o.p, v * o.p);
      // domain-warp the facet lookup so the creases stay irregular
      const wu = u + (vnoise(wg, wp, u * wp, v * wp) - 0.5) * 0.26;
      const wv = v + (vnoise(wg, wp, u * wp + 3.7, v * wp + 1.3) - 0.5) * 0.26;
      const cx = ((Math.floor(wu * cells) % cells) + cells) % cells;
      const cy = ((Math.floor(wv * cells) % cells) + cells) % cells;
      const ci = cy * cells + cx;
      const du = wu - (cx + 0.5) / cells, dv = wv - (cy + 0.5) / cells;
      h[y * size + x] = hv * 0.75 + (fx[ci] * du + fy[ci] * dv + fo[ci]) * 0.42;
    }
  }

  const [cv, cx2] = canvas2d(size, size);
  const img = cx2.createImageData(size, size);
  const at = (x, y) => h[(((y % size) + size) % size) * size + (((x % size) + size) % size)];
  for (let y = 0; y < size; y++){
    for (let x = 0; x < size; x++){
      const dx = (at(x + 1, y) - at(x - 1, y)) * bump;
      const dy = (at(x, y + 1) - at(x, y - 1)) * bump;
      const inv = 1 / Math.sqrt(dx * dx + dy * dy + 1);
      const i = (y * size + x) * 4;
      img.data[i]     = (-dx * inv * 0.5 + 0.5) * 255;
      img.data[i + 1] = (-dy * inv * 0.5 + 0.5) * 255;
      img.data[i + 2] = (inv * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  cx2.putImageData(img, 0, 0);
  return cv;
}

/* ---- sprite textures --------------------------------------------------- */
function softDotCanvas(size = 128, core = 0.0){
  const [c, x] = canvas2d(size, size);
  const g = x.createRadialGradient(size / 2, size / 2, size * core, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  return c;
}
function starCanvas(size = 128){
  const [c, x] = canvas2d(size, size);
  const m = size / 2;
  const g = x.createRadialGradient(m, m, 0, m, m, m * 0.42);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.beginPath(); x.arc(m, m, m * 0.42, 0, TAU); x.fill();
  // four-point cross flare
  x.save(); x.translate(m, m); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++){
    x.rotate(Math.PI / 2);
    const lg = x.createLinearGradient(0, 0, 0, -m);
    lg.addColorStop(0, 'rgba(255,255,255,0.95)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = lg;
    x.beginPath(); x.moveTo(-size * 0.035, 0); x.lineTo(0, -m); x.lineTo(size * 0.035, 0); x.closePath(); x.fill();
  }
  x.restore();
  return c;
}
function noteCanvas(size = 128){                 // a tiny hand-drawn ™
  const [c, x] = canvas2d(size, size);
  x.translate(size * 0.5, size * 0.5);
  x.fillStyle = '#fff';
  x.beginPath(); x.ellipse(-size * 0.06, size * 0.28, size * 0.15, size * 0.11, -0.35, 0, TAU); x.fill();
  x.fillRect(size * 0.055, -size * 0.34, size * 0.045, size * 0.62);
  x.beginPath();
  x.moveTo(size * 0.10, -size * 0.34);
  x.quadraticCurveTo(size * 0.30, -size * 0.22, size * 0.20, -size * 0.04);
  x.quadraticCurveTo(size * 0.24, -size * 0.20, size * 0.10, -size * 0.20);
  x.closePath(); x.fill();
  return c;
}
function rosetteCanvas(size = 128){              // stamped star rosette, used as a map
  const [c, x] = canvas2d(size, size);
  const m = size / 2;
  x.fillStyle = '#ffffff'; x.beginPath(); x.arc(m, m, m * 0.98, 0, TAU); x.fill();
  x.strokeStyle = 'rgba(0,0,0,0.35)'; x.lineWidth = size * 0.03;
  x.beginPath(); x.arc(m, m, m * 0.86, 0, TAU); x.stroke();
  x.fillStyle = 'rgba(0,0,0,0.28)';
  x.beginPath();
  for (let i = 0; i < 16; i++){
    const a = (i / 16) * TAU, r = i % 2 ? m * 0.30 : m * 0.72;
    const px = m + Math.cos(a) * r, py = m + Math.sin(a) * r;
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  }
  x.closePath(); x.fill();
  x.fillStyle = 'rgba(255,255,255,0.55)';
  x.beginPath(); x.arc(m, m, m * 0.18, 0, TAU); x.fill();
  return c;
}

const foilNormalTex = texFromCanvas(makeFoilNormalCanvas(512, 9));
const dotTex   = new THREE.CanvasTexture(softDotCanvas(128, 0.0));
const fireTex  = new THREE.CanvasTexture(softDotCanvas(128, 0.22));
const starTex  = new THREE.CanvasTexture(starCanvas(128));
const noteTex  = new THREE.CanvasTexture(noteCanvas(128));
const rosetteTex = texFromCanvas(rosetteCanvas(128), { srgb:true });
dotTex.colorSpace = fireTex.colorSpace = starTex.colorSpace = noteTex.colorSpace = THREE.SRGBColorSpace;

/* ======================================================================
   3 · MATERIALS
   Foil = metal, cardboard = matte, windows = emissive stained panes.
   ====================================================================== */
const matCache = new Map();
const foil = (color, rough = 0.28) => {
  const key = `foil${color}${rough}`;
  if (!matCache.has(key)){
    matCache.set(key, new THREE.MeshStandardMaterial({
      color, metalness: 0.94, roughness: rough,
      normalMap: foilNormalTex, normalScale: new THREE.Vector2(0.6, 0.6),
      envMapIntensity: 1.0,
    }));
  }
  return matCache.get(key);
};
const goldFoil = () => foil(PAL.gold, 0.26);

const cardboard = (color = 0x2a2118) => {
  const key = `card${color}`;
  if (!matCache.has(key)){
    matCache.set(key, new THREE.MeshStandardMaterial({
      color, roughness: 0.9, metalness: 0,
      normalMap: foilNormalTex, normalScale: new THREE.Vector2(0.22, 0.22),
    }));
  }
  return matCache.get(key);
};

/* stained-foil window panes: faint by day, alight at night */
const glowMats = [];
function stained(color){
  const key = `glow${color}`;
  if (!matCache.has(key)){
    const m = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color).multiplyScalar(0.30),
      emissive: new THREE.Color(color), emissiveIntensity: 0.25,
      metalness: 0.15, roughness: 0.34,
      normalMap: foilNormalTex, normalScale: new THREE.Vector2(0.35, 0.35),
    });
    // gold is far brighter than the rest of the palette — ease it back so the
    // bloom doesn't turn those panes into white blobs
    m.userData.glowScale = color === PAL.gold ? 0.5 : 1;
    glowMats.push(m);
    matCache.set(key, m);
  }
  return matCache.get(key);
}

/* generic white foil used by the instanced decoration batches; colour comes
   from instanceColor, so hundreds of studs cost one draw call. */
const foilWhite = new THREE.MeshStandardMaterial({
  color: 0xffffff, metalness: 0.92, roughness: 0.29,
  normalMap: foilNormalTex, normalScale: new THREE.Vector2(0.6, 0.6),
  envMapIntensity: 1.0,
});

const darkRock = new THREE.MeshStandardMaterial({
  color: 0x2C3328, roughness: 0.95, metalness: 0.05, flatShading: true,
});
/* The cave vault is only ever seen from the inside → back faces only.
   Near-black, but the foil normal map stays: it is the cave's stone relief,
   and under the cave light it catches just enough to read as rock. */
const caveShell = new THREE.MeshStandardMaterial({
  color: 0x16181A, roughness: 0.95, metalness: 0, side: THREE.BackSide,
  normalMap: foilNormalTex, normalScale: new THREE.Vector2(0.55, 0.55),
});

/* ======================================================================
   4 · BUILDERS  (reusable pieces the whole szopka is assembled from)
   ====================================================================== */

/* Re-aim UVs so the foil normal map tiles in world space on any geometry.
   FOIL_UV is roughly "one texture repeat per 3.4 world units", which puts the
   crinkle at a believable hand-pressed-foil scale rather than brickwork. */
const FOIL_UV = 0.3;
function worldUV(geo, scale = FOIL_UV){
  if (!geo.attributes.uv) return geo;
  const pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++){
    const nx = Math.abs(nor.getX(i)), ny = Math.abs(nor.getY(i)), nz = Math.abs(nor.getZ(i));
    let u, v;
    if (nx >= ny && nx >= nz){ u = pos.getZ(i); v = pos.getY(i); }
    else if (ny >= nz)        { u = pos.getX(i); v = pos.getZ(i); }
    else                      { u = pos.getX(i); v = pos.getY(i); }
    uv.setXY(i, u * scale, v * scale);
  }
  uv.needsUpdate = true;
  return geo;
}

const boxGeo = (w, h, d) => worldUV(new THREE.BoxGeometry(w, h, d));
/** A UV'd sphere, for the market's small round bits (beads, bulbs, baubles). */
const ballGeo = (r, w = 10, h = 8) => worldUV(new THREE.SphereGeometry(r, w, h));

/** A foil panel — the basic wall module. */
function makePanel(w, h, d, color, rough){
  const m = new THREE.Mesh(boxGeo(w, h, d), foil(color, rough));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/** Rounded arch outline: straight jambs topped by a semicircle. */
function archShape(w, h, r = null){
  const rad = r === null ? w / 2 : r;
  const s = new THREE.Shape();
  const hw = w / 2, straight = h - rad;
  s.moveTo(-hw, 0);
  s.lineTo(-hw, straight);
  s.absarc(0, straight, hw, Math.PI, 0, true);
  s.lineTo(hw, 0);
  s.closePath();
  return s;
}

/** Tiny standalone pinnacle (a single-object version, for special cases). */
function makePinnacle(h = 0.5, r = 0.075, color = PAL.gold){
  const g = new THREE.Group();
  const base = new THREE.Mesh(boxGeo(r * 2.1, h * 0.2, r * 2.1), goldFoil());
  base.position.y = h * 0.1; base.castShadow = true;
  const stem = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(r * 0.62, r * 0.82, h * 0.55, 8)), foil(color, 0.3));
  stem.position.y = h * 0.2 + h * 0.275; stem.castShadow = true;
  const tip = new THREE.Mesh(worldUV(new THREE.ConeGeometry(r * 0.7, h * 0.32, 8)), goldFoil());
  tip.position.y = h * 0.75 + h * 0.16; tip.castShadow = true;
  g.add(base, stem, tip);
  return g;
}

/** Onion dome (Russian/Renaissance helmet) as a LatheGeometry. */
function makeOnionDome(r = 1, h = 1.5, color = PAL.gold, seg = 20){
  const pts = [];
  const N = 22;
  for (let i = 0; i <= N; i++){
    const t = i / N;
    // bulges out low, pinches to a point, with a small collar at the top
    let rr2 = r * Math.sin(Math.PI * Math.pow(t, 0.72)) * (1 + 0.16 * Math.sin(Math.PI * t));
    if (t > 0.86) rr2 *= 1 - 0.35 * (t - 0.86) / 0.14;
    pts.push(new THREE.Vector2(Math.max(0.0008, rr2), t * h));
  }
  const g = worldUV(new THREE.LatheGeometry(pts, seg));
  const m = new THREE.Mesh(g, foil(color, 0.27));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/** Tall gothic spire as a LatheGeometry (octagonal when seg = 8). */
function makeSpire(r = 0.62, h = 3.2, color = PAL.cobalt, seg = 8){
  const pts = [];
  const N = 16;
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const rr2 = r * Math.pow(1 - t, 0.72) * (1 - 0.06 * Math.sin(Math.PI * t));
    pts.push(new THREE.Vector2(Math.max(0.0008, rr2), t * h));
  }
  const g = worldUV(new THREE.LatheGeometry(pts, seg));
  const m = new THREE.Mesh(g, foil(color, 0.29));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/** Gold ball + spike finial. */
function makeFinial(ballR = 0.14, spikeH = 0.5){
  const g = new THREE.Group();
  const b = new THREE.Mesh(worldUV(new THREE.SphereGeometry(ballR, 14, 10)), goldFoil());
  b.castShadow = true;
  const s = new THREE.Mesh(worldUV(new THREE.ConeGeometry(ballR * 0.55, spikeH, 10)), goldFoil());
  s.position.y = ballR + spikeH / 2; s.castShadow = true;
  g.add(b, s);
  return g;
}

/** A star finial (no crosses, no religious figures). */
function makeStar(r = 0.2, arms = 5){
  const shape = new THREE.Shape();
  for (let i = 0; i < arms * 2; i++){
    const a = (i / (arms * 2)) * TAU - Math.PI / 2;
    const rad = i % 2 ? r * 0.42 : r;
    const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
    i ? shape.lineTo(x, y) : shape.moveTo(x, y);
  }
  shape.closePath();
  const g = worldUV(new THREE.ExtrudeGeometry(shape, { depth: r * 0.28, bevelEnabled:true, bevelSize:r*0.08, bevelThickness:r*0.08, bevelSegments:1 }));
  g.translate(0, 0, -r * 0.14);
  const m = new THREE.Mesh(g, foil(PAL.gold, 0.24));
  m.castShadow = true;
  return m;
}

/** Flat rosette disc with a stamped star, sits proud of a facade. */
function makeRosette(r = 0.22, color = PAL.gold){
  const geo = worldUV(new THREE.CircleGeometry(r, 18));
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color, map: rosetteTex, metalness: 0.9, roughness: 0.3,
    normalMap: foilNormalTex, normalScale: new THREE.Vector2(0.4, 0.4),
  }));
  return m;
}

/** Pennant flag on a short staff, with a gentle sway pivot. */
function makeFlag(w = 0.5, h = 0.34, color = PAL.red, poleH = 0.42){
  const g = new THREE.Group();
  const pole = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(0.018, 0.022, poleH, 6)), goldFoil());
  pole.position.y = poleH / 2; pole.castShadow = true;
  g.add(pole);

  const pivot = new THREE.Group();
  pivot.position.y = poleH - 0.03;
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(w, h * 0.16); shape.lineTo(0, h * 0.32); shape.closePath();
  const fg = worldUV(new THREE.ExtrudeGeometry(shape, { depth: 0.02, bevelEnabled:false }));
  const flag = new THREE.Mesh(fg, new THREE.MeshStandardMaterial({
    color, metalness: 0.55, roughness: 0.42, side: THREE.DoubleSide,
  }));
  flag.position.y = -h * 0.16;
  pivot.add(flag);
  g.add(pivot);
  g.userData.pivot = pivot;
  return g;
}

/** Rectangular two-stripe flag on a short staff — the Polish and Kraków
    banners. The cloth is a subdivided plane whose vertices ride a travelling
    wave, strongest at the free edge and pinned to zero at the pole. */
function makeRectFlag(w = 0.9, h = 0.56, topColor = 0xF4F4F4, bottomColor = 0xD4213D, poleH = 0.9){
  const g = new THREE.Group();

  const pole = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(0.02, 0.024, poleH, 8)), goldFoil());
  pole.position.y = poleH / 2; pole.castShadow = true;
  g.add(pole);
  // gold ball on top of the pole
  const ball = new THREE.Mesh(worldUV(new THREE.SphereGeometry(0.055, 12, 10)), goldFoil());
  ball.position.y = poleH + 0.04; ball.castShadow = true;
  g.add(ball);

  const pivot = new THREE.Group();
  pivot.position.y = poleH - 0.06;
  g.add(pivot);

  /* Two half-cloths rather than one plane with two vertex colours: sharing
     the middle row would interpolate white→red across a whole row and the
     "stripes" would read as a gradient. Split here, the seam is crisp. */
  const half = h / 2;
  const cloth = new THREE.Group();
  for (const [col, yc] of [[topColor, -h / 4], [bottomColor, -h * 3 / 4]]){
    const geo = new THREE.PlaneGeometry(w, half, 12, 2);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: col, roughness: 0.7, metalness: 0, side: THREE.DoubleSide,
    }));
    m.position.set(w / 2, yc, 0);          // hoist edge at the pivot
    m.castShadow = true;
    cloth.add(m);
  }
  pivot.add(cloth);

  g.userData.pivot = pivot;
  g.userData.cloth = cloth;
  g.userData.w = w;
  // remember each half's rest shape so the wave can be re-applied from scratch
  g.userData.parts = cloth.children.map(m => ({
    mesh: m,
    base: Float32Array.from(m.geometry.attributes.position.array),
  }));
  return g;
}

/** One travelling wave along a makeRectFlag cloth, stronger at the free edge
    and pinned to zero at the pole. */
function waveFlag(flag, time, boost = 1){
  const w = flag.userData.w;
  for (const { mesh, base } of flag.userData.parts){
    const pos = mesh.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++){
      const x = base[i * 3];
      const u = x / w;                                  // 0 at the pole, 1 at the free edge
      const amp = 0.16 * u * u * boost;
      pos.setZ(i, base[i * 3 + 2]
        + Math.sin(time * 3.1 + u * 5.6) * amp
        + Math.sin(time * 2.0 + u * 3.1 + 1.1) * amp * 0.5);
    }
    pos.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
  }
}

/* ======================================================================
   4b · INSTANCING BATCH
   Everything repeated (windows, merlons, pinnacles, studs, bulbs, snow)
   is collected here and flushed into a handful of InstancedMeshes, so the
   whole szopka costs only a few dozen draw calls.
   ====================================================================== */
const BATCH = new Map();   // key -> { geo, mat, matrices:[], colors:[]|null, shadow }

function batchAdd(key, geo, mat, matrix, color = null, shadow = true){
  let b = BATCH.get(key);
  if (!b){
    b = { geo, mat, matrices: [], colors: color === null ? null : [], shadow };
    BATCH.set(key, b);
  }
  b.matrices.push(matrix.clone());
  if (b.colors) b.colors.push(new THREE.Color(color));
}

/** Place a repeated piece: a position, a Y rotation and a uniform scale. */
const _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
function xform(x, y, z, rotY = 0, sx = 1, sy = sx, sz = sx, rotX = 0, rotZ = 0){
  _p.set(x, y, z);
  _q.setFromEuler(new THREE.Euler(rotX, rotY, rotZ, 'YXZ'));
  _s.set(sx, sy, sz);
  return new THREE.Matrix4().compose(_p, _q, _s);
}
function batchFlush(parent){
  const out = [];
  for (const [key, b] of BATCH){
    const n = b.matrices.length;
    if (!n) continue;
    const im = new THREE.InstancedMesh(b.geo, b.mat, n);
    for (let i = 0; i < n; i++){
      im.setMatrixAt(i, b.matrices[i]);
      if (b.colors) im.setColorAt(i, b.colors[i]);
    }
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.castShadow = b.shadow; im.receiveShadow = true;
    im.frustumCulled = false;          // instances are spread across the model
    im.name = 'batch:' + key;
    parent.add(im);
    out.push(im);
  }
  BATCH.clear();
  return out;
}

/* --- batched arch window: ring extrudes OUTWARD from the wall face --- */
const winGeos = new Map();
function archWindowGeo(w, h){
  const key = `${w.toFixed(3)}_${h.toFixed(3)}`;
  if (winGeos.has(key)) return winGeos.get(key);
  const th = Math.min(0.085, w * 0.1);
  const D = 0.16;                                        // how far the ring stands proud
  const outer = archShape(w + th * 2, h + th, w / 2 + th);
  outer.holes.push(new THREE.Path(archShape(w, h, w / 2).getPoints(26)));
  const ring = worldUV(new THREE.ExtrudeGeometry(outer, {
    depth: D, bevelEnabled: true, bevelSize: 0.013, bevelThickness: 0.013, bevelSegments: 1, curveSegments: 9,
  }));
  // the pane sits just inside the ring's mouth, the dark reveal behind it
  const pane = worldUV(new THREE.ShapeGeometry(archShape(w, h, w / 2), 12));
  const reveal = worldUV(new THREE.ShapeGeometry(archShape(w + 0.03, h + 0.03, w / 2 + 0.015), 12));
  const mull = new THREE.BoxGeometry(Math.max(0.022, w * 0.05), h * 0.6, 0.05);
  mull.translate(0, h * 0.4, 0);
  const g = { ring, pane, reveal, mull, D };
  winGeos.set(key, g);
  return g;
}
/** Queue an arched stained-foil window whose base sits at local (0,0,0). */
function addWindow(w, h, color, matrix, mullion = true){
  const g = archWindowGeo(w, h);
  const at = (d) => matrix.clone().multiply(new THREE.Matrix4().makeTranslation(0, 0, d));
  // +Z is outward, so the reveal sits deepest, then the pane, then the mullion
  batchAdd(`w:ring:${w}:${h}`, g.ring, goldFoil(), matrix, null, true);
  batchAdd(`w:rev:${w}:${h}`,  g.reveal, cardboard(0x150f0a), at(g.D - 0.075), null, false);
  batchAdd(`w:pane:${w}:${h}:${color}`, g.pane, stained(color), at(g.D - 0.022), null, false);
  if (mullion) batchAdd(`w:mull:${w}:${h}`, g.mull, goldFoil(), at(g.D - 0.004), null, false);
}

/* --- batched merlon / pinnacle geometries (single gold instanced mesh) --- */
const merlonGeoCache = new Map();
function merlonGeo(w = 0.34, h = 0.3, d = 0.15){
  const key = `${w}${h}${d}`;
  if (merlonGeoCache.has(key)) return merlonGeoCache.get(key);
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, h - w / 2);
  s.absarc(0, h - w / 2, w / 2, 0, Math.PI, false);
  s.lineTo(-w / 2, 0);
  const g = worldUV(new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.012, bevelSegments: 1, curveSegments: 7 }));
  g.translate(0, 0, -d / 2);
  merlonGeoCache.set(key, g);
  return g;
}
const pinGeoCache = new Map();
function pinGeo(h = 0.62, r = 0.07){
  const key = `${h}${r}`;
  if (pinGeoCache.has(key)) return pinGeoCache.get(key);
  const p = [];
  const prof = [[1.5, 0], [1.5, 0.10], [1.05, 0.15], [0.85, 0.22], [0.80, 0.58], [1.10, 0.63], [0.55, 0.70], [0.0, 1.0]];
  for (const [rr2, yy] of prof) p.push(new THREE.Vector2(Math.max(0.0015, r * rr2), yy * h));
  const g = worldUV(new THREE.LatheGeometry(p, 8));
  pinGeoCache.set(key, g);
  return g;
}

/**
 * A cloister crenellation row of gold merlons + pinnacles.
 * Each side is an explicit run in face-local `u` coordinates, so the row can be
 * broken where the towers rise through the parapet — nothing ever intersects.
 */
function addCrenellationRow(runs, y, { step = 0.44, merlonColor = PAL.gold, pinColor = PAL.gold, mh = 0.3, ph = 0.62, pr = 0.07 } = {}){
  const mg = merlonGeo(0.34, mh, 0.15);
  const pg = pinGeo(ph, pr);
  // Both geometries are rebuilt from mh/ph per call, so the keys must carry
  // them: BATCH stores exactly one geometry per key and silently drops
  // every later one.
  const mKey = `merlon:${mh.toFixed(2)}`, pKey = `pin:${ph.toFixed(2)}`;
  for (const run of runs){
    const { len, fixed, rot, from = -len / 2, to = len / 2 } = run;
    const c = Math.cos(rot), sn = Math.sin(rot);
    const n = Math.max(2, Math.round((to - from) / step));
    for (let i = 0; i < n; i++){
      const u = from + (i + 0.5) * ((to - from) / n);
      const x = u * c + fixed * sn, z = -u * sn + fixed * c;
      batchAdd(mKey, mg, foil(merlonColor, 0.27), xform(x, y, z, rot), null, true);
      if (i % 2 === 0 && ph > 0){
        batchAdd(pKey, pg, foil(pinColor, 0.27), xform(x, y + mh, z, rot), null, true);
      }
    }
  }
}

/* --- batched facade studs (diamonds & checkers) -------------------------
   Authored as flat shapes in the XY plane, thickness along +Z, so a stud is
   simply the face matrix with a small push along the face normal.        */
function flatShapeGeo(pts, depth, bevel){
  const s = new THREE.Shape();
  pts.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]));
  s.closePath();
  const g = worldUV(new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelSize: bevel, bevelThickness: bevel * 0.9, bevelSegments: 1 }));
  g.translate(0, 0, -depth / 2);          // centre on its own thickness
  return g;
}
const studDiamond = flatShapeGeo([[0, 1], [0.78, 0], [0, -1], [-0.78, 0]], 0.16, 0.06);
const studSquare  = flatShapeGeo([[-1, -1], [1, -1], [1, 1], [-1, 1]], 0.16, 0.05);

/** Queue a diamond (or square) stud of size `s` on a wall face. */
function addStud(face, u, v, color, s = 0.15, square = false, out = 0.035){
  const c = Math.cos(face.rotY), sn = Math.sin(face.rotY);
  const px = face.x + u * c + out * sn, pz = face.z - u * sn + out * c;
  batchAdd(square ? 'stud:sq' : 'stud:dia', square ? studSquare : studDiamond,
           foilWhite, xform(px, v, pz, face.rotY, s, s, s), color, false);
}

/** Queue a flat rosette disc on a wall face. */
const rosetteGeo = worldUV(new THREE.CircleGeometry(1, 20));
const rosetteMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, map: rosetteTex, metalness: 0.9, roughness: 0.3,
  normalMap: foilNormalTex, normalScale: new THREE.Vector2(0.4, 0.4),
});
function addRosette(face, u, v, r = 0.22, color = PAL.gold, out = 0.03){
  const c = Math.cos(face.rotY), sn = Math.sin(face.rotY);
  const px = face.x + u * c + out * sn, pz = face.z - u * sn + out * c;
  batchAdd('rosette', rosetteGeo, rosetteMat, xform(px, v, pz, face.rotY, r, r, r), color, false);
}

/**
 * A bay panel: the coloured foil sheet that covers one vertical bay of a wall.
 * This is what gives a szopka its alternating-colour rhythm — neighbours are
 * forced to differ, and the panel is offset a hair proud of the wall.
 */
const bayPanelGeoCache = new Map();
function bayPanelGeo(w, h){
  const key = `${w.toFixed(2)}x${h.toFixed(2)}`;
  if (bayPanelGeoCache.has(key)) return bayPanelGeoCache.get(key);
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, h); s.lineTo(-w / 2, h); s.closePath();
  const g = worldUV(new THREE.ExtrudeGeometry(s, {
    depth: 0.05, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.024, bevelSegments: 1,
  }));
  bayPanelGeoCache.set(key, g);
  return g;
}
function addBayPanel(face, u, v, w, h, color, out = 0.012){
  const geo = bayPanelGeo(w, h);
  const c = Math.cos(face.rotY), sn = Math.sin(face.rotY);
  const px = face.x + u * c + out * sn, pz = face.z - u * sn + out * c;
  // The key MUST carry the size: BATCH stores one geometry per key, so a shared
  // 'baypanel' would render every panel at the first panel's dimensions and
  // make neighbouring panels overlap (and z-fight) on the side faces.
  batchAdd(`baypanel:${w.toFixed(2)}x${h.toFixed(2)}`, geo, foilWhite,
           xform(px, v, pz, face.rotY), color, false);
}

/**
 * A wall face descriptor. Local +Z is the OUTWARD normal and local +X runs
 * along the wall, so any decoration can be placed with (u, v, out) and it
 * always sits proud of the wall, whichever side it is on.
 */
const faceFront = (z, x = 0) => ({ x, z, rotY: 0 });
const faceBack  = (z, x = 0) => ({ x, z, rotY: Math.PI });
const faceRight = (x, z = 0) => ({ x, z, rotY:  Math.PI / 2 });
const faceLeft  = (x, z = 0) => ({ x, z, rotY: -Math.PI / 2 });

/** Place a batched window on a wall face (base of the arch at height v). */
function addWindowOn(face, u, v, w, h, color, mullion = true){
  addWindow(w, h, color, faceOut(face, u, v, 0), mullion);
}

/** Push a local (u, out) offset from a face origin out along its normal. */
function faceOut(face, u, v, out){
  const c = Math.cos(face.rotY), sn = Math.sin(face.rotY);
  return xform(face.x + u * c + out * sn, v, face.z - u * sn + out * c, face.rotY);
}

/* ======================================================================
   5 · SZOPKA ASSEMBLY
   Heights: pedestal 0→0.8 · ground tier 0.8→4.8 · parapet →5.6
            middle tier 5.6→8.6 · dome →12.4 · left tower →15.5
   ====================================================================== */
const szopka = new THREE.Group();
scene.add(szopka);

/* ---------- 0 · THE FLOATING ROCK ISLAND ----------
   A raw chunk of stone torn out of the ground. Everything — rock, roots,
   drifting fragments AND the szopka itself — is parented to one `island`
   group so the whole thing floats as a single body. */
const PED_R = 6.0, PED_H = 0.8;
const ISLE_RX = 9.5, ISLE_RZ = 7.5;         // footprint: ~19 × 15
const ISLE_DEPTH = 10;                      // tip lands near y = -9.2

/* Tileable fbm on a lathe-ish grid: the same noise family as the foil map, so
   the rock and the foil feel like they came out of the same world. */
/* Tileable fbm, same noise family as the foil map so the rock and the foil
   feel like they came out of the same world. Lattices are grown on demand —
   `vnoise` wraps on the period, so any p works and the noise still tiles. */
const rockLattice = new Map();
function rockLatticeFor(p){
  let g = rockLattice.get(p);
  if (!g){
    g = new Float32Array(p * p);
    for (let i = 0; i < p * p; i++) g[i] = rnd();
    rockLattice.set(p, g);
  }
  return g;
}
function fbm2(u, v, oct = 4, base = 4){
  let sum = 0, amp = 1, tot = 0;
  for (let o = 0; o < oct; o++){
    const p = base << o;
    sum += amp * vnoise(rockLatticeFor(p), p, u * p, v * p);
    tot += amp;
    amp *= 0.5;
  }
  return sum / tot;
}

/** Radial profile of the island. `fy` runs 1 (top surface) → 0 (tip). */
function islandProfile(fy){
  if (fy > 0.88) return lerp(0.965, 1.0, (fy - 0.88) / 0.12);   // top slab
  if (fy > 0.72) return lerp(0.93, 0.965, smoothstep(0, 1, (fy - 0.72) / 0.16));
  if (fy > 0.42) return lerp(0.30, 0.93, Math.pow((fy - 0.42) / 0.30, 0.85));  // steep cone
  if (fy > 0.16) return lerp(0.07, 0.30, Math.pow((fy - 0.16) / 0.26, 0.75));  // spire
  return lerp(0.005, 0.07, Math.pow(fy / 0.16, 0.9));                        // needle tip
}

/* Strata colours, sampled by height: earth → stone → cool grey → dark tip. */
/* Strata, ordered from the top surface down to the tip, monotonically darker
   so the rock reads as heavy stone receding into shadow rather than a pale
   belt with dark caps. */
const STRATA = [
  new THREE.Color(0x5A4232),   // top: warm earth
  new THREE.Color(0x4A4238),   // grey-brown stone
  new THREE.Color(0x3E4048),   // deeper cool grey
  new THREE.Color(0x2A2932),   // darkest at the tip
];
const strataColor = (h, out) => {
  /* h: 1 at the top surface, 0 at the tip. Note the flip: STRATA is ordered
     top-down, so the band index is driven by 1 - h. */
  const f = clamp(1 - h, 0, 0.9999) * (STRATA.length - 1);
  const i = Math.floor(f);
  const t = f - i;
  // a soft blend, plus a wobble in the band boundary so the layers aren't
  // perfectly level — that reads as sedimentary rock, not painted stripes
  return out.copy(STRATA[i]).lerp(STRATA[i + 1], smoothstep(0.62, 1.0, t));
};

/**
 * Build the island body. A lathe-like ring mesh whose radius and height are
 * displaced by fbm, with flat shading so the facets read as carved stone.
 * The tessellation is deliberately coarse: flatShading only looks faceted when
 * the facets are big enough to catch the light differently.
 */
const ISLE_RINGS = 19, ISLE_SEGS = 26;
function buildIslandBody(){
  const RINGS = ISLE_RINGS, SEGS = ISLE_SEGS;
  const top = PED_H;                        // flat top where the szopka sits
  const positions = [], colors = [], indices = [];
  const c = new THREE.Color(), tmp = new THREE.Color();

  // the big lobes that keep the silhouette from reading as a plain cone
  const lobes = [
    { a: 0.6, w: 0.50, amt: 0.34, y: 0.58 },
    { a: 2.7, w: 0.44, amt: 0.28, y: 0.48 },
    { a: 4.6, w: 0.56, amt: 0.30, y: 0.54 },
    { a: 5.6, w: 0.38, amt: 0.22, y: 0.40 },
    { a: 1.7, w: 0.34, amt: 0.18, y: 0.30 },
  ];

  for (let ri = 0; ri <= RINGS; ri++){
    /* Non-linear: the rings cluster near the top so the lip, the moss band
       and the snow cap all have geometry to sit on, while the long smooth
       cone below stays cheap. */
    const fy = 1 - Math.pow(ri / RINGS, 1.6);   // 1 = top, 0 = tip
    for (let si = 0; si < SEGS; si++){
      const a = (si / SEGS) * TAU;
      const ca = Math.cos(a), sa = Math.sin(a);
      const u = a / TAU, v = fy;

      // --- radius: profile + organic blob, floored so the rim can never
      //     pinch inside the szopka's 10 × 5 footprint ---
      let base = islandProfile(fy);
      const rimAmt = smoothstep(0.35, 1.0, fy);
      base *= 1 + (fbm2(u, v * 0.6, 4, 3) - 0.5) * 0.26 * rimAmt
                + (fbm2(u * 2.1, v * 1.4, 3, 6) - 0.5) * 0.10;
      for (const L of lobes){
        const d = Math.abs(((a - L.a + Math.PI) % TAU + TAU) % TAU - Math.PI);
        const fall = Math.exp(-(d * d) / (2 * L.w * L.w)) * Math.exp(-Math.pow(fy - L.y, 2) / 0.045);
        base += L.amt * fall;
      }
      // the top slab must always clear the moved szopka
      const minR = Math.max(5.6 / ISLE_RX, 4.6 / ISLE_RZ) * smoothstep(0.70, 0.95, fy);
      base = Math.max(base, minR, 0.012);

      const x = ca * base * ISLE_RX;
      const z = sa * base * ISLE_RZ;

      // --- height: the top surface is exactly PED_H, the tip ~8.3 below ---
      let y;
      if (ri === 0){
        y = top;                             // perfectly flat where the szopka sits
      } else if (fy > 0.86){
        // the rim rolls over and chips downward just under the lip
        const k = (fy - 0.86) / 0.14;
        y = top - Math.pow(1 - k, 1.7) * (0.55 + fbm2(u, 0.3, 3, 5) * 0.9);
      } else {
        // heavy lumps and faceted breaks on the underside
        const lump = fbm2(u, v * 1.2, 5, 3) - 0.5;
        const jag  = fbm2(u * 3.0, v * 2.6, 3, 8) - 0.5;
        const baseY = top - (1 - fy) * ISLE_DEPTH;
        y = baseY
          + lump * 3.4 * (1 - smoothstep(0.55, 0.92, fy))
          + jag * 1.15 * (1 - smoothstep(0.78, 0.98, fy));
      }

      positions.push(x, y, z);
      // the strata follow the actual surface height, not the ideal ring index,
      // so the layers tilt and dip with the rock instead of banding level.
      // band: 1 at the top surface, 0 at the tip.
      const band = clamp((y - (top - ISLE_DEPTH * 1.02)) / (ISLE_DEPTH * 1.02), 0, 0.9999);
      const wobble = (fbm2(u * 2.2, 0.7, 3, 4) - 0.5) * 0.12;
      strataColor(clamp(band + wobble, 0, 0.9999), c);
      // per-vertex colour noise so the strata read as rock, not painted bands
      const n = (fbm2(u * 5.0, v * 4.0, 3, 8) - 0.5) * 0.07;
      tmp.copy(c).offsetHSL(n * 0.06, n * 0.10, n);
      colors.push(tmp.r, tmp.g, tmp.b);
    }
  }
  // cap the top with a fan so the slab reads as a solid surface
  const topStart = positions.length / 3;
  positions.push(0, top, 0);
  strataColor(1, c); colors.push(c.r, c.g, c.b);
  for (let ri = 0; ri < RINGS; ri++){
    for (let si = 0; si < SEGS; si++){
      const a = ri * SEGS + si;
      const b = ri * SEGS + (si + 1) % SEGS;
      const cIdx = (ri + 1) * SEGS + si;
      const d = (ri + 1) * SEGS + (si + 1) % SEGS;
      // outward-facing winding: these side walls are viewed from outside, so a
      // reversed order here makes the rock see-through (back-face culled)
      indices.push(a, b, cIdx, b, d, cIdx);
    }
  }
  // top fan
  for (let si = 0; si < SEGS; si++){
    indices.push(topStart, (si + 1) % SEGS, si);
  }
  // tip fan — one point at the very bottom of the stalactite
  const tipStart = positions.length / 3;
  const c2 = new THREE.Color();
  positions.push(0.35, top - ISLE_DEPTH * 1.02, 0.25);
  strataColor(0, c2); colors.push(c2.r, c2.g, c2.b);
  for (let si = 0; si < SEGS; si++){
    indices.push(RINGS * SEGS + si, RINGS * SEGS + (si + 1) % SEGS, tipStart);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

const island = new THREE.Group();
scene.add(island);
island.add(szopka);                 // the szopka rides the island
szopka.position.z = -1.5;           // set back, leaving room at the front

const islandMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true,
  envMapIntensity: 0.3,
});
const islandRoots = [];
/* The fragments share the rock's look but not its vertex colours — a
   DodecahedronGeometry has no `color` attribute, so a vertexColors material
   would render them solid black. */
const islandFragMaterial = new THREE.MeshStandardMaterial({
  color: 0x4A433A, roughness: 0.96, metalness: 0, flatShading: true,
  envMapIntensity: 0.2,
});
/* the outermost top-ring vertices, kept so the snow cap and the moss band can
   hug the real rock silhouette instead of guessing an octagon */
let islandTopRing = null;
{
  const bodyGeo = buildIslandBody();
  {
    const SEGS = ISLE_SEGS, TOPR = 2;
    const src = bodyGeo.attributes.position;
    islandTopRing = new Float32Array((TOPR + 1) * SEGS * 3);
    for (let r = 0; r <= TOPR; r++){
      for (let s = 0; s < SEGS; s++){
        const i = r * SEGS + s, o = (r * SEGS + s) * 3;
        islandTopRing[o] = src.getX(i);
        islandTopRing[o + 1] = src.getY(i);
        islandTopRing[o + 2] = src.getZ(i);
      }
    }
  }
  const body = new THREE.Mesh(bodyGeo, islandMaterial);
  body.castShadow = true; body.receiveShadow = true;
  island.add(body);

  /* A thin frosty soil / moss band hugging the top rim. It is the same ring
     mesh collapsed to just the outermost two rings, lifted a hair so it can
     never z-fight with the rock body underneath. */
  /* A thin frosty soil / moss band hugging the top rim. Ring 0 of the body is
     the true top edge; ring 1 is already deep down the cone, so the band is
     built explicitly as a short skirt hanging just under that lip. */
  {
    const SEGS = ISLE_SEGS, TOPR = 2;
    const pos = [], col = [], idx = [];
    const gc = new THREE.Color(0x5A6152);       // muted moss/soil, not neon green
    for (let r = 0; r <= TOPR; r++){
      for (let s = 0; s < SEGS; s++){
        const i = (r * SEGS + s) * 3;
        pos.push(islandTopRing[i] * 1.008, islandTopRing[i + 1] + 0.012, islandTopRing[i + 2] * 1.008);
        const n = (fbm2((s / SEGS), r * 0.4, 3, 8) - 0.5) * 0.16;
        col.push(gc.r + n, gc.g + n, gc.b + n);
      }
    }
    for (let r = 0; r < TOPR; r++){
      for (let s = 0; s < SEGS; s++){
        const a = r * SEGS + s, b = r * SEGS + (s + 1) % SEGS;
        const c2 = (r + 1) * SEGS + s, d = (r + 1) * SEGS + (s + 1) % SEGS;
        idx.push(a, c2, b, b, c2, d);
      }
    }
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    rg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    rg.setIndex(idx);
    rg.computeVertexNormals();
    const rim = new THREE.Mesh(rg, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true,
      envMapIntensity: 0.25, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    }));
    rim.castShadow = false; rim.receiveShadow = true;
    island.add(rim);
  }

  /* 6–10 dangling roots under the underside */
  const rootMat = new THREE.MeshStandardMaterial({
    color: 0x4A372A, roughness: 0.92, metalness: 0, envMapIntensity: 0.3,
  });
  for (let i = 0; i < 9; i++){
    const a = (i / 9) * TAU + rr(-0.25, 0.25);
    const startR = ISLE_RX * islandProfile(0.52) * rr(0.45, 0.8);
    // NB: `PED_H`, not `top` — `top` is scoped inside buildIslandBody, and a
    // bare `top` here would silently resolve to window.top and NaN the curve.
    const startY = PED_H - ISLE_DEPTH * 0.42;
    const len = rr(2.2, 5.4);
    // enough control points, and never two coincident ones — a duplicated
    // point gives CatmullRom a zero-length tangent and NaNs the frame
    const pts = [];
    for (let k = 0; k <= 10; k++){
      const f = k / 10;
      const p = new THREE.Vector3(
        Math.cos(a) * startR * (1 - f * 0.35) + Math.sin(f * 3.4 + i) * 0.5,
        startY - f * len,
        Math.sin(a) * startR * (1 - f * 0.35) + Math.cos(f * 2.8 + i) * 0.5
      );
      if (pts.length) p.addScaledVector(new THREE.Vector3(rr(-0.06,0.06), rr(-0.04,0.04), rr(-0.06,0.06)), 1);
      pts.push(p);
    }
    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
    const SEG = 18, RAD = 5;
    const g = new THREE.TubeGeometry(curve, SEG, 0.13, RAD, false);
    // taper the root toward its tip
    const pos = g.attributes.position;
    const v = new THREE.Vector3();
    for (let k = 0; k < pos.count; k++){
      v.fromBufferAttribute(pos, k);
      const ring = Math.floor(k / (RAD + 1));
      const f = clamp(ring / SEG, 0, 1);
      const c2 = curve.getPoint(f);
      v.sub(c2).multiplyScalar(lerp(1.4, 0.12, f)).add(c2);
      pos.setXYZ(k, v.x, v.y, v.z);
    }
    pos.needsUpdate = true;
    g.computeVertexNormals();
    const root = new THREE.Mesh(g, rootMat);
    root.castShadow = true;
    root.userData.phase = rnd() * TAU;
    root.userData.sway = rr(0.04, 0.11);
    island.add(root);
    islandRoots.push(root);
  }

  /* Floating rock fragments. They orbit outside the island's footprint, and
     are kept either low (below the rock lip) or high (above the spire tip) so
     that from any angle they read as separate debris rather than crossing the
     szopka's facade. */
  const fragGeo = new THREE.DodecahedronGeometry(1, 0);
  for (let i = 0; i < 7; i++){
    const s = rr(0.25, 0.8);
    const a = (i / 7) * TAU + rr(-0.4, 0.4);
    const d = rr(14.0, 21.0);
    const m = new THREE.Mesh(fragGeo, islandFragMaterial);
    m.scale.set(s * rr(0.8, 1.3), s * rr(0.6, 1.0), s * rr(0.8, 1.3));
    // first five drift under the island, the last two float above the spire
    const y = PED_H - rr(2.5, 11.0);
    m.position.set(Math.cos(a) * d, y, Math.sin(a) * d * 0.8);
    m.rotation.set(rr(0, 3), rr(0, 3), rr(0, 3));
    m.castShadow = true; m.receiveShadow = true;
    m.userData = {
      y0: m.position.y,
      phase: rnd() * TAU,
      bob: rr(0.18, 0.5),
      spin: rr(0.06, 0.22) * (rnd() < 0.5 ? -1 : 1),
    };
    island.add(m);
  }
}

/* ---------- constants for the tiers ----------
   Heights are WORLD y. Anything parented to groundTier uses GT-local coords. */
const GT_Y0 = PED_H, GT_Y1 = 4.8, GT_W = 10, GT_D = 5;      // ground tier
const GT_H = GT_Y1 - GT_Y0;
const MT_Y0 = 4.8, MT_Y1 = 8.6, MT_W = 6, MT_D = 4;          // middle tier
const NICHE_W = 3.0, NICHE_H = 3.2, NICHE_D = 1.5;
/* the cave floor sits on the 0.45 sill, i.e. GT-local y = 0.45 */
const NICHE_YL = 0.45;                       // cave floor, groundTier-local
const NICHE_FLOOR = GT_Y0 + NICHE_YL;        // …and in world space: 1.25
const TOWER_X = 4.15, TOWER_Z = 1.62, TOWER_W = 1.55;

/* ---------- 1 · GROUND TIER ---------- */
const groundTier = new THREE.Group();
groundTier.position.y = GT_Y0;
szopka.add(groundTier);

/*
 * Massing, in ground-tier local coords (x ±5, z ±2.5, y 0 → 4):
 *   · a full-width rear block from z = -2.5 to the niche back at z = +1.0
 *   · two side blocks, each 3.5 wide, running the full 5 deep
 *   · the centre bay between them is hollowed out for the dragon's cave:
 *     a 3.0 × 3.2 × 1.5 arched cavity opening on the front face
 *   · a lintel over the arch and a low sill under it
 */
const BAYS = 5;                                   // five vertical facade bays
const BAY_W = GT_W / BAYS;                         // 2.0
const HALF_NICHE = NICHE_W / 2;                    // 1.5
const COL_W = 3.6;                                 // width of the centre bay column
const HALF_COL = COL_W / 2;                        // 1.8
const NICHE_BACK = GT_D / 2 - NICHE_D;             // 1.0 — where the cave ends
const NICHE_MID = (GT_D / 2 + NICHE_BACK) / 2;     // 1.75 — its centre in z

{
  const midY = GT_H / 2;
  const sideW = (GT_W - COL_W) / 2;                // 3.2
  const backD = GT_D / 2 + NICHE_BACK;             // 3.5

  const mk = (w, h, d, x, y, z, col) => {
    const m = new THREE.Mesh(boxGeo(w, h, d), foil(col, 0.29));
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    groundTier.add(m);
    return m;
  };
  // left & right masses, running the full depth
  mk(sideW, GT_H, GT_D, -(HALF_COL + sideW / 2), midY, 0, PAL.emerald);
  mk(sideW, GT_H, GT_D,  (HALF_COL + sideW / 2), midY, 0, PAL.red);
  // rear mass behind the cave
  mk(COL_W, GT_H, backD, 0, midY, -GT_D / 2 + backD / 2, PAL.cobalt);
  // lintel over the arch, and the sill the cave floor sits on
  const linH = GT_H - NICHE_H - 0.45;
  mk(COL_W, linH, NICHE_D, 0, NICHE_H + 0.45 + linH / 2, NICHE_MID, PAL.violet);
  mk(COL_W, 0.45, NICHE_D, 0, 0.225, NICHE_MID, PAL.violet);

  /* Cave vault: an ARCH-SHAPED TUNNEL, not a box. A box NICHE_H tall based at
     y = 0 put its ceiling 0.45 BELOW the arch apex, so the arch wall's coloured
     inner faces showed as a strip above it. Extruding the same archShape as the
     opening makes the vault follow the arch exactly. Its cross-section is inset
     CAVE_IN from the opening so it sits just inside the arch and hides those
     faces; the depth runs from the front face back to caveBack. */
  const caveBack = NICHE_BACK + 0.1, caveFront = GT_D / 2;
  const CAVE_IN = 0.01;
  const caveShape = archShape(NICHE_W - CAVE_IN * 2, NICHE_H - CAVE_IN);
  const caveDepth = caveFront - caveBack;
  // worldUV so the stone relief tiles in world space, like every other surface
  const cave = new THREE.Mesh(worldUV(new THREE.ExtrudeGeometry(caveShape, {
    depth: caveDepth, bevelEnabled: false, curveSegments: 20,
  })), caveShell);
  // extruded towards +z, so push it back to start at the cave's rear plane
  /* CAVE_DROP sinks the vault so its bottom rim is buried inside the violet
     sill and its crown sits under the lintel: the two coplanar faces at the
     cave floor and at the arch head both disappear. The lintel then hangs clear
     of the crown by the same amount, so the dark strip below closes the gap. */
  const CAVE_DROP = 0.045;
  cave.position.set(0, NICHE_YL - CAVE_DROP, caveBack);
  cave.receiveShadow = true;
  groundTier.add(cave);

  // the shadowed strip that hides the slot between the vault and the lintel
  const caveGap = new THREE.Mesh(
    boxGeo(2.3, 0.16, caveDepth - 0.02), cardboard(0x1C1A1E));
  caveGap.position.set(0, NICHE_H + 0.45 - 0.05, caveBack + caveDepth / 2);
  caveGap.castShadow = true; caveGap.receiveShadow = true;
  groundTier.add(caveGap);

  /* Flat arch-shaped cap closing the back of the tunnel, facing forward. The
     extrusion's own end cap is back-facing here, so this is what the dragon
     actually sees behind him. */
  const caveBackWall = new THREE.Mesh(
    worldUV(new THREE.ShapeGeometry(caveShape, 20)), caveShell.clone());
  caveBackWall.material.side = THREE.FrontSide;
  caveBackWall.position.set(0, NICHE_YL - CAVE_DROP, caveBack + 0.004);
  groundTier.add(caveBackWall);

  // the cave floor itself, a dark rocky slab
  const caveFloor = new THREE.Mesh(boxGeo(NICHE_W - 0.04, 0.06, caveFront - caveBack), darkRock);
  caveFloor.position.set(0, NICHE_YL + 0.03, (caveFront + caveBack) / 2);
  caveFloor.receiveShadow = true;
  groundTier.add(caveFloor);

  // boulders hugging the cave walls, kept clear of the middle — one
  // InstancedMesh for the lot, since they differ only in size and rotation
  {
    const rockGeo = worldUV(new THREE.DodecahedronGeometry(1, 0));
    for (let i = 0; i < 22; i++){
      const s = rr(0.16, 0.4);
      const a = rnd() * TAU;
      const p = i < 13
        ? V(Math.cos(a) * 1.16, 0.06 + s * 0.4, NICHE_MID + Math.sin(a) * 0.44)
        : V(Math.cos(a) * 1.22, rr(0.8, NICHE_H - 0.4), caveBack + rr(0.02, 0.16));
      batchAdd('caveRock', rockGeo, darkRock,
        xform(p.x, p.y + GT_Y0, p.z, rr(0, 3), s, s, s, rr(0, 3), rr(0, 3)));
    }
  }
}

/* --- the centre bay: a large round-arched niche (the dragon's cave) --- */
{
  const g = new THREE.Group();
  g.position.set(0, NICHE_YL, GT_D / 2);     // on the front face, local z = outward
  groundTier.add(g);

  // arch wall: a slab with a big arched hole punched through it
  const wallW = HALF_COL;                           // 1.8 — the full column half-width
  const wallH = GT_H - NICHE_YL;
  const outer = new THREE.Shape();
  outer.moveTo(-wallW, 0); outer.lineTo(wallW, 0); outer.lineTo(wallW, wallH); outer.lineTo(-wallW, wallH); outer.closePath();
  const arch = archShape(NICHE_W, NICHE_H);
  outer.holes.push(new THREE.Path(arch.getPoints(34)));
  const D = NICHE_D;                             // the wall is as deep as the cave
  const wallGeo = worldUV(new THREE.ExtrudeGeometry(outer, {
    depth: D, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 1, curveSegments: 16,
  }));
  const wall = new THREE.Mesh(wallGeo, foil(PAL.violet, 0.28));
  wall.position.z = -D;                          // extrudes inward, into the tier
  wall.castShadow = true; wall.receiveShadow = true;
  g.add(wall);

  // gold archivolt standing proud of the opening
  const ringOuter = archShape(NICHE_W + 0.34, NICHE_H + 0.17);
  ringOuter.holes.push(new THREE.Path(archShape(NICHE_W, NICHE_H).getPoints(34)));
  const archivolt = new THREE.Mesh(
    worldUV(new THREE.ExtrudeGeometry(ringOuter, { depth: 0.2, bevelEnabled: true, bevelSize: 0.022, bevelThickness: 0.022, bevelSegments: 1, curveSegments: 18 })),
    goldFoil()
  );
  archivolt.position.z = 0.0;
  archivolt.castShadow = true; archivolt.receiveShadow = true;
  g.add(archivolt);

  // keystone
  const key = new THREE.Mesh(boxGeo(0.28, 0.42, 0.26), goldFoil());
  key.position.set(0, NICHE_H - 0.09, 0.13);
  key.castShadow = true;
  g.add(key);

  // a pair of slim colonnettes flanking the opening
  for (const s of [-1, 1]){
    const col = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(0.075, 0.085, NICHE_H + 0.2, 10)), goldFoil());
    col.position.set(s * (HALF_NICHE + 0.15), (NICHE_H + 0.2) / 2 - 0.1, 0.12);
    col.castShadow = true;
    g.add(col);
  }

  // the warm firelight that lives inside the cave
  caveLight = new THREE.PointLight(0xff7a1c, 2.2, 3.4, 2);
  caveLight.position.set(0, NICHE_FLOOR + 1.5, NICHE_MID - 0.1);
  szopka.add(caveLight);        // rides the island, so the glow stays in the cave
}

/* --- facade: five bays split by gold pilasters --- */
{
  const fFront = faceFront(GT_D / 2);
  const fBack  = faceBack(-GT_D / 2);
  const fRight = faceRight(GT_W / 2);
  const fLeft  = faceLeft(-GT_W / 2);

  // thin gold pilasters between the bays (front & back)
  const pilGeo = boxGeo(0.1, GT_H - 0.1, 0.1);
  for (let i = 1; i < BAYS; i++){
    const x = -GT_W / 2 + i * BAY_W;
    if (Math.abs(x) < HALF_COL - 0.2) continue;      // skip the ones the niche occupies
    for (const f of [fFront, fBack]){
      const m = new THREE.Mesh(pilGeo, goldFoil());
      const c = Math.cos(f.rotY), sn = Math.sin(f.rotY);
      m.position.set(f.x + x * c + 0.03 * sn, GT_H / 2, f.z - x * sn + 0.03 * c);
      m.rotation.y = f.rotY;
      m.castShadow = true; m.receiveShadow = true;
      groundTier.add(m);
    }
  }

  // side bays: arched stained-foil windows in two stacked levels
  const winColors = [PAL.cobalt, PAL.pink, PAL.gold, PAL.emerald, PAL.violet];
  const studColors = [PAL.red, PAL.cobalt, PAL.emerald, PAL.pink, PAL.violet];

  const decorateFace = (face, bays, opts) => {
    for (let b = 0; b < bays; b++){
      const u = (b + 0.5 - bays / 2) * (opts.span / bays);
      if (opts.skip && opts.skip(u)) continue;          // e.g. the dragon's niche
      const bw = opts.span / bays - 0.16;
      // the coloured foil sheet of this bay; neighbours never share a colour
      addBayPanel(face, u, opts.panelY, bw, opts.panelH, opts.cycle[(b + opts.offset) % opts.cycle.length]);
      for (let r = 0; r < opts.rows; r++){
        const v = opts.rowY[r];
        const col = winColors[(b * 3 + r * 2 + opts.offset) % winColors.length];
        addWindowOn(face, u, v, opts.winW, opts.winH, col, true);
        addStud(face, u, v - 0.17, PAL.gold, 0.1, true, 0.09);
        for (let d = -1; d <= 1; d++){
          addStud(face, u + d * 0.3, v + opts.winH + 0.2,
            studColors[(b * 3 + r * 2 + d + 8) % studColors.length], 0.125, (d === 0), 0.1);
        }
      }
      if (opts.rosette) addRosette(face, u, opts.rosette, 0.2, PAL.gold, 0.075);
    }
  };

  // front & back facades — the front skips the centre bay, which is the cave
  const fOpts = { span: GT_W, cycle: CYCLE, rows: 2, rowY: [0.78, 2.42], winW: 0.8, winH: 1.0,
                  rosette: 4.05, panelY: 0.16, panelH: GT_H - 0.32 };
  decorateFace(fFront, BAYS, { ...fOpts, offset: 0, skip: u => Math.abs(u) < HALF_COL - 0.25 });
  decorateFace(fBack,  BAYS, { ...fOpts, offset: 2, cycle: CYCLE2, rosette: 4.05 });
  const sOpts = { span: GT_D, cycle: CYCLE2, rows: 2, rowY: [0.78, 2.42], winW: 0.76, winH: 0.96,
                  rosette: 4.05, panelY: 0.16, panelH: GT_H - 0.32 };
  decorateFace(fRight, 3, { ...sOpts, offset: 1, cycle: CYCLE });
  decorateFace(fLeft,  3, { ...sOpts, offset: 3 });
}

/* ---------- 2 · CLOTH HALL PARAPET (Sukiennice attic) ---------- */
{
  const bandH = 0.42;
  const bandW = GT_W + 0.16, bandD = GT_D + 0.16;
  const band = new THREE.Mesh(boxGeo(bandW, bandH, bandD), foil(PAL.pink, 0.3));
  band.position.y = GT_H + bandH / 2;
  band.castShadow = true; band.receiveShadow = true;
  groundTier.add(band);

  // gold cornice under and over the attic band
  for (const [y, h, over] of [[GT_H + 0.055, 0.11, 0.1], [GT_H + bandH + 0.07, 0.1, 0.13]]){
    const c = new THREE.Mesh(boxGeo(bandW + over * 2, h, bandD + over * 2), goldFoil());
    c.position.y = y;
    c.castShadow = true; c.receiveShadow = true;
    groundTier.add(c);
  }

  // small arched loggia niches on the attic band, all four sides
  const atticFace = (rotY, x, z, len, n, col) => {
    const c = Math.cos(rotY), sn = Math.sin(rotY);
    for (let i = 0; i < n; i++){
      const u = (i + 0.5 - n / 2) * (len / n);
      const px = x + u * c + 0.02 * sn, pz = z - u * sn + 0.02 * c;
      // the band lives inside groundTier, so lift it into world space
      addWindow(0.26, 0.3, col, groupXform(groundTier, xform(px, GT_H + 0.06, pz, rotY)), false);
    }
  };
  const ac = [PAL.cobalt, PAL.emerald, PAL.violet, PAL.pink];
  atticFace(0, 0, bandD / 2, bandW, 22, ac[0]);
  atticFace(Math.PI, 0, -bandD / 2, bandW, 22, ac[2]);
  atticFace(-Math.PI / 2, bandW / 2, 0, bandD, 11, ac[1]);
  atticFace(Math.PI / 2, -bandW / 2, 0, bandD, 11, ac[3]);

  // the key Kraków signature: gold semicircular crenellations + pinnacles.
  // The front run stops short of both towers, and the side runs stop behind
  // them, so the towers rise cleanly through the parapet.
  const pw = bandW + 0.13, pd = bandD + 0.13, inner = TOWER_X - 0.9;
  addCrenellationRow([
    { len: pw, fixed:  pd / 2, rot: 0, from: -inner, to: inner },
    { len: pw, fixed: -pd / 2, rot: 0 },
    { len: pd, fixed:  pw / 2, rot: Math.PI / 2, from: -pd / 2, to: 0.45 },
    { len: pd, fixed: -pw / 2, rot: Math.PI / 2, from: -pd / 2, to: 0.45 },
  ], GT_H + bandH + 0.1, { step: 0.46, merlonColor: PAL.gold, pinColor: PAL.gold, mh: 0.3, ph: 0.66, pr: 0.072 });
  var parapetY = GT_H + bandH + 0.1;
}

/* ---------- 3 · MIDDLE TIER + CENTRAL TIERED TOWER ---------- */
{
  const y0 = MT_Y0, h = MT_Y1 - MT_Y0;
  const block = new THREE.Mesh(boxGeo(MT_W, h, MT_D), foil(PAL.emerald, 0.28));
  block.position.y = y0 + h / 2;
  block.castShadow = true; block.receiveShadow = true;
  szopka.add(block);

  // a stepped base moulding and a top cornice, both gold
  const base = new THREE.Mesh(boxGeo(MT_W + 0.5, 0.22, MT_D + 0.5), goldFoil());
  base.position.y = y0 + 0.11; base.castShadow = true; base.receiveShadow = true;
  szopka.add(base);
  /* Its top sat at exactly MT_Y1 — the same height as the emerald block's top —
     so the gold cornice and the green block z-fought across the entire roof.
     The cornice IS the flat roof you walk on, so it now stands 0.03 proud and
     ROOF_BACK_Y below follows it up. */
  const corn = new THREE.Mesh(boxGeo(MT_W + 0.4, 0.16, MT_D + 0.4), goldFoil());
  corn.position.y = MT_Y1 - 0.05; corn.castShadow = true; corn.receiveShadow = true;
  szopka.add(corn);
  const MID_ROOF_Y = MT_Y1 + 0.03;            // the cornice's new top face

  // arcaded front: three small arches with glowing panes
  const f = faceFront(MT_D / 2);
  const arcCols = [PAL.cobalt, PAL.gold, PAL.pink];
  const mCycle = [PAL.violet, PAL.pink, PAL.emerald, PAL.red, PAL.cobalt];
  for (let i = 0; i < 3; i++){
    const u = (i - 1) * 1.62;
    addBayPanel(f, u, MT_Y0 + 0.22, 1.42, MT_Y1 - MT_Y0 - 0.5, mCycle[i % mCycle.length]);
    addWindowOn(f, u, MT_Y0 + 0.55, 0.92, 1.28, arcCols[i], true);
    addStud(f, u, MT_Y0 + 0.36, PAL.gold, 0.15, true, 0.1);
    for (const d of [-1, 1]) addStud(f, u + d * 0.34, MT_Y0 + 0.36, mCycle[(i + d + 5) % 5], 0.13, false, 0.1);
    addRosette(f, u, MT_Y1 - 0.44, 0.17, PAL.gold, 0.075);
  }
  // arcaded sides & back, each with its own panel colours
  const sideCols = [PAL.pink, PAL.cobalt, PAL.emerald];
  for (const [face, off] of [[faceRight(MT_W / 2), 0], [faceLeft(-MT_W / 2), 2]]){
    for (let b = 0; b < 2; b++){
      const u = (b - 0.5) * 2.0;
      addBayPanel(face, u, MT_Y0 + 0.22, 1.8, MT_Y1 - MT_Y0 - 0.5, mCycle[(b + off) % mCycle.length]);
      addWindowOn(face, u, MT_Y0 + 0.55, 0.86, 1.22, sideCols[(b + off) % 3], true);
    }
  }
  const fb = faceBack(-MT_D / 2);
  for (let b = 0; b < 3; b++){
    const u = (b - 1) * 1.6;
    addBayPanel(fb, u, MT_Y0 + 0.22, 1.4, MT_Y1 - MT_Y0 - 0.5, mCycle[(b + 1) % mCycle.length]);
    addWindowOn(fb, u, MT_Y0 + 0.55, 0.9, 1.24, [PAL.cobalt, PAL.emerald, PAL.violet][b], true);
  }

  /* ==================================================================
     THE CENTRAL TOWER — stacked stages crowned by a small helmet, the way a
     Kraków szopka puts a church tower in the middle rather than a big dome.
     ================================================================== */
  const SA_Y0 = MT_Y1, SA_Y1 = 10.2;      // stage A
  const SB_Y0 = 10.3, SB_Y1 = 11.6;       // stage B
  const SC_Y0 = 11.7, SC_Y1 = 12.3;       // stage C drum

  /* ---- STAGE A: square block, tall arched windows, 4 corner pinnacles ---- */
  {
    const w = 3.0, d = 2.6, h = SA_Y1 - SA_Y0;
    const blk = new THREE.Mesh(boxGeo(w, h, d), foil(PAL.cobalt, 0.28));
    blk.position.y = SA_Y0 + h / 2;
    blk.castShadow = true; blk.receiveShadow = true;
    szopka.add(blk);

    const fA = faceFront(d / 2);
    /* NB: NOT addBayPanel. That builder is batched under a single key, and
       batchAdd keeps only the FIRST geometry it is handed — so every panel
       renders at the first call's size (1.9 × 3.71) whatever w/h you ask for.
       On a stage this short that walls off the rose window. makePanel builds a
       real box and respects its dimensions. */
    const ac = [PAL.red, PAL.emerald, PAL.violet, PAL.pink];
    const panel = (pw, ph, x, y, z, col, rotY = 0) => {
      const m = makePanel(pw, ph, 0.06, col, 0.28);
      m.position.set(x, y, z);
      m.rotation.y = rotY;
      szopka.add(m);
    };
    const ph = h - 0.6, py = SA_Y0 + h / 2;
    // alternating foil panels on the front, between the two windows
    for (let i = 0; i < 3; i++) panel(0.9, ph, (i - 1) * 1.0, py, d / 2 + 0.04, ac[i]);
    // gold surrounds behind the two front windows
    for (const u of [-0.62, 0.62]) panel(0.86, h - 0.7, u, py, d / 2 + 0.05, PAL.gold);
    for (const u of [-0.62, 0.62]){
      addWindowOn(fA, u, SA_Y0 + 0.46, 0.62, h - 1.0, PAL.pink, true);
      addRosette(fA, u, SA_Y1 - 0.34, 0.14, PAL.gold, 0.06);
    }
    // one tall arched window per remaining face
    panel(1.5, ph, w / 2 + 0.04, py, 0, ac[3], Math.PI / 2);
    panel(1.5, ph, -w / 2 - 0.04, py, 0, ac[1], Math.PI / 2);
    panel(1.4, ph, 0, py, -d / 2 - 0.04, ac[2]);
    for (const [face, col] of [[faceRight(w / 2), PAL.emerald], [faceLeft(-w / 2), PAL.violet], [faceBack(-d / 2), PAL.cobalt]]){
      addWindowOn(face, 0, SA_Y0 + 0.44, 0.66, h - 0.95, col, true);
    }
    // gold cornice
    const corn = new THREE.Mesh(boxGeo(w + 0.34, 0.18, d + 0.34), goldFoil());
    corn.position.y = SA_Y1 + 0.09;
    corn.castShadow = true; corn.receiveShadow = true;
    szopka.add(corn);
    // 4 small gold pinnacles on the corners
    for (const sx of [-1, 1]) for (const sz of [-1, 1]){
      const p = new THREE.Mesh(pinGeo(0.44, 0.055), goldFoil());
      p.position.set(sx * (w / 2 + 0.1), SA_Y1 + 0.18, sz * (d / 2 + 0.1));
      p.castShadow = true;
      szopka.add(p);
    }
  }

  /* ---- STAGE B: octagonal block with a rose window on the front ---- */
  {
    const r = 1.05, h = SB_Y1 - SB_Y0;
    const oct = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(r, r, h, 8, 1)), foil(PAL.emerald, 0.27));
    oct.position.y = SB_Y0 + h / 2;
    oct.rotation.y = Math.PI / 8;
    oct.castShadow = true; oct.receiveShadow = true;
    szopka.add(oct);

    /* With rotation.y = π/8 an octagon's flat face points straight at +Z, and
       that face sits at the APOTHEM (r·cos 22.5°), not at r. The rose and the
       side windows have to clear that or they end up buried in the block. */
    const apo = r * Math.cos(Math.PI / 8);
    const rwR = 0.62, rwY = SB_Y0 + h / 2, rwZ = apo + 0.03;
    const roseCols = [PAL.red, PAL.cobalt, PAL.pink, PAL.violet, PAL.gold, PAL.emerald, PAL.cobalt, PAL.pink];
    for (let i = 0; i < 8; i++){
      const a0 = (i / 8) * TAU, a1 = ((i + 1) / 8) * TAU;
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.absarc(0, 0, rwR, a0, a1, false);
      shape.lineTo(0, 0);
      const g = new THREE.ShapeGeometry(shape, 6);
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
        color: roseCols[i], emissive: roseCols[i], emissiveIntensity: 0.9,
        roughness: 0.5, metalness: 0, side: THREE.DoubleSide,
      }));
      m.position.set(0, rwY, rwZ);
      szopka.add(m);
    }
    const roseRing = new THREE.Mesh(worldUV(new THREE.TorusGeometry(rwR, 0.055, 8, 28)), goldFoil());
    roseRing.position.set(0, rwY, rwZ);
    szopka.add(roseRing);
    // hub + 4 gold spokes
    const hub = new THREE.Mesh(worldUV(new THREE.SphereGeometry(0.11, 12, 10)), goldFoil());
    hub.position.set(0, rwY, rwZ + 0.05);
    szopka.add(hub);
    for (let i = 0; i < 4; i++){
      const a = (i / 4) * Math.PI;
      const sp = new THREE.Mesh(boxGeo(0.05, rwR * 2 - 0.06, 0.05), goldFoil());
      sp.position.set(0, rwY, rwZ + 0.02);
      sp.rotation.z = a;
      szopka.add(sp);
    }
    /* Small arched windows on the six faces that aren't front or back.
       NB in xform(cos·r, y, sin·r) the angle is measured from +X, so 90° is
       +Z — the rose window's face — and 270° is the back. */
    for (let i = 0; i < 8; i++){
      if (i === 2 || i === 6) continue;                 // front (rose) and back
      const a = (i / 8) * TAU;
      addWindow(0.34, 0.6, [PAL.pink, PAL.cobalt, PAL.gold][i % 3],
        xform(Math.cos(a) * (apo + 0.02), rwY, Math.sin(a) * (apo + 0.02), Math.PI / 2 - a), true);
    }
    // gold cornice
    const corn = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(r + 0.17, r + 0.17, 0.15, 8, 1)), goldFoil());
    corn.position.y = SB_Y1 + 0.075;
    corn.rotation.y = Math.PI / 8;
    corn.castShadow = true; corn.receiveShadow = true;
    szopka.add(corn);
  }

  /* ---- STAGE C: small round drum with a ring of tiny windows ---- */
  {
    const r = 0.75, h = SC_Y1 - SC_Y0;
    const dr = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(r, r * 1.04, h, 16, 1)), foil(PAL.gold, 0.26));
    dr.position.y = SC_Y0 + h / 2;
    dr.castShadow = true; dr.receiveShadow = true;
    szopka.add(dr);
    for (let i = 0; i < 10; i++){
      const a = (i / 10) * TAU + 0.1;
      addWindow(0.16, 0.26, [PAL.cobalt, PAL.pink, PAL.emerald, PAL.violet][i % 4],
        xform(Math.cos(a) * r, SC_Y0 + 0.18, Math.sin(a) * r, Math.PI / 2 - a), false);
    }
    const corn = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(r + 0.15, r + 0.15, 0.12, 16, 1)), goldFoil());
    corn.position.y = SC_Y1 + 0.06;
    corn.castShadow = true; corn.receiveShadow = true;
    szopka.add(corn);
  }

  /* ---- HELMET: a small gold onion, lantern, second onion, crown, star ---- */
  const HEL_Y = SC_Y1 + 0.12;
  const HEL_R = 0.85, HEL_H = 1.8;
  {
    const dome = makeOnionDome(HEL_R, HEL_H, PAL.gold, 24);
    dome.position.y = HEL_Y;
    szopka.add(dome);
    // 8 gold ribs
    const pts = [];
    for (let s = 0; s <= 10; s++){
      const t = s / 10;
      const r = (HEL_R + 0.03) * Math.sin(Math.PI * Math.pow(t, 0.72)) * (1 + 0.16 * Math.sin(Math.PI * t));
      pts.push(new THREE.Vector3(r, t * HEL_H, 0));
    }
    const ribGeo = worldUV(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 12, 0.03, 4, false));
    for (let i = 0; i < 8; i++){
      batchAdd('helmRib', ribGeo, goldFoil(),
        xform(0, HEL_Y, 0, (i / 8) * TAU, 1, 1, 1), null, true);
    }

    // small open lantern
    const lantY = HEL_Y + HEL_H - 0.06;
    const lantern = new THREE.Mesh(worldUV(new THREE.CylinderGeometry(0.28, 0.3, 0.4, 12, 1, true)), goldFoil());
    lantern.position.y = lantY + 0.2;
    lantern.material.side = THREE.DoubleSide;
    lantern.castShadow = true;
    szopka.add(lantern);
    for (let i = 0; i < 4; i++){
      const a = (i / 4) * TAU;
      addWindow(0.12, 0.2, PAL.pink,
        xform(Math.cos(a) * 0.28, lantY + 0.12, Math.sin(a) * 0.28, Math.PI / 2 - a), false);
    }
    // second tiny onion

/* ---------- 4 · THE TWO FRONT TOWERS (St. Mary's Basilica) ---------- */
const leftTower = new THREE.Group();
const rightTower = new THREE.Group();

/** Push a local matrix out into world space through a group's transform.
    Everything that gets batched has to end up in world coordinates. */
function groupXform(group, localMatrix){
  group.updateMatrixWorld(true);
  return new THREE.Matrix4().multiplyMatrices(group.matrixWorld, localMatrix);
}

/**
 * A square tower shaft with pilaster corners, window levels and a cornice.
 * `levels` is a list of heights (relative to the tower base) that carry windows.
 */
function makeTowerShaft(group, { h, w, color, levels, winW, winH, yBase }){
  const shaft = new THREE.Mesh(boxGeo(w, h, w), foil(color, 0.28));
  shaft.position.y = yBase + h / 2;
  shaft.castShadow = true; shaft.receiveShadow = true;
  group.add(shaft);

  // gold corner pilasters — batched, since every tower repeats the same 16
  const pilH = h;
  const pilGeo = boxGeo(0.11, pilH, 0.11);
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]){
    for (const face of [{ x: 0, z: w / 2, rot: 0 }, { x: w / 2, z: 0, rot: -Math.PI / 2 }, { x: 0, z: -w / 2, rot: Math.PI }, { x: -w / 2, z: 0, rot: Math.PI / 2 }]){
      const c = Math.cos(face.rot), sn = Math.sin(face.rot);
      const ux = sx * w / 2, uz = sz * w / 2;
      const px = face.x + ux * c + 0.04 * sn, pz = face.z - uz * sn + 0.04 * c;
      // keyed by height: BATCH keeps one geometry per key, so a shared key
      // would give the shorter tower the taller one's 9.4 pilasters
      batchAdd(`towerPilaster:${pilH.toFixed(2)}`, pilGeo, goldFoil(),
        groupXform(group, xform(px, yBase + h / 2, pz, face.rot)), null, true);
    }
  }

  // Window levels on all four faces. The pane cycle must never include the
  // shaft's own colour, or a pane vanishes into the wall and reads as an
  // empty frame — so pick from the palette and drop the wall colour.
  const cols = (color === PAL.violet
    ? [PAL.gold, PAL.cobalt, PAL.emerald, PAL.pink, PAL.red]
    : [PAL.gold, PAL.pink, PAL.emerald, PAL.red, PAL.violet]
  ).filter(c => c !== color);
  for (let li = 0; li < levels.length; li++){
    const y = yBase + levels[li];
    const faces = [
      { x: 0, z: w / 2, rot: 0 },
      { x: 0, z: -w / 2, rot: Math.PI },
      { x: w / 2, z: 0, rot: -Math.PI / 2 },
      { x: -w / 2, z: 0, rot: Math.PI / 2 },
    ];
    for (const face of faces){
      const col = cols[mod(li + Math.round(face.rot * 2), cols.length)];
      addWindow(winW, winH, col, groupXform(group, xform(face.x, y, face.z, face.rot)), true);
    }
    // a thin gold string course between levels
    const sc = new THREE.Mesh(boxGeo(w + 0.1, 0.07, w + 0.1), goldFoil());
    sc.position.y = y + winH + 0.24;
    sc.castShadow = true; sc.receiveShadow = true;
    group.add(sc);
  }
  return shaft;
}
