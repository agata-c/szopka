/* ======================================================================
   9d · KRAKÓW PIGEONS
   One merged body geometry plus two wing meshes, all InstancedMesh, so the
   whole flock is three draw calls.
   ====================================================================== */
const PIGEON_N = 12;
const pigeons = [];      // { x, z, hx, hz, dir, hop, fly, flyA, flyY, ... }
let pigeonBody = null, pigeonWingL = null, pigeonWingR = null;
{
  const bodyMat = cardboard(0x8A93A6);
  const wingMat = cardboard(0x5E6779);
  const neckMat = new THREE.MeshStandardMaterial({
    color: 0x6FBF7A, roughness: 0.45, metalness: 0.25,      // iridescent green
  });
  const footMat = cardboard(0xE8A23A);
  const pos = [], nor = [], colA = [], idx = [];
  let base = 0;
  const tmpC = new THREE.Color();
  const push = (geo, m, mat) => {
    const g = geo.clone().applyMatrix4(m);
    const p = g.attributes.position, n = g.attributes.normal;
    tmpC.set(mat.color);
    for (let i = 0; i < p.count; i++){
      pos.push(p.getX(i), p.getY(i), p.getZ(i));
      nor.push(n.getX(i), n.getY(i), n.getZ(i));
      colA.push(tmpC.r, tmpC.g, tmpC.b);
    }
    const gi = g.index.array;
    for (let i = 0; i < gi.length; i++) idx.push(gi[i] + base);
    base += p.count;
  };
  const T = (x, y, z, sx, sy, sz) => new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z), new THREE.Quaternion(), new THREE.Vector3(sx, sy, sz));
  // body, head, beak, tail, neck ring and feet all baked into one geometry,
  // each part keeping its own colour through a vertex-colour attribute
  const sph = (r, w, h) => new THREE.SphereGeometry(r, w, h);
  push(sph(1, 10, 8), T(0, 0.10, 0, 0.115, 0.10, 0.16), bodyMat);
  push(sph(1, 10, 8), T(0, 0.20, 0.12, 0.062, 0.062, 0.07), bodyMat);
  push(new THREE.ConeGeometry(0.028, 0.08, 6), T(0, 0.19, 0.20, 1, 1, 1).multiply(
    new THREE.Matrix4().makeRotationX(Math.PI / 2)), bodyMat);
  push(new THREE.ConeGeometry(0.075, 0.16, 5), T(0, 0.13, -0.17, 1, 1, 1).multiply(
    new THREE.Matrix4().makeRotationX(-Math.PI / 2.2)), wingMat);
  push(sph(1, 8, 6), T(0, 0.185, 0.115, 0.058, 0.05, 0.055), neckMat);
  for (const sx of [-1, 1]){
    push(new THREE.CylinderGeometry(0.011, 0.011, 0.07, 5), T(sx * 0.04, 0.035, 0.02, 1, 1, 1), footMat);
    push(sph(1, 6, 5), T(sx * 0.04, 0.012, 0.02, 0.03, 0.012, 0.045), footMat);
  }
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  merged.setAttribute('normal',   new THREE.Float32BufferAttribute(nor, 3));
  merged.setAttribute('color',    new THREE.Float32BufferAttribute(colA, 3));
  merged.setIndex(idx);
  /* Two wing boxes. The right one runs along local +X, the left is the same
     solid MIRRORED along -X — a scale of -1 would flip the normals and light
     the wing inside out. Both hinge at their own origin, the shoulder. */
  const wingGeoR = worldUV(new THREE.BoxGeometry(0.19, 0.016, 0.10).translate(0.095, 0, 0));
  const wingGeoL = worldUV(new THREE.BoxGeometry(0.19, 0.016, 0.10).translate(-0.095, 0, 0));
  const mk = (geo, mat) => {
    const im = new THREE.InstancedMesh(geo, mat, PIGEON_N);
    im.castShadow = true; im.receiveShadow = true;
    im.frustumCulled = false;
    island.add(im);
    return im;
  };
  pigeonBody = mk(merged, new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.8, metalness: 0.05, vertexColors: true,
  }));
  pigeonWingL = mk(wingGeoL, wingMat);
  pigeonWingR = mk(wingGeoR, wingMat);
  for (let i = 0; i < PIGEON_N; i++){
    /* Spawned through the same free-spot search every landing uses. The old
       polar ring (radius 1.5-6.5 by 2.0-5.5, signed on both axes) put birds
       as low as z -5.5, which is inside the szopka's ground tier. */
    const spot = pigeonFreeSpot();
    const hx = spot[0], hz = spot[1];
    pigeons.push({
      x: 0, z: 0, hx, hz, lastX: hx, lastZ: hz,
      dir: rr(0, TAU), hop: rr(0, TAU), hopRate: rr(1.6, 2.8),
      peck: rr(0, TAU), seed: rr(0, TAU),
      scale: rr(0.85, 1.1),
      // flight
      fly: 0, flyAng: 0, flyR: 0, flyY: 0,
      upX: 0, upZ: 0, circX0: 0, circZ0: 0,
      landX: null, landZ: null, landDir: 0,
      fromX: 0, fromZ: 0, fromY: 0,
      stageX: 0, stageZ: 0, stageAng: 0, stageR: 0, angDelta: 0,
      ext: 0, px: hx, py: PLAZA_Y, pz: hz,
    });
  }
}
const pigeonMeshes = [pigeonBody, pigeonWingL, pigeonWingR];
/** Send the whole flock up. They take off, circle once and land over ~7 s,
    staggered by up to FLY_STAGGER so they do not all go at once. */
function pigeonsTakeOff(){
  sfx('pigeons');
  for (const p of pigeons){
    if (p.fly !== 0){
      /* Already up: a second shake, a fire, a click or a firework only adds a
         little to its remaining flight. It never touches its position, its
         phase or its path, so there is nothing left to jump. */
      p.ext = Math.min((p.ext || 0) + 0.25, 1.2);
      continue;
    }
    // a negative fly means "launched, but still walking for a moment"
    p.fly = -rr(0, FLY_STAGGER);
    p.ext = 0;
    // clamped to the front half, so the climb out and the whole circle stay in
    // front of the building rather than starting behind it
    p.flyAng = clamp(Math.atan2(p.hz, p.hx) + rr(-0.4, 0.4), 0.3, Math.PI - 0.3);
    p.flyR = 8.4 + rr(-0.4, 1.2);
    p.flyY = PLAZA_Y + 2.4 + rr(0, 1.6);
    // the take-off climb eases from where it stands out to the circle
    p.upX = p.hx; p.upZ = p.hz;
    p.circX0 = Math.cos(p.flyAng) * p.flyR;
    p.circZ0 = Math.sin(p.flyAng) * p.flyR;
    p.landX = null; p.landZ = null;
    p.landDir = p.dir;
  }
}

/* ---------- per-frame behaviour ---------- */
const _pq = new THREE.Quaternion();
const _pp = new THREE.Vector3(), _ps = new THREE.Vector3();
const _pm = new THREE.Matrix4();
const _pw = new THREE.Matrix4(), _pr = new THREE.Matrix4();
const _pqW = new THREE.Quaternion(), _pqR = new THREE.Quaternion();
const _pqM = new THREE.Matrix4();   // a Quaternion has no .elements, so it
                                    // has to become a Matrix4 to be multiplied
const _paxY = new THREE.Vector3(0, 1, 0), _paxZ = new THREE.Vector3(0, 0, 1);
const _lajP = new THREE.Vector3();

/* The body geometry has its BEAK on local +Z, so a bird walking along
   (cos dir, 0, sin dir) needs yaw = 90° − dir: Ry(θ) sends +Z to
   (sin θ, 0, cos θ), which is the heading exactly when θ = 90° − dir. */
function pigeonQuat(dir, roll, out){
  out.setFromAxisAngle(_paxY, Math.PI / 2 - dir);
  _pqR.setFromAxisAngle(_paxZ, roll);
  return out.multiply(_pqR);
}

/* The wing hinges at the SHOULDER: out 0.03 a side, up 0.085, a touch forward.
   Authored at unit scale — the body's own scale carries the rest.
   The bird's axes are: +Z forward (the beak), ±X its sides, +Y up. The wing box
   already lies along ±X, so OPEN needs no sweep at all, and folding means
   turning it about Y until it lies back along the flank — a 70° sweep puts the
   span 160° round from forward. */
const WING_UP = 0.085, WING_OUT = 0.03, WING_FWD = 0.01;
const WING_OPEN_SWEEP = 0;                        // straight out at the side
const WING_FOLD_SWEEP = 70 * Math.PI / 180;       // 160° round from forward
const WING_FOLD_TILT = 12 * Math.PI / 180;        // tucked flat, tip a little down
const WING_LIFT = 0.25, WING_BEAT = 0.55, WING_HZ = 3;

/** Build a wing's world matrix:
      T(pos) · q · T(shoulder) · Ry(sweep) · Rz(flap) · Rx(tilt)
    R_flap turns about the bird's local Z — forward — so the wings beat UP and
    DOWN at its sides instead of spinning like propellers. Right is side +1
    (its box runs along +X), left is side −1 (the box is mirrored along −X,
    not given a negative scale). */
function setWing(im, i, pos, quat, scale, side, sweep, flap, tilt){
  _pw.makeTranslation(pos.x, pos.y, pos.z);
  _pw.multiply(_pqM.makeRotationFromQuaternion(_pqW.copy(quat)));
  _pr.makeTranslation(side * WING_OUT * scale, WING_UP * scale, WING_FWD * scale);
  _pw.multiply(_pr);
  _pr.makeRotationY(side * sweep);
  _pw.multiply(_pr);
  _pr.makeRotationZ(side * flap);
  _pw.multiply(_pr);
  _pr.makeRotationX(-tilt);            // Rx(+) would lift the tip; we want it down
  _pw.multiply(_pr);
  im.setMatrixAt(i, _pw);
}

/* A single continuous potential the birds walk downhill. The market objects
   and the rim are hard walls, the Lajkonik is a soft bump, and a gentle pull
   toward the open plaza guarantees there is ALWAYS a way down, so greedy
   descent can never stall and no bird ever needs rescuing. */
const PIGEON_TARGET_X = 0, PIGEON_TARGET_Z = 3.2;
/** Inside the szopka's ground-tier box, plus a margin? Nothing flies through
    it and nothing stands in it. (overSzopka further down is the same test with
    a fixed 0.1 margin, so it reads the position and the tier size directly.) */
function inSzopkaBox(x, z, m){
  return Math.abs(x - szopka.position.x) < GT_W / 2 + m &&
         Math.abs(z - szopka.position.z) < GT_D / 2 + m;
}
/** Would the straight run from a to b pass through something solid? The flight
    plan asks this before it lets a bird glide, because a glide is a straight
    line and a straight line through the building is how they ended up on the
    dragon's face. */
function pigeonPathClear(x0, z0, x1, z1, m){
  for (let i = 0; i <= 14; i++){
    const k = i / 14;
    const x = x0 + (x1 - x0) * k, z = z0 + (z1 - z0) * k;
    if (inSzopkaBox(x, z, m)) return false;
    if (inMarketObject(x, z, m * 0.6)) return false;
  }
  return true;
}
/** The shortest signed turn from one angle to another. */
function angTo(from, to){
  let d = (to - from) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
/** Where a bird is allowed to stand. The open plaza in front of the szopka,
    where they have always walked, and now the whole right-hand flank of the
    island as well — round the tower, past the bench — and the back-left strip
    where the hay now stands. */
function pigeonWalkArea(x, z){
  /* No band below may put a bird in the building. The right-hand one used to
     reach x 3.4, which is two units inside the wall. */
  if (inSzopkaBox(x, z, 0.3)) return false;
  if (x >= -6.9 && x <= 6.9 && z >= 1.9 && z <= 6.1) return true;
  if (x >= 3.40 && x <= 8.30 && z >= -6.20 && z <= 1.10) return true;
  if (x >= -2.60 && x <= 0.30 && z >= -6.30 && z <= -4.60) return true;
  return false;
}
/** A point to sample for a walking bird: 0 plaza, 1 right flank, 2 back strip. */
function pigeonAreaPoint(area){
  if (area === 1) return [rr(3.5, 8.2), rr(-6.1, 1.0)];
  if (area === 2) return [rr(-2.5, 0.2), rr(-6.2, -4.7)];
  return [rr(-6.6, 6.6), rr(2.1, 5.9)];
}
function pigeonPhi(x, z, lajX, lajZ){
  let s = 0;
  // the far side of the edge of the walkable area is a wall, so the greedy
  // descent that drives the flock turns away from it on its own
  if (!pigeonWalkArea(x, z)) s += 8;
  if (inMarketObject(x, z, 0.30)) s += 3;
  if (inSzopkaBox(x, z, 0.35)) s += 3;
  if (!overRockTop(x, z, 0.4))   s += 3;
  s += 1.2 * Math.max(0, 0.8 - Math.hypot(x - lajX, z - lajZ)) / 0.8;
  s += 0.05 * Math.hypot(x - PIGEON_TARGET_X, z - PIGEON_TARGET_Z);
  return s;
}
function pigeonBlocked(x, z, lajX, lajZ){
  return !pigeonWalkArea(x, z) || inMarketObject(x, z, 0.30) ||
         !overRockTop(x, z, 0.4) ||
         Math.hypot(x - lajX, z - lajZ) < 0.7 ||
         inSzopkaBox(x, z, 0.3);
}
/** Somewhere clear to stand, used when choosing where a bird comes down. */
function pigeonFreeSpot(){
  for (let i = 0; i < 40; i++){
    // roughly one bird in four comes down on the right-hand side, by the bench
    const pt = pigeonAreaPoint(i % 3);
    const x = pt[0], z = pt[1];
    if (!overRockTop(x, z, 0.5)) continue;
    if (inSzopkaBox(x, z, 0.4)) continue;
    if (inMarketObject(x, z, 0.45)) continue;
    if (Math.hypot(x - lajkonik.position.x, z - lajkonik.position.z) < 1.0) continue;
    return [x, z];
  }
  return [PIGEON_TARGET_X, PIGEON_TARGET_Z];
}

/* ---- the four flight phases, over ~7 s ---------------------------------
     0.0-0.8  take-off   a steep climb out of the plaza, beating fast
     0.8-4.5  circle     one lap of the szopka at mid height
     4.5-6.4  descent    the spot is chosen at 4.5 s, then a smooth eased curve
                         down onto it — gliding, beating only in short bursts
     6.4-7.0  touch-down a flare with the wings up and the body tilted back, a
                         small hop on contact, then the wings fold
   Birds are staggered by up to 1.2 s so the flock does not land as one block.
   p.fly counts up from 0; it starts NEGATIVE so a staggered bird is still
   walking the plaza for a moment before it leaves the ground. */
const FLY_TAKE = 0.8, FLY_CIRCLE = 4.5, FLY_FRONT = 5.5, FLY_DOWN = 7.0, FLY_END = 7.6;
const FLY_SPAN = FLY_CIRCLE - FLY_TAKE;
const FLY_TRANSIT = FLY_FRONT - FLY_CIRCLE;
const FLY_STAGGER = 1.2;
/* Top flight speed, used only as the per-frame safety clamp. The circle runs
   at about 9 u/s, so this never bites the normal animation. */
const PIGEON_MAX_SPEED = 16;
/** Choose where this bird will come down, clear of everything, and plan how it
    gets there. A straight glide from the circle to the spot is used whenever it
    is clear; if it would cut through the szopka the bird first flies round to a
    staging point directly BEHIND its landing spot — i.e. out in the open plaza —
    and drops in from there, so the final short run never enters the building. */
function pigeonPickLanding(p){
  p.landX = null;
  for (let a = 0; a < 30; a++){
    const pt = pigeonAreaPoint(a % 3);
    const nx = pt[0], nz = pt[1];
    if (!overRockTop(nx, nz, 0.5)) continue;
    if (pigeonBlocked(nx, nz, lajkonik.position.x, lajkonik.position.z)) continue;
    p.landX = nx; p.landZ = nz;
    break;
  }
  if (p.landX === null){
    const f = pigeonFreeSpot();
    p.landX = f[0]; p.landZ = f[1];
  }
  const fromX = Math.cos(p.flyAng) * p.flyR, fromZ = Math.sin(p.flyAng) * p.flyR;
  p.fromX = fromX; p.fromZ = fromZ;
  p.fromY = PLAZA_Y + p.flyY;
  if (pigeonPathClear(fromX, fromZ, p.landX, p.landZ, 0.30)){
    // already clear: the staging point IS the end of the circle
    p.stageX = fromX; p.stageZ = fromZ;
    p.stageAng = p.flyAng; p.stageR = p.flyR; p.angDelta = 0;
  } else {
    p.stageX = p.landX;
    p.stageZ = p.landZ + 1.3;
    for (let d = 1.3; d <= 2.5; d += 0.4){
      p.stageZ = p.landZ + d;
      if (pigeonPathClear(p.landX, p.stageZ, p.landX, p.landZ, 0.18)) break;
    }
    p.stageAng = Math.atan2(p.stageZ, p.stageX);
    p.stageR = Math.hypot(p.stageX, p.stageZ);
    p.angDelta = angTo(p.flyAng, p.stageAng);
  }
  p.landDir = Math.atan2(p.landZ - p.stageZ, p.landX - p.stageX);
}

function updatePigeons(dt){
  pigeons.flying = pigeons.some(p => p.fly > 0);
  for (let i = 0; i < pigeons.length; i++){
    const p = pigeons[i];
    /* A bird still walking in the queue has moved since its trigger arrived,
       so the climb is re-anchored on the frame it leaves the ground. Without
       this it snaps back to a spot up to 1.2 s stale — the 1.9-unit jump. */
    if (p.fly > 0 && p.fly - dt <= 0){
      p.upX = p.hx; p.upZ = p.hz;
      p.circX0 = Math.cos(p.flyAng) * p.flyR;
      p.circZ0 = Math.sin(p.flyAng) * p.flyR;
      p.landX = null; p.landZ = null;
    }
    if (p.fly !== 0) p.fly += dt;
    /* px/py/pz are where this bird actually WAS last frame — its world
       position, which while it flies is nothing like the hx/hz it last stood
       on. The speed clamp at the end of the loop needs the former. */
    const wasX = p.px, wasY = p.py, wasZ = p.pz;
    let x = p.hx, z = p.hz, y = PLAZA_Y, dir = p.dir, roll = 0, hop = 0;
    let wSweep = WING_FOLD_SWEEP, wFlap = 0, wTilt = WING_FOLD_TILT;
    if (p.fly > 0){
      const T = p.fly;
      if (T < FLY_TAKE + p.ext){
        /* take-off — a steep climb from the spot it was standing on out to the
           circle, urgent beat. It eases from the bird's own ground position to
           the exact point the circle phase starts at, so there is no jump. */
        const k = clamp(T / FLY_TAKE, 0, 1);
        const eh = k * k * k;                       // accelerates out of the spot
        const ev = easeOutCubic(k);                 // lifts off straight away
        x = lerp(p.upX, p.circX0, eh);
        z = lerp(p.upZ, p.circZ0, eh);
        y = PLAZA_Y + ev * p.flyY * 0.6;
        dir = p.flyAng + Math.PI / 2;
        roll = Math.sin(T * 18) * 0.3;
        wSweep = WING_OPEN_SWEEP; wTilt = 0;
        wFlap = 0.35 + Math.sin(T * TAU * 6) * 0.75;
      } else if (T < FLY_CIRCLE + p.ext){
        /* circle — one lap, steady */
        p.flyAng += dt * (TAU / FLY_SPAN);
        const k = (T - FLY_TAKE - p.ext) / FLY_SPAN;
        x = Math.cos(p.flyAng) * p.flyR;
        z = Math.sin(p.flyAng) * p.flyR;
        y = PLAZA_Y + p.flyY * (0.6 + k * 0.4);
        dir = p.flyAng + Math.PI / 2;                 // the tangent
        roll = Math.sin(T * 6 + p.seed) * 0.3;
        wSweep = WING_OPEN_SWEEP; wTilt = 0;
        wFlap = WING_LIFT + Math.sin(T * TAU * WING_HZ + p.seed) * WING_BEAT;
      } else if (T < FLY_FRONT + p.ext){
        /* transit — the spot and the approach are settled on the first frame of
           this phase. A bird whose glide was already clear just holds the end
           of its circle, so the handover is seamless; a bird that would have
           flown through the building swings round at the circle's radius — which
           clears the corner — and then comes in to its staging point in the
           open plaza. */
        if (p.landX === null) pigeonPickLanding(p);
        const kt = clamp((T - FLY_CIRCLE - p.ext) / FLY_TRANSIT, 0, 1);
        if (p.angDelta === 0){
          x = p.fromX; z = p.fromZ;
          dir = p.flyAng + Math.PI / 2;
        } else {
          const a = p.flyAng + p.angDelta * easeInOutCubic(clamp(kt * 2, 0, 1));
          const r = lerp(p.flyR, p.stageR, easeInOutCubic(clamp(kt * 2 - 1, 0, 1)));
          x = Math.cos(a) * r; z = Math.sin(a) * r;
          const h = x - p.fromX, g = z - p.fromZ;
          dir = (h * h + g * g > 1e-8) ? Math.atan2(g, h) : p.flyAng + Math.PI / 2;
        }
        y = p.fromY;
        roll = Math.sin(T * 6 + p.seed) * 0.22;
        wSweep = WING_OPEN_SWEEP; wTilt = 0;
        wFlap = WING_LIFT + Math.sin(T * TAU * WING_HZ + p.seed) * WING_BEAT;
      } else if (T < FLY_DOWN + p.ext){
        /* descent — a glide out of the staging point into the spot. Because the
           staging point is either the end of the circle or out in the open
           plaza behind the spot, this run never enters the szopka. */
        const k = easeInOutCubic(clamp((T - FLY_FRONT - p.ext) / (FLY_DOWN - FLY_FRONT), 0, 1));
        x = lerp(p.stageX, p.landX, k);
        z = lerp(p.stageZ, p.landZ, k);
        y = lerp(p.fromY, PLAZA_Y, k);
        const h = x - p.stageX, g = z - p.stageZ;
        dir = (h * h + g * g > 1e-8) ? Math.atan2(g, h) : p.landDir;
        roll = (PLAZA_Y - y) * 0.12;                  // nose down on the glide
        wSweep = WING_OPEN_SWEEP; wTilt = 0;
        const burst = Math.max(0, Math.sin(T * TAU * 1.1 + p.seed));
        wFlap = WING_LIFT - 0.12 + burst * 0.1 + (burst > 0.62 ? 0.5 : 0);
      } else {
        /* touch-down — flare, settle, fold up and walk on. This is the
           catch-all for everything past FLY_DOWN: k clamps at 1, so the
           landing always completes instead of stranding the bird in a phase
           that no longer matches. */
        const k = clamp((T - FLY_DOWN - p.ext) / (FLY_END - FLY_DOWN), 0, 1);
        const e = easeOutCubic(k);
        x = p.landX; z = p.landZ;
        y = PLAZA_Y + (1 - e) * 0.07 - Math.max(0, Math.sin(k * Math.PI)) * 0.06;
        dir = p.landDir;
        roll = (1 - k) * 0.45;                        // tail down, nose up
        wSweep = lerp(WING_OPEN_SWEEP, WING_FOLD_SWEEP, e);
        wTilt = lerp(0, WING_FOLD_TILT, e);
        wFlap = lerp(0.62, 0, e);
        if (k >= 1){
          p.fly = 0; p.landX = null;
          p.hx = x; p.hz = z; p.lastX = x; p.lastZ = z;
          /* clear */
          hop = 0.02;                                  // the hop on contact
        }
      }
    } else {
      // walk about in little hops, and peck at the ground now and then
      p.dir += Math.sin(t * 0.5 + p.seed) * dt * 0.7;   // a soft curve, not a weave
      const spd = 0.5 + Math.sin(t * 0.7 + p.seed * 2) * 0.28;
      const lajX = lajkonik.position.x, lajZ = lajkonik.position.z;
      let nx = p.hx + Math.cos(p.dir) * spd * dt;
      let nz = p.hz + Math.sin(p.dir) * spd * dt;
      // the walk reaches round to the right shoulder now, so the two hard
      // clamps are gone; being off the area is handled as a blocked step, and
      // pigeonPhi's penalty makes the 16-direction search turn back inboard
      const offArea = !pigeonWalkArea(nx, nz);
      if (offArea){ nx = p.hx; nz = p.hz; }
      if (offArea || pigeonBlocked(nx, nz, lajX, lajZ)){
        /* Blocked. Take whichever step — in any of 16 directions, at full or
           half length — lowers the potential most, and keep his heading. The
           potential always has a way down, so this always makes progress and
           a bird can never end up whirring on the spot. */
        const here = pigeonPhi(p.hx, p.hz, lajX, lajZ);
        let bestA = p.dir, bestSt = 0, bestS = here;
        for (const mul of [1, 0.5]){
          const st = spd * 1.5 * mul * dt;
          for (let k = 0; k < 16; k++){
            const a = (k / 16) * TAU;
            const cx = p.hx + Math.cos(a) * st, cz = p.hz + Math.sin(a) * st;
            const s = pigeonPhi(cx, cz, lajX, lajZ);
            if (s < bestS - 1e-6){ bestS = s; bestA = a; bestSt = st; }
          }
        }
        if (bestSt > 0){
          p.hx += Math.cos(bestA) * bestSt;
          p.hz += Math.sin(bestA) * bestSt;
          p.lastX = p.hx; p.lastZ = p.hz; p.dir = bestA;
        } else {
          p.hx = p.lastX; p.hz = p.lastZ;
        }
      } else {
        p.hx = nx; p.hz = nz; p.lastX = nx; p.lastZ = nz;
      }
      p.hop += dt * p.hopRate;
      hop = Math.max(0, Math.sin(p.hop * Math.PI)) * 0.035;
      p.peck += dt;
      if (p.peck > 2.6){ p.peck = 0; p.peckT = 0.9; }
      if (p.peckT > 0) p.peckT -= dt;
      x = p.hx; z = p.hz; y = PLAZA_Y + hop;
      dir = p.dir;
      wFlap = Math.min(hop / 0.035, 1) * 0.15;   // barely lifts on a hop
    }
    /* Safety net: no bird may cover more than its top speed in one frame,
       whatever a phase handover does. The circle itself runs at about 9 u/s,
       so 16 leaves the real animation untouched and only catches a handover
       that has gone wrong. Measured from where the bird was LAST FRAME, so
       this pulls it back along its own path rather than towards the spot it
       happens to have last stood on. */
    {
      const dx = x - wasX, dy = y - wasY, dz = z - wasZ;
      const d = Math.hypot(dx, dy, dz);
      const cap = PIGEON_MAX_SPEED * dt;
      if (d > cap && d > 1e-6){
        const k = cap / d;
        x = wasX + dx * k; y = wasY + dy * k; z = wasZ + dz * k;
      }
    }
    p.px = x; p.py = y; p.pz = z;
    const s = p.scale;
    pigeonQuat(dir, roll, _pq);
    _pp.set(x, y, z);
    _ps.set(s, s, s);
    _pm.compose(_pp, _pq, _ps);
    pigeonBody.setMatrixAt(i, _pm);
    setWing(pigeonWingR, i, _pp, _pq, s,  1, wSweep, wFlap, wTilt);
    setWing(pigeonWingL, i, _pp, _pq, s, -1, wSweep, wFlap, wTilt);
  }
  pigeonBody.instanceMatrix.needsUpdate = true;
  pigeonWingL.instanceMatrix.needsUpdate = true;
  pigeonWingR.instanceMatrix.needsUpdate = true;
}

function updateLajkonik(dt){
  laj.bobT += dt;
  lajPointAt(laj.u, _lajP);
  // every 10-15 s he stops for a playful spin on the spot
  laj.nextSpin -= dt;
  if (laj.nextSpin <= 0 && laj.spinT <= 0 && laj.tap <= 0){
    laj.spinT = 1.5;
    laj.nextSpin = rr(10, 15);
  }
  if (laj.tap > 0){
    // the good-luck tap: a happy jump-and-spin, the mace beating the air
    laj.tap -= dt;
    const k = 1 - laj.tap / 1.4;
    laj.spin = k * TAU * 1.5;
    showCaption('lajkonik');
  } else if (laj.spinT > 0){
    laj.spinT -= dt;
    laj.spin += dt * 9.0;
    if (laj.spinT <= 0) laj.spin = 0;
  } else {
    laj.spin = 0;
    /* He never enters the dragon's fire corridor while the dragon is breathing
       fire. The lane is 4 units wide along his path and the flame lasts 0.95 s,
       so backing off at his normal pace would not clear it in time — he has to
       skitter back at roughly 8x his walking speed, which reads as a hop back.
       Either he is already in the lane (or about to be) and retreats, or he
       stands clear and waits the flame out. */
    if (fire.t >= 0 && fire.t < 1.0){
      if (Math.abs(_lajP.x) < FIRE_X + 0.6 && lajWouldCrossCorridor(laj.u, 0.012)){
        laj.u -= dt * 0.18;
        laj.wait = 0.5;
      } else {
        laj.wait = 0.5;
      }
    } else if (laj.wait > 0){
      laj.wait -= dt;
    } else {
      laj.u += dt * 0.021;
    }
    lajPointAt(laj.u, _lajP);
  }
  lajkonik.position.set(_lajP.x, PLAZA_Y, _lajP.z);
  lajkonik.rotation.y = -laj.spin;

  // a bouncy, dancing gait
  const stride = Math.sin(laj.bobT * 7.4);
  laj.wobble = lerp(laj.wobble, shake.t >= 0 ? 1 : 0, 1 - Math.exp(-dt * 6));
  // during a shake he wobbles and keeps his balance with a little hop
  const hop = Math.max(0, Math.sin(laj.bobT * 7.4)) * 0.075
            + laj.wobble * Math.abs(Math.sin(laj.bobT * 11)) * 0.05;

  // the caparison and the horse head share one frame, so the hop lifts both
  lajParts.body.position.y = 0.02 + hop * 0.5;
  lajParts.body.rotation.z = stride * 0.035;
  lajParts.body.rotation.x = -stride * 0.02;
  lajParts.skirtRear.rotation.z = -stride * 0.03;
  lajParts.horse.position.y = 0.72 + hop * 0.5;
  lajParts.horse.rotation.x = stride * 0.09;
  lajParts.horse.rotation.z = Math.sin(laj.bobT * 7.4 + 0.6) * 0.05;
  lajParts.head.position.y = 1.42 + hop;
  lajParts.head.rotation.x = -stride * 0.05;
  lajParts.plume.rotation.z = Math.sin(laj.bobT * 5.1) * 0.28 - stride * 0.15;
  lajParts.plume.rotation.x = Math.sin(laj.bobT * 4.2 + 1.1) * 0.2;
  lajParts.tail.rotation.z = Math.sin(laj.bobT * 4.6) * 0.3;
  lajParts.hat.rotation.z = stride * 0.06 + laj.wobble * Math.sin(laj.bobT * 9) * 0.22;
  lajParts.hat.rotation.x = -laj.wobble * Math.sin(laj.bobT * 8.3) * 0.16;
  lajParts.armR.rotation.x = -stride * 0.5 - 0.2;
  lajParts.armR.rotation.z = 0.3 + Math.sin(laj.bobT * 7.4 + 0.4) * 0.25;
  lajParts.armL.rotation.x = stride * 0.3;
  lajParts.armL.rotation.z = -0.18 - Math.sin(laj.bobT * 7.4 + 0.4) * 0.18;
  if (laj.tap > 0){
    const k = 1 - laj.tap / 1.4;
    lajParts.armR.rotation.x = -1.9 + Math.sin(k * Math.PI * 6) * 0.5;
    lajParts.mace.rotation.z = Math.sin(k * Math.PI * 8) * 1.2;
    lajParts.horse.position.y = 0.72 + hop * 0.5
      + Math.max(0, Math.sin(k * Math.PI * 2)) * 0.22;
  }

  // the gold sparks bursting from the mace
  let anySpark = false;
  for (const p of lajGoldSparks){
    if (p.life > 0){
      anySpark = true;
      p.life -= dt;
      p.vel.y -= 3.2 * dt;
      p.sp.position.addScaledVector(p.vel, dt);
      p.sp.material.opacity = clamp(p.life / p.max, 0, 1);
      p.sp.scale.setScalar(0.1 + (1 - p.life / p.max) * 0.09);
      if (p.life <= 0){ p.sp.material.opacity = 0; p.sp.visible = false; }
    }
  }
  lajGoldSparks.group.visible = anySpark;

  // trample the snow he walks over, leaving a track; none settles on him
  if (state.snowTarget > 0.5){
    for (let i = mounds.length - 1; i >= 0; i--){
      const m = mounds[i];
      if (m.roof !== null) continue;
      const dx = m.x - _lajP.x, dz = m.z - _lajP.z;
      if (dx * dx + dz * dz < 0.13) mounds.splice(i, 1);
    }
  }
  // his travelling lamp: dark by day, a soft warm pool at night
  lajLamp.intensity = lerp(LAJ_LAMP_DAY, LAJ_LAMP_NIGHT, state.night);

  laj.x = _lajP.x; laj.z = _lajP.z;
}

/** Click the Lajkonik: the good-luck tap. */

  if (laj.tap > 0) return;
  laj.tap = 1.4;
  burstLajkonikSparks();
  sfx('sparkle');
  sfx('lajkonik');
  pigeonsTakeOff();
}

/* ---- his behaviour ---- */
const sweepAnim = {
  lower: 0, nextLower: 6, lowering: 0,
  wave: 0, nextWave: 16,
  hatTip: 0, wobble: 0, grab: 0,
};
function updateSweep(dt){
  const A = sweepAnim;
  // every ~15 s he lowers the ball and brush into the chimney, hand over hand
  A.nextLower -= dt;
  if (A.nextLower <= 0 && A.lowering === 0 && A.hatTip <= 0){
    A.lowering = 1;
    A.nextLower = rr(12, 18);
  }
  if (A.lowering > 0){
    A.lower += dt / 1.5;
    if (A.lower >= 1){ A.lower = 0; A.lowering = -1; puffSoot(); }
    else if (A.lower > 0.02 && A.lower < 0.06) puffSoot();
  } else if (A.lowering < 0){
    A.lower -= dt / 1.5;
    if (A.lower <= 0) A.lowering = 0;
  }
  /* The chain swings about his fist. The chimney stands off to his left, which
     in his own frame is +X, so the dip is a rotation about Z; at 1.35 rad the
     brush head lands inside the flue and the rope never parts company with the
     ball or the fist. */
  const dip = A.lower > 0 ? easeInOutCubic(clamp(A.lower, 0, 1))
             : A.lowering < 0 ? easeInOutCubic(clamp(1 + A.lower, 0, 1)) : 0;
  sweepParts.rope.rotation.z = dip * 1.35;
  sweepParts.rope.rotation.x = dip * 0.15 + Math.sin(t * 1.4) * 0.025;
  // now and then he waves at you
  A.nextWave -= dt;
  if (A.nextWave <= 0 && A.wave <= 0 && A.hatTip <= 0 && dip < 0.05){
    A.wave = 1.4;
    A.nextWave = rr(18, 30);
  }
  if (A.wave > 0){
    A.wave -= dt;
    const w = Math.sin(t * 9) * 0.7 + 0.35;
    sweepParts.armWave.rotation.z = -1.9 + w * 0.35;
    sweepParts.armWave.rotation.x = -0.2 - w * 0.3;
    // the forearm folds and unfolds as the shoulder swings; only the elbow moves
    sweepParts.armWaveElbow.rotation.x = -0.55 - w * 0.45;
  } else {
    sweepParts.armWave.rotation.z = lerp(sweepParts.armWave.rotation.z, -0.1, 0.1);
    sweepParts.armWave.rotation.x = lerp(sweepParts.armWave.rotation.x, 0.1, 0.1);
    sweepParts.armWaveElbow.rotation.x = lerp(sweepParts.armWaveElbow.rotation.x, -0.30, 0.1);
  }
  // a click: he tips his hat
  if (A.hatTip > 0){
    A.hatTip = Math.max(0, A.hatTip - dt / 0.9);
    const k = 1 - A.hatTip / 0.9;
    sweepParts.hat.rotation.x = -Math.sin(k * Math.PI) * 0.55;
    sweepParts.hat.position.z = Math.sin(k * Math.PI) * 0.02;
  } else {
    sweepParts.hat.rotation.x = lerp(sweepParts.hat.rotation.x, 0, 0.12);
    sweepParts.hat.position.z = lerp(sweepParts.hat.position.z, 0, 0.12);
  }
  // the shake: he grabs the chimney and wobbles
  A.wobble = lerp(A.wobble, shake.t >= 0 ? 1 : 0, 1 - Math.exp(-dt * 7));
  if (A.wobble > 0.01){
    // he grabs the chimney with his free hand and wobbles with the rock
    sweepParts.armWave.rotation.z = -1.75 + Math.sin(t * 13) * 0.3 * A.wobble;
    sweepParts.armWave.rotation.x = -0.5 + Math.sin(t * 9) * 0.12 * A.wobble;
    // braced against the brick, so the elbow straightens as he grabs on
    sweepParts.armWaveElbow.rotation.x = -0.12;
    sweep.rotation.z = Math.sin(t * 11) * 0.1 * A.wobble;
    sweepParts.head.rotation.z = Math.sin(t * 14) * 0.16 * A.wobble;
    sweepParts.rope.rotation.x += Math.sin(t * 12) * 0.09 * A.wobble;
  } else {
    sweep.rotation.z = lerp(sweep.rotation.z, 0, 0.1);
    sweepParts.head.rotation.z = lerp(sweepParts.head.rotation.z, 0, 0.1);
    sweepParts.armWaveElbow.rotation.x = lerp(sweepParts.armWaveElbow.rotation.x, -0.30, 0.1);
  }
  // the rope arm just holds: a small idle bend so it is not a dead straight tube
  sweepParts.armRopeElbow.rotation.x = -0.34 + Math.sin(t * 1.6) * 0.05;
  // he breathes, and bobs a little when he is working
  sweepParts.head.position.y = 0.78 + Math.sin(t * 1.7) * 0.006 + dip * 0.01;
  // the soot puffs
  let anySoot = false;
  for (const p of sweepSoot.list){
    if (p.life <= 0) continue;
    anySoot = true;
    p.life -= dt;
    p.vel.y += 0.12 * dt;
    p.sp.position.addScaledVector(p.vel, dt);
    p.sp.material.opacity = clamp(p.life / p.max, 0, 1) * 0.5;
    p.sp.scale.setScalar(0.07 + (1 - p.life / p.max) * 0.1);
    if (p.life <= 0){ p.sp.visible = false; p.sp.material.opacity = 0; }
  }
  sweepSoot.pool.visible = anySoot;
  // and the gold sparkles off his buttons
  let anySpark = false;
  for (const p of sweepSparks.list){
    if (p.life <= 0) continue;
    anySpark = true;
    p.life -= dt;
    p.vel.y -= 2.6 * dt;
    p.sp.position.addScaledVector(p.vel, dt);
    p.sp.material.opacity = clamp(p.life / p.max, 0, 1);
    if (p.life <= 0){ p.sp.visible = false; p.sp.material.opacity = 0; }
  }
  sweepSparks.pool.visible = anySpark;
}

}

/* ======================================================================
   9f · THE HIGHLAND SHEEP (owca)
   The clear 0.8 x 0.8 patch beside the oscypek stall. Same glossy vinyl-toy
   family as the dragon: a bubble-wool body, a brown face framed by a wool hood
   and beard, gold curled horns, leaf ears, gold ball hooves and a bell on a red
   collar. Parented to marketGroup, so it rides the island's float and shake.

   Authored in SHEEP-LOCAL units where H = 1 is the total height, feet on y = 0
   and +Z the sheep's front; the group is then scaled to SHEEP_H.
   ====================================================================== */
const SHEEP_H = 1.05;                 // finished height, feet on the plaza
const SHEEP_UNIT_H = 0.931;            // the authored model's own height
/* She has moved round to the dragon's side of the plaza, standing just in
   front of the Christmas tree (2.75, 1.80) — the Wawel legend, where a sheep
   got the better of the dragon. x is 2.72 rather than 2.6 because her
   footprint is a 0.5 x 0.5 rectangle TURNED 25 degrees, so its near corner
   reaches 0.664 across: at 2.6 that corner sat at |x| 1.986, a hundredth of a
   unit inside the fire corridor's |x| < 2.0. At 2.72 the nearest point is
   2.056. z is 3.35 so her padded footprint also clears the oscypek stall's by
   0.13 instead of touching it. The rotation only turns her a quarter of the way
   toward the cave, so the default camera still sees her face. */
const SHEEP_X = 2.72, SHEEP_Z = 3.35;
const SHEEP_ROT = -0.436;                    // ~25 degrees toward the cave
/* The wool InstancedMesh is shared by every sheep on the island, so its
   material is white and each instance carries its own tint; the solid cream
   fillers behind the cloud need a real material each, one per sheep. */
const SHEEP_MAT = {
  woolIM: new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08,
  }),
  brown: new THREE.MeshPhysicalMaterial({
    color: 0x7A5A4A, roughness: 0.3, clearcoat: 1,
  }),
  collar: cardboard(0xB3203A),
};
/** One sheep. Authored in SHEEP-LOCAL units where H = 1 is the total height and
    feet sit on y = 0; the group is scaled to SHEEP_H on the way out.
      o.tint     cream to warm off-white, as a hex number
      o.scale    a lamb is 0.6
      o.bell     only the adults are collared
      o.legs     false tucks her away, for the one lying down
      o.headY/headZ/headX   where the head hangs — down at the grass, for the grazer
      o.woolMul  how many bubbles to spend; the flock get fewer and lean on
                 their cream filler more
    The wool spheres come back in sheep-LOCAL coordinates and are baked into
    the one shared InstancedMesh by buildSheepWool(). */
function buildSheep(o){
  const sheep = new THREE.Group();
  const sheepParts = {};
  const SHEEP_MESHES = [];
  const sheepWool = [];
  {
  const H = 1;                              // authored at unit height, scaled below
  sheep.scale.setScalar(SHEEP_H / SHEEP_UNIT_H * (o.scale || 1));
  /* ---- materials ---- */
  const woolCream = new THREE.MeshPhysicalMaterial({
    color: o.tint, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08,
  });
  const brownVinyl = SHEEP_MAT.brown;
  const collarRed = SHEEP_MAT.collar;
  // the dragon's gold, eyes and highlight, reused rather than remade
  const gold = dragonMaterials[1], eyeM = dragonMaterials[2], hiM = dragonHiMat;
  const sball = (r) => new THREE.SphereGeometry(r, 32, 24);
  /* a seeded generator, so the wool cloud is identical on every load */
  const seeded = (seed) => {
    let s = seed >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  };
  const R = seeded(o.seed);
  const M = o.woolMul || 1;                 // how many bubbles this one gets
  const add = (m) => { m.castShadow = true; m.receiveShadow = true; sheep.add(m); SHEEP_MESHES.push(m); return m; };

  /* ---- what no wool sphere may sit in front of ----
     This used to be the whole face ellipse, which forbade anything over the
     brow — but the brow is exactly where the fringe has to hang. It now keeps
     out the eye band only: the eyes are 0.034 x 0.054 and sit at y 0.645, so
     a 0.118 x 0.058 box round that centre clears them and lets the fringe
     come down to just above them. */
  const FACE = { y: 0.635, z: 0.155, rx: 0.15, ry: 0.132 };
  const EYE = { x: 0.076, y: 0.645, hx: 0.118, hy: 0.058 };
  const blocksFace = (x, y, z) =>
    z > FACE.z - 0.02 && Math.abs(x) < EYE.hx && Math.abs(y - EYE.y) < EYE.hy;

  /* ---- 1 · HOOVES and 2 · LEGS: skipped entirely for the one lying down,
     which rests her body straight on the ground ---- */
  if (o.legs !== false){
    for (const [hx, hz] of [[0.13, 0.08], [-0.13, 0.08], [0.12, -0.10], [-0.12, -0.10]]){
      const hoof = new THREE.Mesh(sball(0.06), gold);
      hoof.position.set(hx, 0.055, hz);
      add(hoof);
    }
    for (const [lx, lz] of [[0.13, 0.08], [-0.13, 0.08], [0.12, -0.10], [-0.12, -0.10]]){
      const legH = 0.20 - 0.05;
      const leg = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.045, legH - 0.09, 4, 14), brownVinyl);
      leg.position.set(lx, 0.05 + legH / 2, lz);
      add(leg);
    }
  }

  /* ---- 3 · BODY WOOL: a cloud of spheres on an ellipsoid ----
     Sixty spheres, each pushed half its own radius back along the surface
     normal so neighbours bite into each other rather than meeting at a point.
     At forty-five and a 0.4 push the cloud left bare patches on the shoulders
     and along the spine whenever the camera came round. */
  const EW = 0.30, EH = 0.24, ED = 0.26, EY = 0.40;
  const nrm = new THREE.Vector3();
  const SINK = 0.5;                                  // of a sphere's own radius
  const THIN_BACK = 0.30;                 // of the rear-half samples are dropped
  for (let i = 0, N = Math.round(62 * M); i < N; i++){
    const u = R(), v = R();
    const ph = Math.acos(1 - 2 * u);
    const th = v * TAU;
    const dx = Math.sin(ph) * Math.cos(th), dy = Math.cos(ph), dz = Math.sin(ph) * Math.sin(th);
    // the back hump was carrying nearly half the cloud and read as a lop;
    // a third of it goes, and the spheres land on the chest instead
    if (dz < 0 && R() < THIN_BACK) continue;
    // bigger low down and round the sides, smaller up on the crown
    const low = clamp(0.5 - dy * 0.5, 0, 1);
    const side = 1 - Math.abs(dy);
    const rad = 0.068 + 0.055 * (0.55 * low + 0.45 * side);
    nrm.set(dx / EW, dy / EH, dz / ED).normalize();
    sheepWool.push({ r: rad,
      x: dx * EW - nrm.x * rad * SINK,
      y: EY + dy * EH - nrm.y * rad * SINK,
      z: dz * ED - nrm.z * rad * SINK });
  }
  /* The spheres that came off the back: a bib under the chin and the fronts of
     the shoulders. blocksFace carves the middle out of it, so it wraps the
     face rather than covering it. */
  for (let i = 0, N = Math.max(8, Math.round(20 * M)); i < N; i++){
    const u = i / (N - 1);
    const a = Math.PI * (0.10 + 0.80 * u);
    const x = -Math.cos(a) * 0.22;
    const y = 0.50 + Math.sin(a) * 0.15;
    const z = 0.13 + 0.055 * Math.sin(a);
    if (blocksFace(x, y, z)) continue;
    sheepWool.push({ r: 0.060 + 0.032 * R(), x, y, z });
  }
  /* and the front of the shoulders */
  for (let i = 0, N = Math.max(5, Math.round(10 * M)); i < N; i++){
    const sx2 = R() < 0.5 ? -1 : 1;
    const x = sx2 * (0.14 + 0.09 * R());
    const y = 0.52 + 0.14 * R();
    const z = 0.09 + 0.10 * R();
    if (blocksFace(x, y, z)) continue;
    sheepWool.push({ r: 0.062 + 0.028 * R(), x, y, z });
  }
  // the solid core, so there are no gaps to see through the cloud
  const core = new THREE.Mesh(sball(1), woolCream);
  core.scale.set(EW * 0.9, EH * 0.9, ED * 0.9);
  core.position.y = EY;
  add(core);

  /* ---- 5 · HEAD WOOL "CAP": over the whole top of the head, with a fringe
     over the brow. It used to be an arc centred at z 0.02 while the head sits
     at z 0.155, so the whole cap was a third of a unit behind the skull and
     the brown showed over the top from any angle above the eyeline.
     HEAD_Z puts it back on the head; the filler's top at y 0.85 swallows the
     face's own top at 0.767, so there is no brown left up there at all. ---- */
  const HEAD_Z = 0.075;
  {
    const capFill = new THREE.Mesh(sball(1), woolCream);
    capFill.scale.set(0.185, 0.185, 0.170);
    capFill.position.set(0, 0.665, HEAD_Z);
    capFill.castShadow = true; capFill.receiveShadow = true;
    sheep.add(capFill); SHEEP_MESHES.push(capFill);
  }
  // the crown: up over the left side, across the top, down the right
  for (let i = 0, N = Math.max(14, Math.round(26 * M)); i < N; i++){
    const u = i / (N - 1);
    const a = Math.PI * (0.08 + 0.84 * u);
    const x = -Math.cos(a) * 0.178;
    const y = 0.665 + Math.sin(a) * 0.168;
    const z = HEAD_Z - 0.03 * Math.sin(a);
    if (blocksFace(x, y, z)) continue;
    sheepWool.push({ r: 0.062 + 0.036 * R(), x, y, z });
  }
  /* the fringe: a row of wool balls hanging forward over the brow. Their radii
     are small enough that their undersides stop at y 0.70, level with the top
     of the eyes, and the cap filler behind them hides their roots. */
  for (let i = 0, N = Math.max(6, Math.round(10 * M)); i < N; i++){
    const u = i / (N - 1);
    const x = -0.165 + u * 0.33;
    const k = 1 - (x / 0.165) ** 2;                  // 1 in the middle, 0 at the corners
    const y = 0.778 + 0.020 * k;
    const z = HEAD_Z + 0.100 + 0.035 * k;
    if (blocksFace(x, y, z)) continue;
    sheepWool.push({ r: 0.060 + 0.012 * R(), x, y, z });
  }
  // and a thick band wrapping down the back of the head
  for (let i = 0, N = Math.max(6, Math.round(10 * M)); i < N; i++){
    const u = (i + 0.5) / N;
    const a = u * TAU;
    const x = Math.cos(a) * 0.135 * (0.6 + 0.4 * R());
    const y = 0.70 + u * 0.15;
    const z = -0.06 - R() * 0.06;
    if (blocksFace(x, y, z)) continue;
    sheepWool.push({ r: 0.062 + 0.028 * R(), x, y, z });
  }

  /* ---- 6 · BEARD / COLLAR WOOL: a U under the face ---- */
  for (let i = 0, N = Math.max(8, Math.round(14 * M)); i < N; i++){
    const u = i / (N - 1);
    const a = Math.PI * (0.14 + 0.72 * u);          // cheek to cheek
    const rad = 0.155;
    const x = -Math.cos(a) * rad;
    const y = 0.60 - Math.sin(a) * rad * 0.42;
    const z = 0.09 - Math.sin(a) * 0.05;
    if (blocksFace(x, y, z)) continue;
    sheepWool.push({ r: 0.05 + 0.035 * R(), x, y, z });
  }

  /* The bubbles go into the island-wide InstancedMesh in buildSheepWool();
     nothing is created for them here. */

  /* ---- 4 · FACE ---- */
  const head = new THREE.Group();
  // the grazer hangs her head right down in front of her, out of the fleece
  head.position.set(0, o.headY === undefined ? FACE.y : o.headY,
                    o.headZ === undefined ? FACE.z : o.headZ);
  head.rotation.x = o.headX === undefined ? 0.14 : o.headX;
  sheep.add(head);
  sheepParts.head = head;
  const face = new THREE.Mesh(sball(1), brownVinyl);
  face.scale.set(FACE.rx, FACE.ry, 0.105);
  face.castShadow = true; face.receiveShadow = true;
  head.add(face);
  SHEEP_MESHES.push(face);
  /* Tall ovals, not round: the 1.6 tall-to-wide ratio is baked into the
     geometry, so the blink below can drive scale.y from 1 without a base to
     multiply into. No cream rim — the reference has none — and no smile; the
     face is the brown shape and the two eyes. */
  for (const sx of [-1, 1]){
    const ex = sx * 0.076, ey = 0.645 - FACE.y;
    const ez = 0.105 * Math.sqrt(Math.max(0, 1 - (ex / FACE.rx) ** 2 - (ey / FACE.ry) ** 2));
    // Only the first sheep blinks, which is what needs her eyes kept apart;
    // the flock's merge into one mesh per material, sixteen objects cheaper.
    const eye = new THREE.Mesh(
      sball(0.0255).scale(1, 1.6, 0.72), eyeM);      // 0.034 -> 0.0255
    eye.position.set(ex, ey, ez + 0.004);
    eye.castShadow = true;
    head.add(eye); SHEEP_MESHES.push(eye);
    const hi = new THREE.Mesh(sball(0.00825).scale(0.85, 1.25, 0.7), hiM);
    hi.position.set(ex - 0.0068, ey + 0.0255, ez + 0.0165);
    head.add(hi); SHEEP_MESHES.push(hi);
  }

  /* ---- 7 · HORNS: fat gold snails on the front corners of the face ----
     A 0.166 coil sitting at x ±0.15, y 0.685 — the forehead corners, a little
     in front of the face's surface so it frames the face from the front. The
     coil is built in the XY plane, so its flat side faces +Z: you look
     straight at the spiral. It winds clockwise from a root up and out, over
     the top and down, so 1.5 turns land the tip inward and down toward the
     eye. Tube 0.035 at the root easing to 0.022 at the tip.

     1.5 turns is 540 degrees, so the tip always ends up opposite the root —
     inward and down. At the brief's x ±0.12 that curl passes straight through
     the eye, so the pair sits out at ±0.15, just clear of it. */
  const HORN_R0 = 0.016, HORN_R1 = 0.048, HORN_TURNS = 1.5;
  for (const sx of [-1, 1]){
    const pts = [];
    const N = 40;
    for (let i = 0; i <= N; i++){
      const u = i / N;
      const a = 0.75 - u * TAU * HORN_TURNS;       // clockwise seen from the front
      const r = HORN_R1 + (HORN_R0 - HORN_R1) * u;
      pts.push(new THREE.Vector3(
        r * Math.cos(a),
        r * Math.sin(a),                           // the coil lies flat in XY
        -0.012 * u * u));                         // curling gently back into the skull
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const hg = new THREE.TubeGeometry(curve, N, 0.035, 9, false);
    // taper from a 0.035 root to a 0.022 tip
    const pos = hg.attributes.position, uvA = hg.attributes.uv, P = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++){
      const u = clamp(uvA.getX(i), 0, 1);
      curve.getPointAt(u, P);

      pos.setXYZ(i, P.x + (pos.getX(i) - P.x) * k,

function parzenicaCanvas(){
  const [c, g] = canvas2d(64, 64);
  g.fillStyle = '#F2EDE2'; g.fillRect(0, 0, 64, 64);
  // the heart, split down the middle: red on the wearer's right, navy on the left
  g.fillStyle = '#C8102E';
  g.beginPath();
  g.moveTo(32, 16);
  g.bezierCurveTo(46, 4, 60, 16, 60, 30);
  g.bezierCurveTo(60, 46, 44, 54, 32, 61);
  g.lineTo(32, 16);
  g.closePath(); g.fill();
  g.fillStyle = '#1E2A5E';
  g.beginPath();
  g.moveTo(32, 16);
  g.bezierCurveTo(18, 4, 4, 16, 4, 30);
  g.bezierCurveTo(4, 46, 20, 54, 32, 61);
  g.closePath(); g.fill();
  // the little teeth round the outline, and a stem
  g.strokeStyle = '#F2EDE2'; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 9; i++){
    const a = -0.35 + i * 0.42;
    const cx = 32 + Math.cos(a) * 26, cy = 34 + Math.sin(a) * 26;
    g.beginPath(); g.moveTo(cx, cy);
    g.lineTo(cx + Math.cos(a) * 7, cy + Math.sin(a) * 7); g.stroke();
  }
  return c;
}

function updateBaca(dt){
  const A = bacaAnim;
  A.shift = Math.sin(t * 0.62) * 0.5 + 0.5;
  A.wobble = lerp(A.wobble, shake.t >= 0 ? 1 : 0, 1 - Math.exp(-dt * 6));
  // he shifts his weight from one leg to the other, and looks across at his flock
  baca.rotation.z = (A.shift - 0.5) * 0.05 + Math.sin(t * 9) * 0.05 * A.wobble;
  bacaParts.head.rotation.y = Math.sin(t * 0.31) * 0.34;
  bacaParts.head.rotation.x = 0.06 + Math.sin(t * 0.44) * 0.05 - A.wobble * 0.12;
  // a whistle now and then
  A.nextWhistle -= dt;
  if (A.nextWhistle <= 0 && A.whistle <= 0){
    A.whistle = 1.2; A.nextWhistle = rr(7, 14);
  }
  let whistling = 0;
  if (A.whistle > 0){
    A.whistle -= dt;
    whistling = Math.sin(clamp(1 - A.whistle / 1.2, 0, 1) * Math.PI);
    if (A.whistle < 0.9 && A.whistle > 0.75) popBacaNotes(3, _bacaNote);
  }
  if (A.whistle <= 0 && bacaNotes.pool.visible){
    let any = false;
    for (const p of bacaNotes.list){
      if (p.life <= 0) continue;
      any = true;
      p.life -= dt;
      p.vel.y -= 1.1 * dt;
      p.sp.position.addScaledVector(p.vel, dt);
      p.sp.material.opacity = clamp(p.life / p.max, 0, 1);
      if (p.life <= 0){ p.sp.visible = false; p.sp.material.opacity = 0; }
    }
    bacaNotes.pool.visible = any;
  }
  // a click: he lifts the hat off and waves it
  if (A.hatUp > 0){
    A.hatUp -= dt;
    const k = clamp(1 - A.hatUp / 1.5, 0, 1);
    const up = Math.sin(Math.min(1, k * 1.5) * Math.PI);
    bacaParts.hat.position.y = 0.135 + up * 0.075;
    bacaParts.hat.rotation.z = Math.sin(t * 11) * 0.5 * up;
    bacaParts.hat.rotation.x = -up * 0.25;
  } else {
    bacaParts.hat.position.y = lerp(bacaParts.hat.position.y, 0.135, 0.15);
    bacaParts.hat.rotation.z = lerp(bacaParts.hat.rotation.z, 0, 0.15);
    bacaParts.hat.rotation.x = lerp(bacaParts.hat.rotation.x, 0, 0.15);
  }
  /* During the shake he leans his weight onto the ciupaga: the top swings in
     toward him, from -0.055 out to +0.10, which is 0.156 of lean at the grip.
     The foot never leaves the rock and the top never comes near his head. */
  bacaParts.ciupaga.rotation.z = lerp(bacaParts.ciupaga.rotation.z,
    -0.05 + A.wobble * 0.15, 0.12);
}

/* Five of them: three along the back, two on the right. Two real point lights
   for the lot — one back, one right — and the rest are emissive glass and a
   glow sprite, which is all the eye needs at this scale. */
const LAMP_GLASS_MAT = new THREE.MeshStandardMaterial({
  color: 0xFFE6B0, emissive: 0xFFC46A, emissiveIntensity: 1.0,
  roughness: 0.3, metalness: 0,
});
LAMP_GLASS_MAT.userData.glowScale = 0.9; glowMats.push(LAMP_GLASS_MAT);
const lampHalos = [];
const lampsGroup = new THREE.Group();
lampsGroup.position.y = PLAZA_Y;             // every lamp rides up with it

const LAMP_IRON = cardboard(0x1A1A1E);
const _lampIron = [], _lampFinial = [];
const LAMP_HEAD_Y = 1.555, LAMP_GLASS_H = 0.20;
function buildLamp(x, z, rot, withLight){
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  lampsGroup.add(g);
  const M = new THREE.Matrix4().compose(
    new THREE.Vector3(x, 0, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rot, 0)),
    new THREE.Vector3(1, 1, 1));
  const put = (geo, m) => _lampIron.push({ geo, matrix: new THREE.Matrix4().multiplyMatrices(M, m) });
  const putF = (geo, m) => _lampFinial.push({ geo, matrix: new THREE.Matrix4().multiplyMatrices(M, m) });
  // the plinth the post stands on, and the post itself
  for (const [w, h, d, y] of [[0.17, 0.055, 0.17, 0], [0.135, 0.075, 0.135, 0.062],
                              [0.10, 0.055, 0.10, 0.125]])
    put(boxGeo(w, h, d), new THREE.Matrix4().makeTranslation(0, y, 0));
  put(worldUV(new THREE.CylinderGeometry(0.022, 0.030, 1.34, 8)),
      new THREE.Matrix4().makeTranslation(0, 0.80, 0));
  put(worldUV(new THREE.CylinderGeometry(0.040, 0.030, 0.045, 8)),
      new THREE.Matrix4().makeTranslation(0, 0.30, 0));
  // the four corner posts, the sill and the little crown, all in the shared iron
  for (let i = 0; i < 4; i++){
    const a = (i / 4) * TAU + Math.PI / 4;
    put(boxGeo(0.014, 0.21, 0.014), new THREE.Matrix4()
      .makeTranslation(Math.cos(a) * 0.088, LAMP_HEAD_Y, Math.sin(a) * 0.088));
  }
  put(boxGeo(0.20, 0.022, 0.20), new THREE.Matrix4().makeTranslation(0, LAMP_HEAD_Y - 0.103, 0));
  put(new THREE.ConeGeometry(0.115, 0.075, 4),
      new THREE.Matrix4().makeTranslation(0, LAMP_HEAD_Y + 0.14, 0));
  put(boxGeo(0.020, 0.055, 0.020), new THREE.Matrix4().makeTranslation(0, LAMP_HEAD_Y + 0.202, 0));
  putF(new THREE.SphereGeometry(0.018, 10, 8),
       new THREE.Matrix4().makeTranslation(0, LAMP_HEAD_Y + 0.220, 0));

  /* THE LANTERN HEAD — its own group, sitting on top of the post. It owns the
     glass, the snow on the crown and the glow, so nothing can drift off it. */
  const head = new THREE.Group();
  head.position.y = LAMP_HEAD_Y;
  head.userData.dyn = true;                  // a pivot of its own: keep it whole
  g.add(head);
  const glass = new THREE.Mesh(
    worldUV(new THREE.CylinderGeometry(0.082, 0.098, LAMP_GLASS_H, 4, 1, true)),
    LAMP_GLASS_MAT);
  head.add(glass);
  /* The iron crown is a cone of base radius 0.115 and height 0.075 centred at
     LAMP_HEAD_Y + 0.14, so at y = LAMP_HEAD_Y + 0.1445 it is exactly 0.113
     across. A cap of that radius there wraps the crown with no overhang, and
     its point closes over the post below the finial. */
  const cap = new THREE.Mesh(
    worldUV(new THREE.ConeGeometry(0.113, 0.082, 4)), snowCapMat);
  // the cap hangs off the lantern head, which is ALREADY at LAMP_HEAD_Y, so
  // this is measured from the glass, not from the ground
  cap.position.y = 0.1445;
  cap.renderOrder = 2; cap.receiveShadow = true;
  head.add(cap); snowCaps.push(cap);
  // the glow: a soft additive sprite, the same trick as the dragon's halo.
  // depthTest stays on, so a lamp behind the szopka does not shine through it.
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: dotTex, color: 0xFFC98A, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
  }));
  halo.position.set(0, 0, 0);                // dead centre on the glass
  halo.scale.setScalar(LAMP_GLASS_H * 1.5);  // 1.5x the lantern, not 3.6x
  head.add(halo);
  lampHalos.push(halo);
  if (withLight){
    const pl = new THREE.PointLight(0xFFC98A, 0, 2.4, 2.0);
    pl.position.set(0, -0.035, 0);
    head.add(pl);
    lampLights.push({ light: pl, max: 1.5 });
  }
  markFootprint(x, z, 0.14, 0.14, 0);
  return g;
}

{   // one iron mesh and one finial for all five lamps — AFTER the five calls,

  const im = new THREE.Mesh(mergeGeos(_lampIron), LAMP_IRON);

function updateLamps(dt){
  // dim by day, alight at night — the same clock the windows use

/* -----------------------------------------------------------------------
   ONE wool InstancedMesh for every sheep on the island.
   Each sheep bakes its bubbles into the mesh through her own group matrix, so
   the whole flock — five animals, ~480 bubbles — is a single draw call. The
   per-sheep breathing and the shake wobble ride on the instance matrices, which
   are rewritten once a frame for the cost of a few hundred matrix composes.
   ----------------------------------------------------------------------- */
let SHEEP_WOOL_IM = null;
const _woolM = new THREE.Matrix4(), _woolP = new THREE.Vector3(),
      _woolQ = new THREE.Quaternion(), _woolS = new THREE.Vector3(),
      _woolC = new THREE.Color(),
      _woolInv = new THREE.Matrix4(), _woolT = new THREE.Matrix4();
function updateSheepWool(){
  const im = SHEEP_WOOL_IM;
  if (!im) return;
  // the mesh hangs off `island`, so its instance matrices have to be in
  // island-local space. inverse(island.matrixWorld) cancels the bob and roll
  // that updateIsland writes every frame, which would otherwise be counted
  // twice and shear the wool away from the sheep wearing it.
  _woolInv.copy(island.matrixWorld).invert();
  let k = 0;
  for (const f of SHEEP_FLOCK){
    f.g.updateMatrixWorld(true);
    _woolT.multiplyMatrices(_woolInv, f.g.matrixWorld);
    const pt = f.parts;
    const bx = pt.breathXZ === undefined ? 1 : pt.breathXZ;
    const by = pt.breathY === undefined ? 1 : pt.breathY;
    const jig = pt.jig || 0;
    for (let i = 0; i < f.wool.length; i++){
      const w = f.wool[i];
      let jx = 0, jy = 0, jz = 0;
      if (jig > 0.01){
        jx = (Math.random() - 0.5) * 0.03 * jig;
        jy = (Math.random() - 0.5) * 0.03 * jig;
        jz = (Math.random() - 0.5) * 0.03 * jig;
      }
      _woolM.compose(_woolP.set(w.x + jx, w.y + jy, w.z + jz), _woolQ,
                     _woolS.set(w.r * bx, w.r * by, w.r * bx));
      im.setMatrixAt(k + i, _woolM.premultiply(_woolT));
    }
    k += f.wool.length;
  }
  im.instanceMatrix.needsUpdate = true;
}
function buildSheepWool(){
  let total = 0;
  for (const f of SHEEP_FLOCK) total += f.wool.length;
  const im = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 24, 16), SHEEP_MAT.woolIM, total);
  im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;
  im.name = 'sheepWool';
  island.add(im);
  SHEEP_WOOL_IM = im;
  let k = 0;
  for (const f of SHEEP_FLOCK){
    _woolC.set(f.tint);
    for (let i = 0; i < f.wool.length; i++) im.setColorAt(k + i, _woolC);
    k += f.wool.length;
  }
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  updateSheepWool();
}

  ];
  for (const r of runs){
    const dx = r.x1 - r.x0, dz = r.z1 - r.z0;
    const len = Math.hypot(dx, dz);
    const ang = Math.atan2(dz, dx);
    const n = Math.max(2, Math.round(len / 0.72));
    for (let i = 0; i <= n; i++){

  {

      const dx = r.x1 - r.x0, dz = r.z1 - r.z0;
      const n = Math.max(2, Math.round(Math.hypot(dx, dz) / 0.72));
      for (let i = 0; i <= n; i++){
        const u = i / n;
        const px = r.x0 + dx * u, pz = r.z0 + dz * u;
        // a corner post belongs to two runs; one dome on it, not two
        const key = px.toFixed(3) + ',' + pz.toFixed(3);

  {

const _swM = new THREE.Matrix4(), _swP = new THREE.Vector3(),
      _swQ = new THREE.Quaternion(), _swS = new THREE.Vector3();
/* The lamb trots after whichever adult is grazing, in little hops, and never
   wanders out of the pen. */
const _lambQ = new THREE.Vector3();
function updateFlock(dt){
  const grownUp = SHEEP_FLOCK[1];         // the middle one, for the lamb to mind
  for (let i = 1; i < SHEEP_FLOCK.length; i++){
    const f = SHEEP_FLOCK[i], pt = f.parts, an = f.anim;
    // breathe, and shiver a little when the rock does
    const b = Math.sin(t * (1.05 + i * 0.17) + i * 1.7) * 0.5 + 0.5;
    pt.breathXZ = 1 + b * 0.014;
    pt.breathY = 1 + b * 0.011;
    pt.jig = (sheepAnim.jiggle || 0) * 0.6;
    // blink, on the same trick as the first sheep
    an.nextBlink -= dt;
    if (an.nextBlink <= 0 && an.blink <= 0){ an.blink = 0.14; an.nextBlink = rr(3, 7); }
    if (an.blink > 0) an.blink -= dt;
    const lid = an.blink > 0 ? Math.sin(clamp(an.blink / 0.14, 0, 1) * Math.PI) : 0;
    for (const m of f.meshes){
      if (m.isMesh && m.material && m.material === dragonMaterials[2]){
        m.scale.y = 1 - 0.85 * lid;
        m.scale.x = 1 + 0.12 * lid;
        m.scale.z = 1;
      }
    }
    // and a bell swing when she has been clicked
    an.ring = Math.max(0, an.ring - dt * 1.4);
    if (pt.bell){
      pt.bell.rotation.z = Math.sin(t * 3.1 + i) * 0.09
        + (shake.t >= 0 ? Math.sin(t * 15) * 0.5 : 0) + an.ring * 0.4;
    }
    // the little hop a click sets off
    let lift = 0;
    if (pt.hop > 0){
      pt.hop -= dt;
      const u = clamp(1 - pt.hop / 0.7, 0, 1);
      lift = Math.sin(u * Math.PI) * 0.13;
      pt.breathXZ *= 1 + Math.sin(u * Math.PI) * 0.10;
      pt.breathY *= 1 - Math.sin(u * Math.PI) * 0.10;
    }
    f.g.position.y = PLAZA_Y + (f.baseY || 0) + lift * (o_scale(f) || 1);
  }
  // the lamb trots after whichever adult is grazing, in little hops, and never
  // wanders out of the pen
  for (const a of flockAnim){
    a.wait -= dt;
    if (a.wait > 0) continue;
    _lambQ.set(PEN_X + 0.50, 0, PEN_Z - 0.34);
    const dx = _lambQ.x - a.home[0], dz = _lambQ.z - a.home[1];
    const d = Math.hypot(dx, dz);
    if (d < 0.16){ a.wait = rr(1.2, 2.6); continue; }
    const step = Math.min(d, 0.62 * dt + 0.02);
    a.home[0] = clamp(a.home[0] + dx / d * step,
                      PEN_X - PEN_HX + 0.35, PEN_X + PEN_HX - 0.35);
    // she stays in the strip in FRONT of the row, so the back view always sees
    // her first and never has an adult standing over her
    a.home[1] = clamp(a.home[1] + dz / d * step,
                      PEN_Z - PEN_HZ + 0.30, PEN_Z - 0.20);
    a.f.parts.hop = 0.30;                 // each step is its own little hop
    // she walks where she likes, but she looks out of the pen: clamp the
    // heading she trots toward into the outward cone, PI +- 0.436 (25 degrees)
    a.f.face = Math.PI + clamp(angWrap(Math.atan2(dz, dx) - Math.PI), -0.436, 0.436);
  }
  for (const a of flockAnim){
    a.f.g.position.x = a.home[0];
    a.f.g.position.z = a.home[1];
    if (a.f.face !== undefined)
      a.f.g.rotation.y = lerp(a.f.g.rotation.y, a.f.face, 0.08);
  }
}
/** An angle wrapped into (-PI, PI], so a lerp never takes the long way round. */
function angWrap(a){ a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
function o_scale(f){ return f.g.scale.y; }
/* A click on any of the flock: the same bouncy hop and "Beee!" as the first. */
function tapFlock(f){
  f.parts.hop = 0.7;
  f.anim.ring = 1;
  popFlockNotes(f);
  sfx('sheep-beee');
  sfx('sheep-bell', 0.55, 0.2);
}
function popFlockNotes(f){
  const pool = f.g.getObjectByName('flockNotes');
  if (!pool) return;
  let made = 0;
  for (const p of pool.userData.list){
    if (made >= 3) break;
    p.sp.position.set(0.10, 0.55, 0.22);
    p.vel.set(rr(-0.5, 0.5), rr(0.9, 1.7), rr(0.1, 0.6));
    p.life = p.max = rr(0.7, 1.2);
    p.sp.visible = true;
    made++;
  }
  pool.visible = true;
}
function updateFlockNotes(dt){
  for (let i = 1; i < SHEEP_FLOCK.length; i++){
    const pool = SHEEP_FLOCK[i].g.getObjectByName('flockNotes');
    if (!pool || !pool.visible) continue;
    let any = false;
    for (const p of pool.userData.list){
      if (p.life <= 0) continue;
      any = true;
      p.life -= dt;
      p.vel.y -= 1.1 * dt;
      p.sp.position.addScaledVector(p.vel, dt);
      p.sp.material.opacity = clamp(p.life / p.max, 0, 1);
      if (p.life <= 0){ p.sp.visible = false; p.sp.material.opacity = 0; }
    }
    pool.visible = any;
  }
}
function updateSheep(dt){
  const A = sheepAnim;
  // breathing: the cloud swells a couple of percent
  A.breath = Math.sin(t * 1.25) * 0.5 + 0.5;
  // the breathing now rides on the shared wool mesh's instance matrices
  sheepParts.breathXZ = 1 + A.breath * 0.015;
  sheepParts.breathY = 1 + A.breath * 0.012;
  // a blink every few seconds
  A.nextBlink -= dt;
  if (A.nextBlink <= 0 && A.blink <= 0){
    A.blink = 0.14; A.nextBlink = rr(3, 6);
  }
  if (A.blink > 0) A.blink -= dt;
  const lidK = A.blink > 0 ? clamp(A.blink / 0.14, 0, 1) : 0;
  for (const m of SHEEP_MESHES){
    if (m.isMesh && m.material && m.material === dragonMaterials[2]){
      const k = Math.sin(lidK * Math.PI);
      m.scale.y = 1 - 0.85 * k;
      m.scale.x = 1 + 0.12 * k;
      m.scale.z = 1;
    }
  }
  // a slow head tilt
  sheepParts.head.rotation.z = Math.sin(t * 0.55) * 0.07;
  /* She now stands on the dragon's side of the plaza, so when he breathes fire
     she flinches: a quick 0.10 hop straight away from his cave, a hard jingle of
     the bell, and then she settles back onto her spot. */
  A.flinchCool = Math.max(0, A.flinchCool - dt);
  if (fire.t >= 0 && A.flinchT <= 0 && A.flinchCool <= 0){
    A.flinchT = FLINCH_DUR; A.flinchCool = 1.4;
    popSheepNotes(3, true);
    sfx('sheep-bell', 0.4);
  }
  let flinchK = 0;
  if (A.flinchT > 0){
    A.flinchT -= dt;
    const u = clamp(1 - A.flinchT / FLINCH_DUR, 0, 1);
    /* A plain sin peaks at 1.0 but spends most of its time near the top, so she
       sat offset; the 0.6 exponent squares up the leading edge into a quick
       dart out and back, and still reaches the full FLINCH_BACK exactly. */
    flinchK = Math.pow(Math.sin(u * Math.PI), 0.6);
  }
  // a tiny happy hop every so often
  A.nextHop -= dt;
  if (A.nextHop <= 0 && A.hop <= 0 && A.ring <= 0 && A.flinchT <= 0){ A.hop = 0.7; A.nextHop = rr(8, 14); }
  let lift = 0, squash = 0;
  if (A.hop > 0){
    A.hop -= dt;
    const u = clamp(1 - A.hop / 0.7, 0, 1);
    lift = Math.sin(u * Math.PI) * 0.04;
    squash = 1 - Math.sin(u * Math.PI) * 0.10;
  }
  if (flinchK > 0){
    // directly away from the dragon, flattened onto the plaza
    _flinchB.copy(sheep.position).sub(dragon.getWorldPosition(_flinchA));
    _flinchB.y = 0;
    if (_flinchB.lengthSq() < 1e-6) _flinchB.set(1, 0, 0); else _flinchB.normalize();
    sheep.position.x = SHEEP_X + _flinchB.x * FLINCH_BACK * flinchK;
    sheep.position.z = SHEEP_Z + _flinchB.z * FLINCH_BACK * flinchK;
    if (rnd() < dt * 16) popSheepNotes(1, false);
  } else {
    sheep.position.x = SHEEP_X;
    sheep.position.z = SHEEP_Z;
  }
  sheep.position.y = PLAZA_Y + (lift + flinchK * 0.05) * SHEEP_H;
  if (squash){
    sheepParts.breathXZ *= 1 + (1 - squash);
    sheepParts.breathY *= squash;
  }
  // the bell swings, and rings wildly when the shake hits or she flinches
  A.ring = Math.max(0, A.ring - dt * 1.4);
  const shakeSwing = (shake.t >= 0) ? Math.sin(t * 17) * 0.9 : 0;
  sheepParts.bell.rotation.z = Math.sin(t * 3.1) * 0.10 + lift * 5 + shakeSwing
    + Math.sin(t * 26) * 0.45 * flinchK;
  sheepParts.clapper.position.x = Math.sin(t * 3.1 + 1) * 0.006;
  if ((shake.t >= 0) && A.ring <= 0 && rnd() < dt * 2.2) popSheepNotes(2, true);
  sheepShakeBellT = Math.max(0, sheepShakeBellT - dt);
  if (shake.t >= 0 && sheepShakeBellT <= 0){
    sheepShakeBellT = 0.4;
    sfx('sheep-bell', 0.4);
  }
  if (A.hop > 0 && A.hop < 0.45 && rnd() < 0.06) popSheepNotes(1, false);
  // the notes themselves
  let any = false;
  for (const p of sheepNotes.list){
    if (p.life <= 0) continue;
    any = true;
    p.life -= dt;
    p.vel.y -= 1.1 * dt;
    p.sp.position.addScaledVector(p.vel, dt);
    p.sp.material.opacity = clamp(p.life / p.max, 0, 1);
    p.sp.scale.setScalar(0.06 + (1 - p.life / p.max) * 0.05);
    if (p.life <= 0){ p.sp.visible = false; p.sp.material.opacity = 0; }
  }
  sheepNotes.pool.visible = any;
  // the shake makes the wool jiggle, then settle
  const wantJig = (shake.t >= 0) ? 1 : 0;
  A.jiggle += (wantJig - A.jiggle) * (1 - Math.exp(-dt * 4));
  sheepParts.jig = A.jiggle;
  updateSheepWool();
}
/** Clicked: a big bouncy hop, a squash on landing, the bell rings hard and a few
